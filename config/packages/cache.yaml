# Shopware Cache-Konfiguration
# Kapitel 6-8: HTTP-Cache, Application Cache, Datenbank

# Framework Cache (Symfony)
framework:
    cache:
        # Redis als Cache-Backend
        app: cache.adapter.redis
        system: cache.adapter.redis

        pools:
            # Produkt-Cache Pool
            cache.product:
                adapter: cache.adapter.redis
                default_lifetime: 3600  # 1 Stunde

            # Kategorie-Cache Pool
            cache.category:
                adapter: cache.adapter.redis
                default_lifetime: 7200  # 2 Stunden

# Shopware HTTP-Cache
shopware:
    http_cache:
        # HTTP-Cache aktivieren
        enabled: true

        # Default TTL für Seiten ohne explizite Header
        default_ttl: 7200  # 2 Stunden

        # Welche Seiten gecacht werden
        ignored_url_parameters:
            - 'pk_campaign'
            - 'pk_kwd'
            - 'pk_keyword'
            - 'utm_source'
            - 'utm_medium'
            - 'utm_campaign'
            - 'utm_term'
            - 'utm_content'
            - 'gclid'
            - 'fbclid'

        # Stale-While-Revalidate aktivieren
        stale_while_revalidate: 86400  # 24 Stunden
        stale_if_error: 86400

    # Cache-Invalidierung
    cache:
        invalidation:
            delay: 0
            count: 150

        # Redis für Shopware-Cache
        redis_url: '%env(REDIS_URL)%'
