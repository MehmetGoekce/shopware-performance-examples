name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ubuntu-24.04 fest statt ubuntu-latest: Das Label wechselt ab 2026-10-19
# auf Ubuntu 26.04 (actions/runner-images#14748), dort bricht
# "playwright install --with-deps" mit Playwright 1.57 ab, und apt liefert
# eine andere bats-Version als das lokale Testimage.
jobs:
  php:
    name: PHP Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyze

      - name: Run PHPUnit
        run: composer test

  javascript:
    name: JavaScript Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [php, javascript]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright Tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  varnish-vcl:
    name: Varnish VCL Syntax
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Compile chapter 6 VCL with the Shopware Varnish image
        run: |
          docker run --rm --entrypoint varnishd \
            -v "$PWD/chapters/06-http-cache/config/varnish.vcl:/etc/varnish/default.vcl:ro" \
            ghcr.io/shopware/varnish:6.7 \
            -C -f /etc/varnish/default.vcl > vcc.out 2>&1 \
            || { grep -A 8 "Message from VCC" vcc.out; exit 1; }

  mysql-cnf:
    name: MySQL Config Boot
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Ein reiner Syntaxcheck sagt hier nichts: MySQL startet auch dann
      # sauber, wenn es die Datei gar nicht liest. Dieser Job startet den
      # Server deshalb wirklich und prueft die Werte, die ankommen.
      - name: Boot MySQL 8.0 with the chapter 8 config
        run: |
          # Buffer Pool auf Runner-Groesse drosseln - die 4G aus der Datei
          # passen nicht in jeden GitHub-Runner. Alles andere bleibt original.
          sed 's/^innodb_buffer_pool_size = 4G/innodb_buffer_pool_size = 256M/' \
            chapters/08-database/config/shopware.cnf > shopware-ci.cnf

          docker create --name cnf-test -e MYSQL_ROOT_PASSWORD=root mysql:8.0.46
          docker cp shopware-ci.cnf cnf-test:/etc/mysql/conf.d/shopware.cnf
          docker start cnf-test
          sleep 3
          # mysqld laeuft als "mysql" und ignoriert die ganze includedir-
          # Direktive still, wenn es die Datei nicht lesen kann.
          docker exec -u root cnf-test chown root:root /etc/mysql/conf.d/shopware.cnf
          docker exec -u root cnf-test chmod 644 /etc/mysql/conf.d/shopware.cnf
          docker restart cnf-test

          for i in $(seq 1 60); do
            docker exec cnf-test mysql -uroot -proot -e "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done

          docker exec cnf-test mysql -uroot -proot -e "SELECT 1" > /dev/null 2>&1 || {
            echo "MySQL ist mit dieser Konfiguration nicht hochgekommen:"
            docker logs cnf-test 2>&1 | tail -30
            exit 1
          }

      - name: Assert the settings actually arrived
        run: |
          get() { docker exec cnf-test mysql -uroot -proot -N -B -e "SELECT $1" 2>/dev/null; }
          fail=0
          check() {
            local actual
            actual=$(get "$1")
            if [ "$actual" != "$2" ]; then
              echo "FEHLT: $1 ist '$actual', erwartet '$2'"
              fail=1
            else
              echo "ok: $1 = $actual"
            fi
          }
          check "@@group_concat_max_len" "320000"
          check "@@innodb_redo_log_capacity" "1073741824"
          check "@@log_queries_not_using_indexes" "0"
          check "@@binlog_expire_logs_seconds" "604800"
          check "@@long_query_time" "1.000000"
          check "@@performance_schema" "1"
          check "@@sql_mode" "STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"

          # innodb_log_file_size ist abgekuendigt und verdoppelt das Redo-Log
          # hinter dem Ruecken von SHOW VARIABLES - es darf nicht zurueckkehren.
          if grep -qE '^[[:space:]]*innodb_log_file_size' chapters/08-database/config/shopware.cnf; then
            echo "FEHLT: innodb_log_file_size steht wieder in der Konfiguration"
            fail=1
          fi

          docker logs cnf-test 2>&1 | grep -q "MY-013907" && {
            echo "FEHLT: MySQL meldet die innodb_log_file_size-Deprecation"
            fail=1
          }

          exit $fail

      - name: MariaDB must start with the documented substitution
        run: |
          # Die Datei ist MySQL-only und sagt das auch. Der Kopfkommentar nennt
          # zwei Direktiven, die MariaDB nicht kennt, und verweist auf die
          # MARIADB-Sektion am Dateiende. Dieser Schritt prueft, dass genau die
          # dort beschriebene Ersetzung MariaDB wirklich starten laesst.
          sed -e 's/^innodb_buffer_pool_size = 4G/innodb_buffer_pool_size = 256M/' \
              -e '/^innodb_buffer_pool_instances/d' \
              -e 's/^innodb_redo_log_capacity = 1G/innodb_log_file_size = 1G/' \
            chapters/08-database/config/shopware.cnf > maria.cnf

          docker create --name cnf-maria -e MARIADB_ROOT_PASSWORD=root mariadb:10.11
          docker cp maria.cnf cnf-maria:/etc/mysql/conf.d/shopware.cnf
          docker start cnf-maria
          sleep 3
          docker exec -u root cnf-maria chown root:root /etc/mysql/conf.d/shopware.cnf
          docker exec -u root cnf-maria chmod 644 /etc/mysql/conf.d/shopware.cnf
          docker restart cnf-maria

          for i in $(seq 1 60); do
            docker exec cnf-maria mariadb -uroot -proot -e "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done

          docker exec cnf-maria mariadb -uroot -proot -e "SELECT 1" > /dev/null 2>&1 || {
            echo "MariaDB kommt mit der dokumentierten Ersetzung nicht hoch:"
            docker logs cnf-maria 2>&1 | tail -20
            exit 1
          }
          echo "ok: MariaDB laeuft mit der dokumentierten Ersetzung"

          # Gegenprobe: die unveraenderte Datei MUSS MariaDB scheitern lassen -
          # sonst ist der Warnhinweis im Kopfkommentar falsch.
          sed 's/^innodb_buffer_pool_size = 4G/innodb_buffer_pool_size = 256M/' \
            chapters/08-database/config/shopware.cnf > maria-unchanged.cnf
          docker create --name cnf-maria-bad -e MARIADB_ROOT_PASSWORD=root mariadb:10.11
          docker cp maria-unchanged.cnf cnf-maria-bad:/etc/mysql/conf.d/shopware.cnf
          docker start cnf-maria-bad
          sleep 3
          docker exec -u root cnf-maria-bad chown root:root /etc/mysql/conf.d/shopware.cnf || true
          docker exec -u root cnf-maria-bad chmod 644 /etc/mysql/conf.d/shopware.cnf || true
          docker restart cnf-maria-bad || true
          sleep 20

          if docker logs cnf-maria-bad 2>&1 | grep -q "unknown variable 'innodb_redo_log_capacity"; then
            echo "ok: die unveraenderte Datei wird von MariaDB abgelehnt, wie dokumentiert"
          else
            echo "Der Warnhinweis im Kopfkommentar stimmt nicht mehr - MariaDB nimmt die Datei an."
            exit 1
          fi

      - name: Negative control - a broken config must be caught
        run: |
          # expire_logs_days neben binlog_expire_logs_seconds: MySQL startet,
          # ignoriert den Wert aber still. Der Job muss die Warnung sehen.
          sed -e 's/^innodb_buffer_pool_size = 4G/innodb_buffer_pool_size = 256M/' \
              -e 's/^# expire_logs_days = 7/expire_logs_days = 7/' \
            chapters/08-database/config/shopware.cnf > broken.cnf

          docker create --name cnf-broken -e MYSQL_ROOT_PASSWORD=root mysql:8.0.46
          docker cp broken.cnf cnf-broken:/etc/mysql/conf.d/shopware.cnf
          docker start cnf-broken
          sleep 3
          docker exec -u root cnf-broken chown root:root /etc/mysql/conf.d/shopware.cnf
          docker exec -u root cnf-broken chmod 644 /etc/mysql/conf.d/shopware.cnf
          docker restart cnf-broken
          sleep 25

          if docker logs cnf-broken 2>&1 | grep -q "MY-011079"; then
            echo "ok: die kaputte Variante wird erkannt (MY-011079)"
          else
            echo "Die Gegenprobe hat nicht angeschlagen - das Gate prueft nichts."
            exit 1
          fi

  php-fpm-pool:
    name: PHP-FPM Pool Boot
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # `php-fpm8.3 -t` reicht als Gate nicht: Es meldet auch dann Erfolg,
      # wenn OPcache gar nicht mehr geladen ist. Dieser Job startet den Pool
      # deshalb wirklich, schickt einen echten FastCGI-Request und prueft die
      # Werte, die dabei ankommen - plus zwei Gegenproben.
      - name: Boot the chapter 9 pool and assert the values arrive
        run: |
          docker run --rm -v "$PWD:/code:ro" ubuntu:24.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq > /dev/null
            apt-get install -y -qq php8.3-fpm php8.3-opcache libfcgi-bin > /dev/null

            mkdir -p /var/www /run/php
            printf "<?php \$s=opcache_get_status(false); echo \"OPCACHE=\", \$s?\"an\":\"aus\", \" KEYS=\", \$s[\"opcache_statistics\"][\"max_cached_keys\"] ?? 0, \" MEM=\", (int)(ini_get(\"opcache.memory_consumption\")), \"\n\";" > /var/www/probe.php

            cp /code/chapters/09-php-performance/config/shopware-fpm.conf /etc/php/8.3/fpm/pool.d/shopware.conf
            cp /code/chapters/09-php-performance/config/99-shopware-opcache.ini /etc/php/8.3/fpm/conf.d/
            mkdir -p /var/log/php-fpm && chown www-data:www-data /var/log/php-fpm

            # MEM-298: Kapitel 9, Anhang C und beide Vorlagen begruenden das
            # Abschalten von www.conf mit dessen Vorgaben - zwei Worker im
            # Leerlauf, hoechstens fuenf. Aendert das Paket sie, stimmt der Satz nicht mehr.
            WWW=/etc/php/8.3/fpm/pool.d/www.conf
            grep -qx "pm = dynamic" "$WWW" && grep -qx "pm.max_children = 5" "$WWW" \
              && grep -qx "pm.start_servers = 2" "$WWW" \
              || { echo "www.conf hat nicht mehr dynamic/5/2 - Kapitel 9 und Anhang C nachziehen"; exit 1; }
            echo "ok: www.conf ab Werk dynamic, max 5, start 2"

            # MEM-299: Kapitel 9, Anhang C und beide Vorlagen schalten www.conf
            # per mv auf www.conf.disabled ab. Das traegt nur, solange
            # php-fpm.conf allein pool.d/*.conf einliest - und solange ein
            # Reinstall die Datei nicht zurueckbringt.
            grep -qx "include=/etc/php/8.3/fpm/pool.d/\*.conf" /etc/php/8.3/fpm/php-fpm.conf \
              || { echo "php-fpm.conf liest pool.d nicht mehr als *.conf - der mv-Rat traegt nicht"; exit 1; }
            # Kapitel 9 sagt ausserdem: Den Sammel-Socket /run/php/php-fpm.sock
            # legt das Paket nur fuer www.conf an - mit ihr verschwindet er.
            grep -qF "php-fpm-socket-helper install /run/php/php-fpm.sock /etc/php/8.3/fpm/pool.d/www.conf" \
              /lib/systemd/system/php8.3-fpm.service \
              || { echo "Die Unit bindet den Sammel-Socket nicht mehr an www.conf - Kapitel 9 nachziehen"; exit 1; }
            mv "$WWW" "$WWW.disabled"
            [ ! -e "$WWW" ] && [ -e "$WWW.disabled" ] \
              || { echo "mv hat www.conf nicht umbenannt"; exit 1; }
            # policy-rc.d im Image verhindert, dass der Reinstall FPM startet.
            apt-get install -y -qq --reinstall php8.3-fpm > /dev/null 2>&1
            [ ! -e "$WWW" ] || { echo "Reinstall hat www.conf wieder angelegt - Kapitel 9 und Anhang C nachziehen"; exit 1; }
            echo "ok: www.conf.disabled bleibt aus, auch nach --reinstall"

            php-fpm8.3 -t
            php-fpm8.3 -D
            sleep 2
            pgrep -x php-fpm8.3 > /dev/null || { echo "FPM laeuft nicht"; exit 1; }
            # Ausgabe erst einfangen: grep -q hinter pipefail kann bei einem
            # Treffer falsch negativ werden (SIGPIPE, siehe Gegenprobe 3). Auf
            # den Zeilenanfang geankert: Die Kommandozeile dieses bash -c
            # enthaelt den Suchtext selbst und steht ebenfalls in ps.
            PS="$(ps -eo args)"
            if grep -q "^php-fpm: pool www" <<< "$PS"; then
              echo "Der Pool www laeuft trotz www.conf.disabled."; exit 1
            fi
            echo "ok: nur der Shopware-Pool laeuft"

            OUT="$(SCRIPT_FILENAME=/var/www/probe.php REQUEST_METHOD=GET SCRIPT_NAME=/probe.php \
                   cgi-fcgi -bind -connect /run/php/php8.3-fpm-shopware.sock 2>/dev/null | tail -1)"
            echo "Antwort: $OUT"
            case "$OUT" in
              *"OPCACHE=an"*"KEYS=32531"*"MEM=256"*)
                echo "ok: OPcache aktiv mit den Werten der Vorlage" ;;
              *)
                echo "Die Werte der Vorlage kommen nicht an."; exit 1 ;;
            esac

            # Der Pool selbst, nicht nur OPcache. Ohne diese drei Zusicherungen
            # laeuft das Gate auch fuer eine Vorlage durch, deren Timeouts
            # invertiert sind und deren Statusseite es gar nicht gibt.
            STATUS="$(SCRIPT_NAME=/fpm-status SCRIPT_FILENAME=/fpm-status REQUEST_METHOD=GET \
                      cgi-fcgi -bind -connect /run/php/php8.3-fpm-shopware.sock 2>/dev/null)"
            echo "$STATUS" | grep -q "pool:  *shopware" || { echo "Statusseite antwortet nicht aus dem Pool shopware"; exit 1; }
            echo "$STATUS" | grep -q "max children reached" || { echo "Statusausgabe unvollstaendig"; exit 1; }
            echo "ok: /fpm-status wird vom Pool beantwortet"

            POOL=/code/chapters/09-php-performance/config/shopware-fpm.conf
            MET="$(grep -oP "php_value\[max_execution_time\]\s*=\s*\K[0-9]+" "$POOL")"
            RTT="$(grep -oP "^request_terminate_timeout\s*=\s*\K[0-9]+" "$POOL")"
            [ "$RTT" -gt "$MET" ] || { echo "request_terminate_timeout ($RTT) muss ueber max_execution_time ($MET) liegen"; exit 1; }
            echo "ok: Timeouts gestaffelt ($MET < $RTT)"

            MC="$(grep -oP "^pm.max_children\s*=\s*\K[0-9]+" "$POOL")"
            [ "$MC" -le 100 ] || { echo "pm.max_children=$MC sprengt das 16-GB-Budget der Vorlage"; exit 1; }
            echo "ok: pm.max_children=$MC passt zum dokumentierten Budget"

            # Gegenprobe 1: Ohne das Logverzeichnis darf FPM nicht starten.
            # Genau daran scheiterte die alte Vorlage stillschweigend beim Leser.
            pkill -x php-fpm8.3 || true
            sleep 1
            rm -rf /var/log/php-fpm
            if php-fpm8.3 -t 2>&1 | grep -q "successful"; then
              echo "Gegenprobe 1 hat nicht angeschlagen - das Gate prueft nichts."
              exit 1
            fi
            echo "ok: fehlendes Logverzeichnis wird erkannt"
            mkdir -p /var/log/php-fpm && chown www-data:www-data /var/log/php-fpm

            # Gegenprobe 2: Der Zielpfad 10-opcache.ini ist auf Debian/Ubuntu
            # der Symlink der Distribution, der als einziger
            # zend_extension=opcache.so traegt. Wird er ueberschrieben, ist
            # OPcache weg - und `-t` meldet weiterhin Erfolg. Die Warnung in
            # der Vorlage steht und faellt mit diesem Verhalten.
            # Positivkontrolle: Ohne geladenes OPcache in der CLI waere die
            # CLI-Zusicherung unten trivial gruen.
            php -m | grep -qi "zend opcache" \
              || { echo "Gegenprobe 2: Die CLI laedt OPcache schon vorher nicht - die Probe waere wertlos."; exit 1; }
            cp /code/chapters/09-php-performance/config/99-shopware-opcache.ini /etc/php/8.3/fpm/conf.d/10-opcache.ini
            [ -L /etc/php/8.3/fpm/conf.d/10-opcache.ini ] \
              || { echo "Gegenprobe 2: 10-opcache.ini ist kein Symlink mehr - cp ist ihm nicht gefolgt."; exit 1; }
            # Nur wirksame Zeilen: die Vorlage nennt zend_extension im Kommentar.
            if grep -q "^zend_extension" /etc/php/8.3/mods-available/opcache.ini; then
              echo "Gegenprobe 2: mods-available/opcache.ini laedt noch zend_extension - cp hat sie nicht getroffen."
              exit 1
            fi
            if php-fpm8.3 -m | grep -qi "zend opcache"; then
              echo "Gegenprobe 2: OPcache ist noch geladen - die Warnung waere gegenstandslos."
              exit 1
            fi
            if ! php-fpm8.3 -t 2>&1 | grep -q "successful"; then
              echo "Gegenprobe 2: -t schlaegt an - dann waere der Ausfall nicht lautlos."
              exit 1
            fi
            # MEM-298: cp folgt dem Symlink und trifft mods-available/opcache.ini,
            # auf die auch die CLI zeigt. Vorlage und Kapitel sagen deshalb, dass
            # auch der CLI die Erweiterung danach fehlt.
            if php -m | grep -qi "zend opcache"; then
              echo "Gegenprobe 2: Die CLI laedt OPcache noch - der Satz zur CLI waere falsch."
              exit 1
            fi
            echo "ok: OPcache-Erweiterung weg in FPM und CLI, -t meldet trotzdem Erfolg"

            # Gegenprobe 3 (MEM-299): Der Reparaturweg aus Kapitel 9 und der
            # Vorlage. Erst die Behauptung, dass --reinstall NICHT hilft und
            # 20-opcache.ini anlegt, dann genau die Befehle aus dem Buch.
            MA=/etc/php/8.3/mods-available/opcache.ini
            apt-get install -y -qq --reinstall php8.3-opcache > /dev/null 2>&1
            if grep -q "^zend_extension" "$MA"; then
              echo "Gegenprobe 3: --reinstall hat die Datei repariert - Kapitel 9 sagt das Gegenteil."; exit 1
            fi
            [ -L /etc/php/8.3/fpm/conf.d/20-opcache.ini ] && [ -L /etc/php/8.3/cli/conf.d/20-opcache.ini ] \
              || { echo "Gegenprobe 3: --reinstall legt keine 20-opcache.ini mehr an - Kapitel 9 nachziehen."; exit 1; }
            cp /usr/share/php8.3-opcache/opcache/opcache.ini "$MA"
            # Ohne den rm-Schritt muss die Warnung kommen, sonst ist er ueberfluessig.
            # Ausgabe erst einfangen: Die Warnung steht in Zeile 1, grep -q
            # beendet sich dort, php stirbt an SIGPIPE, und pipefail meldet den
            # Treffer als Fehlschlag. FPM und CLI getrennt - das Buch sagt
            # "jeder Aufruf", und im Betrieb zaehlt FPM. Die Warnung geht auf
            # stderr, daher 2>&1.
            for BIN in php-fpm8.3 php; do
              PM="$($BIN -m 2>&1)"
              case "$PM" in
                *"already loaded"*) ;;
                *) echo "Gegenprobe 3: keine Doppel-Lade-Warnung in $BIN - der rm-Schritt waere ueberfluessig."; exit 1 ;;
              esac
            done
            rm -f /etc/php/8.3/*/conf.d/20-opcache.ini
            for BIN in php-fpm8.3 php; do
              PM="$($BIN -m 2>&1)"
              case "$PM" in
                *"already loaded"*) echo "Gegenprobe 3: Nach der Reparatur noch die Doppel-Lade-Warnung in $BIN."; exit 1 ;;
                *"Zend OPcache"*) ;;
                *) echo "Gegenprobe 3: Nach der Reparatur fehlt OPcache in $BIN."; exit 1 ;;
              esac
            done
            echo "ok: --reinstall hilft nicht, cp + rm aus dem Buch laden OPcache wieder (FPM und CLI, ohne Warnung)"
          '

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './chapters'
          additional_files: '*.sh'
          severity: warning

  nginx-conf:
    name: Nginx Config Syntax
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Validate chapter 11 CDN header config
        run: |
          cat > nginx-test.conf <<'CONF'
          events {}
          http {
              server {
                  listen 8080;
                  root /usr/share/nginx/html;

                  location / {
                      try_files $uri /index.php$is_args$args;
                  }

                  include /etc/nginx/ch11-cdn-headers.conf;

                  location ~ \.php$ {
                      return 404;
                  }
              }
          }
          CONF
          docker run --rm \
            -v "$PWD/nginx-test.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/chapters/11-cdn-integration/config/nginx-cdn-headers.conf:/etc/nginx/ch11-cdn-headers.conf:ro" \
            nginx:alpine nginx -t

      - name: Validate chapter 11 HTTP/3 config
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout key.pem -out cert.pem -subj "/CN=shop.example" 2>/dev/null
          mkdir -p tls && mv key.pem cert.pem tls/
          cat > http3-test.conf <<'CONF'
          events {}
          http {
              server {
                  server_name shop.example;
                  ssl_certificate     /etc/nginx/tls/cert.pem;
                  ssl_certificate_key /etc/nginx/tls/key.pem;
                  include /etc/nginx/ch11-http3.conf;
                  location / { return 200 "ok"; }
              }
          }
          CONF
          docker run --rm \
            -v "$PWD/http3-test.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/chapters/11-cdn-integration/config/nginx-http3.conf:/etc/nginx/ch11-http3.conf:ro" \
            -v "$PWD/tls:/etc/nginx/tls:ro" \
            nginx:alpine nginx -t

      - name: Validate chapter 11 Brotli config
        run: |
          cat > brotli-test.conf <<'CONF'
          events {}
          http {
              include /etc/nginx/ch11-brotli.conf;
              server {
                  listen 8080;
                  location / { return 200 "ok"; }
              }
          }
          CONF
          # Das offizielle nginx-Image bringt ngx_brotli nicht mit.
          docker run --rm --entrypoint nginx \
            -v "$PWD/brotli-test.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/chapters/11-cdn-integration/config/nginx-brotli.conf:/etc/nginx/ch11-brotli.conf:ro" \
            fholzer/nginx-brotli:latest -t

  appendix-configs:
    name: Anhang C Config Syntax
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Validate the Nginx vHost
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout privkey.pem -out fullchain.pem -subj "/CN=shop.example.com" 2>/dev/null
          mkdir -p le && mv privkey.pem fullchain.pem le/
          cat > nginx-test.conf <<'CONF'
          events {}
          http {
              include /etc/nginx/anhang-c-shopware.conf;
          }
          CONF
          docker run --rm \
            -v "$PWD/nginx-test.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/chapters/anhang-c-konfigurationen/config/nginx-shopware.conf:/etc/nginx/anhang-c-shopware.conf:ro" \
            -v "$PWD/le:/etc/letsencrypt/live/shop.example.com:ro" \
            nginx:1.27 nginx -t

      - name: Check what the Nginx vHost actually answers
        run: |
          # nginx -t sagt nur, dass die Datei parst. Die drei Fallen, die die
          # Vorlage zu vermeiden vorgibt, gehen durch eine reine Syntaxpruefung
          # alle hindurch - deshalb hier echte Antworten.
          cat > nginx-live.conf <<'CONF'
          events {}
          http {
              include /etc/nginx/anhang-c-shopware.conf;
          }
          CONF
          mkdir -p www/theme acme/.well-known/acme-challenge
          echo "body{}" > www/theme/all.css
          echo "token" > acme/.well-known/acme-challenge/tok
          docker run -d --name nginx-live \
            -v "$PWD/nginx-live.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/chapters/anhang-c-konfigurationen/config/nginx-shopware.conf:/etc/nginx/anhang-c-shopware.conf:ro" \
            -v "$PWD/le:/etc/letsencrypt/live/shop.example.com:ro" \
            -v "$PWD/www:/var/www/shopware/public:ro" \
            -v "$PWD/acme:/var/www/html:ro" \
            -p 127.0.0.1:8443:443 nginx:1.27
          for i in $(seq 1 20); do
            curl -sk -o /dev/null --resolve shop.example.com:8443:127.0.0.1 \
              https://shop.example.com:8443/theme/all.css && break
            sleep 1
          done
          curl -sk -D headers.txt -o /dev/null --resolve shop.example.com:8443:127.0.0.1 \
            https://shop.example.com:8443/theme/all.css
          cat headers.txt

          fail=0
          # Falle 1: genau EIN Cache-Control
          n=$(grep -ci '^cache-control:' headers.txt)
          [ "$n" = "1" ] || { echo "FAIL: $n Cache-Control-Header statt 1"; fail=1; }
          # Falle 2: alle drei Security-Header auch auf der Asset-Antwort
          for h in x-frame-options x-content-type-options referrer-policy; do
            grep -qi "^$h:" headers.txt || { echo "FAIL: $h fehlt auf /theme/"; fail=1; }
          done
          # Falle 3: ACME-Challenge kommt durch die Punkt-Regel
          code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve shop.example.com:8443:127.0.0.1 \
            https://shop.example.com:8443/.well-known/acme-challenge/tok)
          [ "$code" = "200" ] || { echo "FAIL: ACME-Challenge antwortet $code statt 200"; fail=1; }

          docker rm -f nginx-live >/dev/null
          exit $fail

      - name: Counter-check the conf.d readability claim
        run: |
          # Gegenprobe zu MEM-280. Kapitel 22 und die Companion-Vorlage haben
          # behauptet, eine fuer den PHP-Benutzer unlesbare conf.d-Datei werde
          # stillschweigend uebergangen und ihre Werte gaelten nicht. Gemessen
          # ist das Gegenteil: Der FPM-Master liest conf.d als root, bevor er
          # die Worker herunterstuft. Still ist die KONTROLLE, nicht das Laden.
          #
          # Ein reines "php-fpm -t" faengt das nicht - es sagt zu jeder dieser
          # Varianten "test is successful". Dieser Schritt startet deshalb
          # einen echten Pool und stellt einen echten FastCGI-Request.
          cat > conf-d-gate.sh <<'GATE'
          set -e
          docker-php-ext-enable opcache
          apt-get -qq update >/dev/null && apt-get -qq install -y libfcgi-bin procps >/dev/null
          mkdir -p /var/log/php-fpm /run/php /www
          printf 'opcache.enable=1\nopcache.memory_consumption=333\n' \
            > /usr/local/etc/php/conf.d/99-probe.ini
          chown root:root /usr/local/etc/php/conf.d/99-probe.ini
          chmod 0600 /usr/local/etc/php/conf.d/99-probe.ini
          su -s /bin/sh www-data -c 'cat /usr/local/etc/php/conf.d/99-probe.ini' 2>/dev/null \
            && { echo "FAIL: www-data kann die Datei lesen, Praemisse kaputt"; exit 1; }
          printf '<?php echo "MEM=", ini_get("opcache.memory_consumption"), "\\n";' > /www/p.php
          chmod 644 /www/p.php
          php-fpm -D
          sleep 2
          fail=0
          # 1. Echter Request durch den Pool: die 0600-Datei GILT.
          got=$(SCRIPT_FILENAME=/www/p.php REQUEST_METHOD=GET SCRIPT_NAME=/p.php \
                cgi-fcgi -bind -connect 127.0.0.1:9000 | tr -d '\r' | sed -n 's/^MEM=//p')
          [ "$got" = "333" ] || { echo "FAIL: echter Request meldet MEM=$got statt 333"; fail=1; }
          # 2. "php-fpm -i" als unprivilegierter Benutzer meldet den Vorgabewert.
          unpriv=$(su -s /bin/sh www-data -c 'php-fpm -i' 2>/dev/null \
                   | sed -n 's/^opcache.memory_consumption => \([0-9]*\).*/\1/p' | head -1)
          [ -n "$unpriv" ] && [ "$unpriv" != "333" ] \
            || { echo "FAIL: -i als www-data meldet '$unpriv', erwartet war der Vorgabewert"; fail=1; }
          # 3. Und warnt dabei mit keinem Wort - deshalb faellt es niemandem auf.
          warn=$(su -s /bin/sh www-data -c 'php-fpm -i' 2>&1 >/dev/null \
                 | grep -ci 'permission\|denied' || true)
          [ "$warn" = "0" ] || { echo "FAIL: -i als www-data warnt doch ($warn Zeilen)"; fail=1; }
          [ "$fail" = "0" ] \
            && echo "OK: 0600-Datei gilt (MEM=$got), unprivilegierte Kontrolle meldet $unpriv ohne Warnung"
          exit $fail
          GATE
          # Ohne Pool-Mount: Die Zusicherung geht ueber Port 9000, also den
          # [www]-Pool des Images. Der Shopware-Pool heisst [shopware] und
          # hoert auf einem Socket - er wuerde nie angesprochen, waere aber in
          # der Lage, den Schritt mit Exit 78 unter einer Ueberschrift zu
          # toeten, die von conf.d spricht. Die Pool-Vorlage (seit MEM-288
          # nur noch die aus Kapitel 9) bootet im Job php-fpm-pool.
          docker run --rm \
            -v "$PWD/conf-d-gate.sh:/gate.sh:ro" \
            php:8.3-fpm bash /gate.sh

      - name: Validate the MySQL config
        run: |
          # --validate-config faengt Tippfehler und unbekannte Variablen ab.
          # NICHT gemeldet werden abgekuendigte Direktiven (die Warnung
          # MY-013907 zu innodb_log_file_size erscheint erst beim echten
          # Start) und Werte ausserhalb des gueltigen Bereichs
          # (innodb_buffer_pool_instances = 999 geht durch).
          docker run --rm --entrypoint mysqld \
            -v "$PWD/chapters/anhang-c-konfigurationen/config/mysql-shopware.cnf:/etc/mysql/conf.d/shopware.cnf:ro" \
            mysql:8.0 --validate-config

      - name: Validate the Supervisor config
        run: |
          cat > supervisord-test.conf <<'CONF'
          [supervisord]
          logfile=/tmp/supervisord.log
          pidfile=/tmp/supervisord.pid
          nodaemon=true
          [include]
          files = /etc/supervisor/conf.d/*.conf
          CONF
          docker run --rm \
            -v "$PWD/supervisord-test.conf:/tmp/supervisord.conf:ro" \
            -v "$PWD/chapters/anhang-c-konfigurationen/config/supervisor-shopware.conf:/tmp/shopware-worker.conf:ro" \
            python:3.12-slim bash -c '
              # Version festnageln: ohne sie kippt ein Release das Gate ohne
              # Commit im Repo.
              pip -q install 'supervisor==4.3.0'
              mkdir -p /etc/supervisor/conf.d /var/log/supervisor /var/www/shopware/bin
              cp /tmp/shopware-worker.conf /etc/supervisor/conf.d/
              printf "#!/bin/sh\nsleep 60\n" > /var/www/shopware/bin/console
              chmod +x /var/www/shopware/bin/console
              ln -sf /bin/sh /usr/bin/php
              useradd -M www-data 2>/dev/null || true
              # "spawned" allein reicht nicht: ein Programm, das sofort
              # stirbt, wird auch gespawnt. Geprueft wird der RUNNING-Zustand
              # nach startsecs=10 - den erreicht nur, was wirklich laeuft.
              # Die greps mit && verketten, sonst entscheidet nur der letzte
              # ueber den Exit-Code.
              #
              # Grenze des Schritts: php und bin/console sind gestubt, ein
              # Tippfehler im Shopware-Befehl selbst faellt hier nicht auf.
              set -e
              timeout --preserve-status 25 supervisord -c /tmp/supervisord.conf -n > /tmp/out 2>&1
              cat /tmp/out
              grep -q "success: shopware-worker_00 entered RUNNING state" /tmp/out \
                && grep -q "success: shopware-worker_01 entered RUNNING state" /tmp/out \
                && grep -q "success: shopware-scheduled-task entered RUNNING state" /tmp/out
            '

  bats:
    name: BATS Shell Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # bats aus dem Ubuntu-Paket (1.10.0 auf 24.04) wie im lokalen Testimage;
      # bats-core/bats-action nutzt intern noch actions/cache@v4 (node20)
      - name: Setup BATS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats && bats --version

      # plugin-scripts.bats (Kapitel 17) überspringt ohne php - hier
      # soll ein fehlendes php den Job rot machen, nicht still grün.
      - name: PHP vorhanden
        run: php --version

      # http-cache-scripts.bats prueft make cache-warmup und ueberspringt ohne make.
      - name: make vorhanden
        run: make --version

      # lighthouse-mobile.bats (Kapitel 19) ueberspringt ohne jq.
      - name: jq vorhanden
        run: jq --version

      - name: Run BATS Tests
        run: bats tests/Shell/
