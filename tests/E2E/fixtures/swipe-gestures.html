<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swipe Gestures Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; padding: 20px; }

        .test-area {
            width: 300px;
            height: 200px;
            background: #f0f0f0;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: pan-y;
            user-select: none;
        }

        .gallery-container {
            width: 300px;
            overflow: hidden;
            border: 2px solid #666;
            margin-top: 20px;
        }

        .swipe-list {
            list-style: none;
            margin-top: 20px;
        }

        .swipe-list li {
            padding: 15px;
            border: 1px solid #ccc;
            margin: 5px 0;
        }

        #log {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }

        .log-entry { margin: 2px 0; }
        .log-left { color: #d32f2f; }
        .log-right { color: #388e3c; }
        .log-up { color: #1976d2; }
        .log-down { color: #f57c00; }
    </style>
</head>
<body>
    <h1>Swipe Gesture Tests</h1>

    <h2>1. Basic Swipe Detection</h2>
    <div id="swipe-area" class="test-area">
        Swipe here
    </div>

    <h2>2. Product Gallery</h2>
    <div id="gallery" class="gallery-container"></div>

    <h2>3. Swipe to Delete</h2>
    <ul id="swipe-list" class="swipe-list">
        <li data-id="1">Item 1 - Swipe left to delete</li>
        <li data-id="2">Item 2 - Swipe left to delete</li>
        <li data-id="3">Item 3 - Swipe left to delete</li>
    </ul>

    <div id="log">
        <strong>Event Log:</strong>
    </div>

    <script type="module">
        import { SwipeGesture, ProductGallery, SwipeToDelete }
            from '/chapters/19-mobile-performance/src/TouchOptimization/swipe-gestures.js';

        const log = document.getElementById('log');

        function addLog(message, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type ? 'log-' + type : ''}`;
            entry.textContent = `[${new Date().toISOString().substr(11, 8)}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 1. Basic Swipe Detection
        const swipeArea = document.getElementById('swipe-area');
        window.swipeGesture = new SwipeGesture(swipeArea, {
            threshold: 50,
            onSwipeLeft: () => {
                addLog('Swipe LEFT detected', 'left');
                swipeArea.dataset.lastSwipe = 'left';
            },
            onSwipeRight: () => {
                addLog('Swipe RIGHT detected', 'right');
                swipeArea.dataset.lastSwipe = 'right';
            },
            onSwipeUp: () => {
                addLog('Swipe UP detected', 'up');
                swipeArea.dataset.lastSwipe = 'up';
            },
            onSwipeDown: () => {
                addLog('Swipe DOWN detected', 'down');
                swipeArea.dataset.lastSwipe = 'down';
            }
        });

        // 2. Product Gallery
        const galleryEl = document.getElementById('gallery');
        window.gallery = new ProductGallery(galleryEl, [
            { src: 'https://picsum.photos/300/200?1', alt: 'Product 1' },
            { src: 'https://picsum.photos/300/200?2', alt: 'Product 2' },
            { src: 'https://picsum.photos/300/200?3', alt: 'Product 3' },
        ], { loop: true });

        // 3. Swipe to Delete
        const listItems = document.querySelectorAll('#swipe-list li');
        window.swipeDeleteInstances = [];

        listItems.forEach(item => {
            const instance = new SwipeToDelete(item, {
                threshold: 0.4,
                onDelete: () => {
                    const id = item.dataset.id;
                    addLog(`Item ${id} deleted`, 'left');
                    item.remove();
                }
            });
            window.swipeDeleteInstances.push(instance);
        });

        addLog('Swipe gestures initialized');
        window.testReady = true;
    </script>
</body>
</html>
