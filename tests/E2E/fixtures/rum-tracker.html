<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUM Tracker Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; padding: 20px; }

        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .metric-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-card .name { font-size: 14px; color: #666; }
        .metric-card .value { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .metric-card .rating { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .metric-card .rating.good { background: #4caf50; color: white; }
        .metric-card .rating.needs-improvement { background: #ff9800; color: white; }
        .metric-card .rating.poor { background: #f44336; color: white; }

        #lcp-element {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-top: 20px;
        }

        .interactive-element {
            padding: 15px 30px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }

        #log {
            margin-top: 20px;
            padding: 10px;
            background: #1e1e1e;
            color: #0f0;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>RUM Tracker Test Page</h1>

    <div class="test-section">
        <h2>Core Web Vitals</h2>
        <div id="metrics" class="metric-display">
            <div class="metric-card" id="lcp-card">
                <div class="name">LCP</div>
                <div class="value" id="lcp-value">--</div>
                <div class="rating" id="lcp-rating">Waiting...</div>
            </div>
            <div class="metric-card" id="cls-card">
                <div class="name">CLS</div>
                <div class="value" id="cls-value">--</div>
                <div class="rating" id="cls-rating">Waiting...</div>
            </div>
            <div class="metric-card" id="inp-card">
                <div class="name">INP</div>
                <div class="value" id="inp-value">--</div>
                <div class="rating" id="inp-rating">Waiting...</div>
            </div>
            <div class="metric-card" id="fcp-card">
                <div class="name">FCP</div>
                <div class="value" id="fcp-value">--</div>
                <div class="rating" id="fcp-rating">Waiting...</div>
            </div>
            <div class="metric-card" id="ttfb-card">
                <div class="name">TTFB</div>
                <div class="value" id="ttfb-value">--</div>
                <div class="rating" id="ttfb-rating">Waiting...</div>
            </div>
        </div>
    </div>

    <div class="test-section">
        <h2>LCP Element</h2>
        <div id="lcp-element">Largest Contentful Paint Element</div>
    </div>

    <div class="test-section">
        <h2>INP Test (Click/Tap these buttons)</h2>
        <button class="interactive-element" id="btn-fast">Fast Response</button>
        <button class="interactive-element" id="btn-slow">Slow Response (200ms)</button>
    </div>

    <div id="log">
        <strong>RUM Events Log:</strong><br>
    </div>

    <script>
        // Collected metrics storage
        window.collectedMetrics = [];

        // Mock gtag if not present
        if (typeof gtag === 'undefined') {
            window.gtag = function(...args) {
                console.log('[Mock gtag]', ...args);
                window.gtagCalls = window.gtagCalls || [];
                window.gtagCalls.push(args);
            };
        }

        // Mock sendBeacon to capture calls
        const originalSendBeacon = navigator.sendBeacon;
        navigator.sendBeacon = function(url, data) {
            window.beaconCalls = window.beaconCalls || [];
            const parsed = JSON.parse(data);
            window.beaconCalls.push({ url, data: parsed });
            window.collectedMetrics.push(parsed);

            addLog(`Beacon: ${parsed.name} = ${parsed.value.toFixed(2)} (${parsed.rating})`);
            updateMetricDisplay(parsed);

            // Still call original if available
            if (originalSendBeacon) {
                return originalSendBeacon.call(navigator, url, data);
            }
            return true;
        };

        function addLog(message) {
            const log = document.getElementById('log');
            log.innerHTML += `[${new Date().toISOString().substr(11, 12)}] ${message}<br>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateMetricDisplay(metric) {
            const name = metric.name.toLowerCase();
            const valueEl = document.getElementById(`${name}-value`);
            const ratingEl = document.getElementById(`${name}-rating`);

            if (valueEl && ratingEl) {
                valueEl.textContent = name === 'cls'
                    ? metric.value.toFixed(3)
                    : Math.round(metric.value) + 'ms';
                ratingEl.textContent = metric.rating;
                ratingEl.className = `rating ${metric.rating}`;
            }
        }

        // Button handlers for INP testing
        document.getElementById('btn-fast').addEventListener('click', () => {
            addLog('Fast button clicked');
        });

        document.getElementById('btn-slow').addEventListener('click', () => {
            // Simulate slow processing
            const start = Date.now();
            while (Date.now() - start < 200) {
                // Blocking loop
            }
            addLog('Slow button clicked (200ms delay)');
        });

        addLog('Test page initialized');
    </script>

    <script type="module">
        // Override CONFIG before importing
        window.RUM_CONFIG = {
            endpoint: '/api/rum',
            debug: true,
            samplingRate: 1,
            ga4: { enabled: true }
        };

        // Import the RUM tracker
        import { onCLS, onINP, onLCP, onFCP, onTTFB }
            from 'https://unpkg.com/web-vitals@4/dist/web-vitals.attribution.js?module';

        function sendToAnalytics(metric) {
            const data = {
                name: metric.name,
                value: metric.value,
                rating: metric.rating,
                delta: metric.delta,
                id: metric.id,
                page: window.location.pathname,
                timestamp: Date.now()
            };

            window.collectedMetrics.push(data);

            // Use mocked sendBeacon
            navigator.sendBeacon('/api/rum', JSON.stringify(data));
        }

        onCLS(sendToAnalytics);
        onINP(sendToAnalytics);
        onLCP(sendToAnalytics);
        onFCP(sendToAnalytics);
        onTTFB(sendToAnalytics);

        window.testReady = true;
        console.log('[RUM] Test tracker initialized');
    </script>
</body>
</html>
