# Kapitel 24: QUIC Performance-Tuning
# Ausblick – Neue Technologien und Trends
#
# Erweiterte QUIC-Einstellungen für optimale Performance
# Einfügen in nginx.conf http{} Block

# QUIC-spezifische Optimierungen
http {
    # ============================================
    # QUIC/HTTP3 Basis-Konfiguration
    # ============================================

    # SSL Session Cache (auch für QUIC relevant)
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;  # Für bessere Forward Secrecy

    # TLS 1.3 Ciphers (Pflicht für HTTP/3)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # OCSP Stapling (schnellere TLS-Validierung)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ============================================
    # QUIC-spezifische Tuning-Parameter
    # ============================================

    # GSO (Generic Segmentation Offload)
    # Reduziert CPU-Last bei hohem Traffic
    # Benötigt Kernel 4.18+ und kompatible NIC
    quic_gso on;

    # BPF (Berkeley Packet Filter) für bessere Performance
    # Benötigt Kernel 5.7+ und Nginx mit --with-quic_bpf
    # quic_bpf on;

    # ============================================
    # Connection Limits
    # ============================================

    # Max gleichzeitige Streams pro QUIC-Verbindung
    # Höher = mehr parallele Requests, aber mehr Speicher
    # quic_max_streams 128;

    # Max Datenmenge pro Stream (in Bytes)
    # quic_max_stream_data_size 1m;

    # ============================================
    # Timeouts
    # ============================================

    # Idle-Timeout für QUIC-Verbindungen
    # Länger = bessere Connection-Reuse
    # quic_idle_timeout 60s;

    # Handshake-Timeout
    # quic_handshake_timeout 10s;

    # ============================================
    # Kernel-Parameter (sysctl.conf)
    # ============================================
    # Diese Werte in /etc/sysctl.conf setzen:
    #
    # # UDP Buffer Size erhöhen (wichtig für QUIC)
    # net.core.rmem_max = 26214400
    # net.core.wmem_max = 26214400
    # net.core.rmem_default = 1048576
    # net.core.wmem_default = 1048576
    #
    # # UDP Receive Buffer
    # net.ipv4.udp_rmem_min = 8192
    # net.ipv4.udp_wmem_min = 8192
    #
    # # Netfilter für QUIC
    # net.netfilter.nf_conntrack_udp_timeout = 120
    # net.netfilter.nf_conntrack_udp_timeout_stream = 180
    #
    # Anwenden mit: sysctl -p

    # ============================================
    # Monitoring
    # ============================================

    # Log-Format mit HTTP/3 Info
    log_format quic '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'quic="$http3" early_data="$ssl_early_data"';

    # Separates Access-Log für QUIC-Analyse
    # access_log /var/log/nginx/quic_access.log quic;
}
