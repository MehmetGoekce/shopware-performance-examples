# Kapitel 24: HTTP/3 mit QUIC für Nginx
# Ausblick – Neue Technologien und Trends
#
# Voraussetzung: Nginx 1.25+ mit QUIC-Support
# Prüfen: nginx -V 2>&1 | grep -o 'quic'

# Upstream-Block für Shopware
upstream shopware {
    server 127.0.0.1:9000;  # PHP-FPM
    keepalive 32;
}

server {
    # HTTP/2 und HTTP/3 parallel
    listen 443 ssl;
    listen 443 quic reuseport;

    # HTTP/2 explizit aktivieren (Nginx 1.25+)
    http2 on;

    # HTTP/3 aktivieren
    http3 on;

    server_name shop.example.com;
    root /var/www/shopware/public;

    # TLS-Zertifikate
    ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    # TLS 1.3 erforderlich für HTTP/3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # QUIC-spezifische Einstellungen
    # Alt-Svc Header: Browser informieren, dass HTTP/3 verfügbar ist
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # QUIC-Retry für DDoS-Schutz (empfohlen für Production)
    quic_retry on;

    # 0-RTT (Early Data) - schnellerer Verbindungsaufbau
    # Vorsicht: Replay-Attacken möglich bei nicht-idempotenten Requests
    ssl_early_data on;

    # Proxy-Header für 0-RTT Schutz
    proxy_set_header Early-Data $ssl_early_data;

    # Connection-ID Token für Verbindungsmigration (WiFi → Mobil)
    quic_gso on;

    # Standard Shopware-Konfiguration
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass shopware;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # HTTP/3 Info an PHP weitergeben
        fastcgi_param HTTP_X_QUIC $http3;
    }

    # Statische Assets mit langen Cache-Zeiten
    location ~* \.(css|js|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Alt-Svc auch für Assets
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }
}

# HTTP zu HTTPS Redirect
server {
    listen 80;
    server_name shop.example.com;
    return 301 https://$server_name$request_uri;
}
