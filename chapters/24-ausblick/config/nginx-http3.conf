# HTTP/3 (QUIC) fuer den Shopware-vHost - nur das Delta
# Kapitel 24: Ausblick
#
# Datei: /etc/nginx/snippets/shopware-http3.conf
#        Im server-Block fuer 443 von /etc/nginx/sites-available/shopware.conf
#        (Anhang C) direkt unter die beiden listen-Zeilen setzen:
#            include snippets/shopware-http3.conf;
#        sudo nginx -t 2>&1 | grep -E 'emerg|conflicting server name'
#        sudo systemctl reload nginx
#
# Diese Datei ist KEIN eigener vHost, und sie gehoert auf Server-Ebene, nicht
# in eine location. Bis September 2026 lag hier ein kompletter server-Block
# fuer shop.example.com auf 443 (MEM-318). Neben dem vHost aus Anhang C
# meldet nginx dann nur "conflicting server name ... ignored", `nginx -t`
# meldet Erfolg - und der Block ist nicht still ohne Wirkung: Auf UDP 443
# hoerte nur er, jede HTTP/3-Anfrage landete also dort, und sein Upstream
# 127.0.0.1:9000 lieferte 502. Sortierte die Datei vor shopware.conf, bekam
# der ganze Shop 502, auch ueber TCP (nginx 1.27.5, nachgestellt). Wer diese
# fruehere Fassung aktiv hat, entfernt ihren Link aus sites-enabled zuerst -
# sonst bricht nginx am doppelten `listen 443 quic reuseport` ab.
#
# Voraussetzungen:
#   - nginx ab 1.25.1 mit HTTP/3-Modul. Das Modul gibt es ab 1.25.0, die
#     Direktive `http2 on;` aus Anhang C erst ab 1.25.1. Pruefen:
#       nginx -V 2>&1 | grep -o with-http_v3_module
#     Ubuntu 24.04 (nginx 1.24.0) hat es nicht. Ubuntu 26.04 (nginx 1.28.3)
#     hat es, bringt aber PHP 8.5 statt 8.3 - die 8.3-Pfade aus Kapitel 9
#     dort anpassen. Die Pakete von nginx.org haben es ebenfalls, aber weder
#     snippets/ noch sites-available/ und sites-enabled/, und ihre nginx.conf
#     liest nur conf.d/*.conf. Dort die drei Ordner anlegen und im http-Block
#     `include /etc/nginx/sites-enabled/*;` ergaenzen - das braucht der vHost
#     aus Anhang C ohnehin. Das Modul ist laut nginx-Doku experimentell.
#   - UDP 443 in der Firewall offen (z. B. `sudo ufw allow 443/udp`), sonst
#     bleibt es bei HTTP/2.
#
# ssl_protocols bleibt, wie Anhang C es setzt (TLSv1.2 TLSv1.3): QUIC nutzt
# ohnehin TLS 1.3. Eine zweite ssl_protocols-Zeile hier schraenkt nichts ein -
# nginx vereinigt beide und warnt nur mit "duplicate value" (nachgestellt).
#
# Nachgestellt mit nginx 1.27.5, dem vHost aus Anhang C, dieser Datei und dem
# Pool aus Kapitel 9: `curl --http3-only` antwortet ueber IPv4 und IPv6 mit
# HTTP/3, PHP sieht SERVER_PROTOCOL=HTTP/3.0, TLS 1.2 ueber TCP geht weiter.
# Die CI (Job appendix-configs) bootet genau das.
#
# @see https://nginx.org/en/docs/http/ngx_http_v3_module.html
# @see https://github.com/MehmetGoekce/shopware-performance-examples

# QUIC-Listener auf UDP 443, neben den TCP-Listenern aus Anhang C.
# `reuseport` darf je Adresse:Port nur an EINER listen-Zeile im ganzen
# Config-Baum stehen, sonst startet nginx nicht ("duplicate listen options").
# Beide Zeilen: Ohne die zweite kuendigt Alt-Svc HTTP/3 auch IPv6-Clients an,
# dort hoert aber niemand auf UDP (nachgestellt: curl ueber ::1 rc 7). Hat der
# Host kein IPv6, faellt die Zeile weg wie `listen [::]:443 ssl;` in Anhang C.
listen 443 quic reuseport;
listen [::]:443 quic reuseport;

# Steht ab Werk auf on - hier, damit die Absicht sichtbar ist.
http3 on;

# Bewirbt HTTP/3. Ohne diesen Header (oder einen HTTPS-Eintrag im DNS) erfaehrt
# der Browser nicht, dass es den QUIC-Listener gibt. Der Header steht auf
# Server-Ebene und erreicht damit die Seiten aus `location ~ \.php$`; die
# Asset-Locations von Anhang C setzen eigene add_header und bekommen ihn
# nicht. Das reicht: Der Browser merkt sich Alt-Svc je Origin (nachgestellt
# mit `curl --alt-svc`: erster Abruf HTTP/2, zweiter HTTP/3). Setzt jemand in
# `location ~ \.php$` ein eigenes add_header, fehlt Alt-Svc auf jeder Seite.
add_header Alt-Svc 'h3=":443"; ma=86400' always;

# Adressvalidierung (quic_retry) steht bewusst NICHT an. Sie kostet jede neue
# Verbindung einen Roundtrip mehr: bei 50 ms RTT nachgestellt 216-220 ms bis
# zum ersten Byte gegen 112-115 ms ohne - und gegen 167-171 ms ueber HTTP/2.
# Das Token, mit dem ein Client den Umweg spart, gilt 600 s, und ohne
# quic_host_key wuerfelt nginx den Schluessel bei jedem Reload neu. Nur unter
# einem Angriff mit gefaelschten Absendern einschalten:
#   quic_retry on;
#   quic_host_key /etc/nginx/quic_host.key;   # openssl rand -out ... 32

# 0-RTT (Early Data) steht hier bewusst nicht an - Replay-Risiko, siehe
# Kapitel 24. Vorsicht: `ssl_early_data on;` wirkt ueber TCP (HTTP/1.1 und
# HTTP/2) SOFORT, auf jeder nginx-Version. Nachgestellt mit nginx 1.27.5 und
# OpenSSL 3.0: derselbe POST zweimal mit demselben Session-Ticket in Early
# Data, beide Male 200. Nur ueber QUIC braucht 0-RTT mit OpenSSL nginx ab
# 1.29.1 und OpenSSL 3.5.1. Erst den 425-Listener in der Anwendung und diese
# Zeile in `location ~ \.php$` von Anhang C einbauen, NICHT hier:
#   fastcgi_param HTTP_EARLY_DATA $ssl_early_data;
# Auf Server-Ebene kommt die Variable in PHP nie an: Die PHP-Location setzt
# eigene fastcgi_param und erbt dann keine von aussen (nachgestellt). Hinter
# einem CDN, das selbst 0-RTT annimmt und `Early-Data: 1` schickt, die Zeile
# weglassen - sie ueberschreibt diesen Header mit einem leeren Wert.
# Dann erst:
#   ssl_early_data on;
