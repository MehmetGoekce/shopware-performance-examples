# Nginx vHost fuer Shopware 6
# Anhang C: Konfigurationen
#
# Datei: /etc/nginx/sites-available/shopware.conf
#        ln -s ../sites-available/shopware.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#
# Getestet mit `nginx -t` gegen nginx:1.27 (CI) und im Testshop gegen
# Shopware 6.6.10.6.
#
# Das ist der EINZIGE vHost des Companions. Kapitel 9 erklaert daraus den
# PHP-FPM-Teil (Upstream, `location ~ \.php$`, Status-Listener) und liefert
# keinen eigenen mehr (bis September 2026 lag dort ein zweiter vHost fuer
# denselben server_name, MEM-290). Zwei aktive server-Bloecke mit gleichem
# server_name und listen quittiert nginx nur mit einer Warnung
# ("conflicting server name ... ignored"), `nginx -t` meldet weiter Erfolg,
# und der spaeter gelesene Block ist still ohne Wirkung. Wer nach einer
# frueheren Fassung noch /etc/nginx/sites-enabled/shopware (ohne .conf) aktiv
# hat, verliert damit ausgerechnet DIESE Datei: `shopware` sortiert vor
# `shopware.conf`, der alte vHost gewinnt (auf IPv4; der alte hatte kein
# [::]:443). Den Link entfernen. Pruefen - die Ausgabe muss leer bleiben, und
# sie muss auch bei einem Abbruch etwas zeigen, deshalb 'emerg' im Muster:
#   sudo nginx -t 2>&1 | grep -E 'emerg|conflicting server name'
#
# Vor dem ersten `nginx -t` anpassen: server_name, root und die beiden
# ssl_certificate-Pfade. Fehlt das Zertifikat, bricht nginx mit "cannot load
# certificate" ab; wer noch keins hat, holt es zuerst, z. B. mit
# `certbot certonly --standalone` bei gestopptem nginx.
#
# Den Upstream php-fpm-shopware definiert diese Datei selbst. Liegt aus einer
# frueheren Auflage noch Kapitel 9s /etc/nginx/conf.d/php-fpm.conf mit
# demselben Upstream, bricht `nginx -t` mit 'duplicate upstream' ab - dann
# diese alte Datei loeschen.
#
# Vier Dinge, die diese Datei bewusst anders macht als die ueblichen Vorlagen:
#
#   1. Kein `expires` neben `add_header Cache-Control`. Beide Direktiven
#      erzeugen je einen eigenen Cache-Control-Header; die Antwort traegt ihn
#      dann doppelt (im Testshop nachgestellt). Es steht nur der add_header.
#
#   2. Die Security-Header sind in JEDEM location-Block wiederholt, der einen
#      eigenen add_header hat. nginx vererbt add_header nur, solange der
#      innere Block keinen einzigen eigenen setzt — sobald doch, faellt die
#      komplette geerbte Liste weg. Ohne die Wiederholung kaeme jede CSS-,
#      JS-, Font- und Bildantwort ohne X-Content-Type-Options.
#
#   3. Der ACME-Block traegt den Modifier `^~`. NICHT die Reihenfolge im File
#      rettet ihn - ein `^~`-Praefix-Match beendet die Location-Suche, bevor
#      Regex-Locations ueberhaupt geprueft werden. Ohne `^~` gewinnt
#      `location ~ /\.` und certbot bekommt 403, auch wenn der Block weiter
#      oben steht (beides im Container nachgestellt).
#
#   4. `listen.mode = 0660` im FPM-Pool setzt voraus, dass der nginx-Worker
#      ebenfalls als www-data laeuft. Tut er das nicht (das offizielle
#      nginx-Image nutzt den Benutzer `nginx`), endet jeder Request mit
#      `connect() ... failed (13: Permission denied)` und 502.
#
# Gzip steht nicht hier, sondern in chapters/22-haeufigste-probleme/config/
# nginx-gzip.conf; Brotli in chapters/11-cdn-integration/config/
# nginx-brotli.conf. Zweimal gzip_types an zwei Stellen laufen sonst
# auseinander.
#
# @see https://github.com/MehmetGoekce/shopware-performance-examples

# Kein `keepalive` zu FPM (MEM-290, Review). Mit `keepalive 32` plus
# `fastcgi_keep_conn on` haelt jeder nginx-Worker bis zu 32 Verbindungen
# offen, und ein FPM-Worker bleibt an seine Verbindung gebunden - er zaehlt
# als aktiv, auch wenn nichts laeuft. Vier nginx-Worker binden so bis zu 128
# FPM-Worker, die Vorlage hat 50. Gemessen mit 4 Kindern und 4 nginx-Workern,
# 12 parallele Requests: mit Keepalive 30 bis 90 s Wartezeit und
# "server reached pm.max_children", ohne unter einer Sekunde. Ueber einen
# Unix-Socket kostet der Verbindungsaufbau je Request kaum etwas.
upstream php-fpm-shopware {
    server unix:/run/php/php8.3-fpm-shopware.sock;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Eigene Direktive erst ab nginx 1.25.1. Ubuntu 22.04 liefert 1.18.0,
    # Ubuntu 24.04 liefert 1.24.0 — dort bricht `nginx -t` mit
    # `unknown directive "http2"` ab. Auf diesen Versionen die naechste Zeile
    # entfernen und `http2` an BEIDE listen-Zeilen oben haengen - nur an die
    # erste, und IPv6 bleibt bei HTTP/1.1:
    #   sudo sed -i -e '/^[[:space:]]*http2 on;/d' \
    #     -e 's/^\([[:space:]]*listen .*443 ssl\);/\1 http2;/' \
    #     /etc/nginx/sites-available/shopware.conf
    http2 on;

    server_name shop.example.com;
    root /var/www/shopware/public;
    index index.php;

    # Standard sind 1m. Shopwares eigene nginx-Referenz nennt 128M; mit
    # weniger schlagen Plugin-ZIP- und Medien-Uploads im Admin mit HTTP 413
    # fehl. Der Wert muss mindestens so gross sein wie post_max_size und
    # upload_max_filesize in PHP.
    client_max_body_size 128M;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/shopware-access.log;
    error_log  /var/log/nginx/shopware-error.log;

    # X-XSS-Protection steht hier nicht: alle aktuellen Browser haben den
    # XSS-Auditor entfernt, und in aelteren Versionen konnte der Header
    # selbst zur Luecke werden. Content-Security-Policy ist der Ersatz —
    # die gehoert aber pro Shop zusammengestellt, nicht in eine Vorlage.
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Fuehrt jede .php-Datei im Docroot aus. In `public/` liegt ausser
    # index.php (und dem Installer) nichts, deshalb kostet das hier nichts -
    # wer aber Uploads in den Docroot schreiben laesst, sollte auf
    # `location ~ ^/(index|shopware-installer\.phar)\.php(/|$)` einschraenken.
    location ~ \.php$ {
        # Nur existierende PHP-Dateien
        try_files $uri =404;

        fastcgi_pass php-fpm-shopware;

        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Leert die HTTP_PROXY-Variable, die sonst aus einem Proxy-Header
        # des Clients entstehen kann (httpoxy).
        fastcgi_param HTTP_PROXY "";

        # Buffer fuer grosse Responses. Wie gross sie werden, haengt an Seite und
        # Abfrage; gemessen im Demo-Shop (Dockware 6.6.10.6, unkomprimiert):
        # Storefront-Seiten 90-173 KB, Login und Registrierung 372 KB, /admin 3 KB,
        # Admin-API-Suche ueber 16 Produkte mit fuenf Associations 107-200 KB.
        # Sizing-Beispiel: 256 x 16k = bis 4 MB je Request (je Verbindung zu
        # FPM, nicht je Worker).
        # fastcgi_buffer_size beschreibt den ERSTEN Buffer (Header-Antwort).
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Gestaffelt gegen den Pool: max_execution_time 300 <
        # request_terminate_timeout 330 < fastcgi_read_timeout 360. Rechnet
        # ein Request zu lange, bricht PHP zuerst ab (Fatal Error im Log).
        # Wartet er auf Datenbank oder API, zaehlt max_execution_time unter
        # Linux nicht mit; dann beendet FPM ihn nach 330 s, nginx liefert 502,
        # und die Spur steht im FPM-Log ("execution timed out"). Einen 504
        # ohne Spur gibt es dank 360 > 330 nicht.
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 360s;
        fastcgi_read_timeout 360s;

        # Kein `internal;` hier - das legte jede direkte .php-URL auf 404,
        # auch eine Monitoring-Seite, die Sie selbst ablegen. Der Schutz
        # gegen ausfuehrbare Uploads kommt aus `try_files $uri =404`.
    }

    # Kompiliertes CSS/JS: der Pfad traegt den Theme-Hash, ein Jahr ist
    # deshalb gefahrlos.
    location ^~ /theme/ {
        try_files $uri =404;
        access_log off;

        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Plugin- und Storefront-Assets. Versioniert ueber den Query-String,
    # nicht ueber den Dateinamen — ein CDN davor muss den Query-String im
    # Cache-Key behalten (Kapitel 11).
    location ^~ /bundles/ {
        try_files $uri /index.php$is_args$args;
        access_log off;

        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Medien: Shopware schreibt den Upload-Zeitstempel in den Pfad UND haengt
    # ihn als ?ts= an. Eine ersetzte Datei bekommt eine neue URL, `immutable`
    # ist deshalb korrekt.
    location ^~ /media/ {
        try_files $uri /index.php$is_args$args;
        access_log off;

        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Thumbnails: hier KEIN `immutable`. Der Zeitstempel im Pfad ist der des
    # Medienobjekts, nicht der des Thumbnails - im Testshop gemessen:
    #   /thumbnail/fb/f1/10/1753443529/hq_...jpg?ts=1789841285
    # Pfad = Upload (2025-07-25), ?ts= = Neugenerierung (2026-09-19). Wird das
    # Thumbnail neu erzeugt, bleibt der Pfad gleich und nur der Query-String
    # aendert sich. Ein Cache, der den Query-String ignoriert, liefert mit
    # `immutable` ein Jahr lang das alte Bild.
    location ^~ /thumbnail/ {
        try_files $uri /index.php$is_args$args;
        access_log off;

        add_header Cache-Control          "public, max-age=31536000" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ACME-Challenge fuer certbot. Entscheidend ist der Modifier `^~`, nicht
    # die Position im File: `^~` beendet die Location-Suche, bevor die Regex
    # `location ~ /\.` geprueft wird. certbot erwartet die Dateien unter
    # <webroot>/.well-known/acme-challenge/ - hier /var/www/html, also
    # `certbot certonly --webroot -w /var/www/html -d shop.example.com`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # Verteidigung in der Tiefe: mit `root .../public` liegen config/, var/ und
    # vendor/ ohnehin ausserhalb des Docroots, die Regel kann also nie greifen.
    # Sie kostet nichts und faengt einen falsch gesetzten `root` ab.
    location ~ ^/(config|var|vendor)/ {
        deny all;
    }
}

# Status und Ping nur auf dem Loopback, ohne TLS.
#
# Getrennt vom oeffentlichen vHost aus zwei Gruenden: Der oeffentliche hoert
# auf 443 mit einem Servernamen, ein Monitoring-Agent auf demselben Host will
# aber schlicht http://127.0.0.1:8081/fpm-status abfragen - und die Pfade
# haben nach aussen ohnehin nichts verloren. Port 8081, nicht 8080: Auf
# 127.0.0.1:8080 erwartet Varnish aus Kapitel 6 das nginx-Backend, und ein
# Server, der genau diese Adresse nennt, schnappt einem `listen 8080;` jede
# Anfrage weg - lautlos, `nginx -t` meldet Erfolg.
#
# Ohne diesen Block sind pm.status_path und ping.path unerreichbar: Die
# Anfrage laeuft im oeffentlichen vHost in `location /` und landet per
# try_files auf /index.php - Shopware antwortet dann mit seiner eigenen
# 404-Seite, und zwar mit HTTP 200 fuer den, der nur den Statuscode prueft.
#
# Kein try_files hier: Die Pfade beantwortet PHP-FPM selbst, es gibt dazu
# keine Datei auf der Platte.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    location = /fpm-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass php-fpm-shopware;
    }

    location = /fpm-ping {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass php-fpm-shopware;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
