; PHP-FPM Pool fuer Shopware 6
; Anhang C: Konfigurationen
;
; Datei: /etc/php/8.3/fpm/pool.d/shopware.conf
;        (danach den mitgelieferten Pool www.conf abschalten: Er hoert auf
;         einem anderen Socket und laeuft deshalb klaglos weiter neben
;         diesem Pool — dann stehen zwei Pools mit je eigenem
;         pm.max_children da, und der Server plant mit der doppelten
;         Worker-Zahl, die er an RAM nie hat. Auf demselben Socket starten
;         zwei verschieden benannte Pools dagegen gar nicht erst:
;         "unable to set listen address as it's already used in another pool")
;        sudo chmod 644 …, sudo systemctl restart php8.3-fpm
;
; ACHTUNG: Kapitel 9 liefert unter
; chapters/09-php-performance/config/shopware-fpm.conf eine zweite
; Pool-Vorlage mit derselben Zieldatei aus. Wer beide kopiert, ueberschreibt
; sich selbst - es gewinnt, was zuletzt kopiert wurde, und `php-fpm8.3 -t`
; meldet trotzdem "test is successful". Nehmen Sie eine von beiden.
;
; Beide unter ihren EIGENEN Namen nach pool.d zu legen hilft nicht: Sie
; tragen denselben Poolnamen [shopware], FPM baut daraus einen Pool aus der
; Vereinigung beider Dateien. Wo beide dieselbe Direktive setzen, haengt der
; Gewinner an der Art der Direktive:
;
;   Einzelwerte - pm.*, listen, request_*, slowlog, user ...:
;     die alphabetisch LETZTE Datei gewinnt
;   Listen - php_value, php_flag, php_admin_value, php_admin_flag, env[...]:
;     die alphabetisch ERSTE Datei gewinnt
;     (php_admin_value schlaegt php_value derselben Einstellung aber immer,
;     gleich in welcher Datei es steht)
;
; Ab Werk setzen beide Vorlagen keine Direktive verschieden, die Frage stellt
; sich also erst, wenn Sie eine davon anpassen - und dann greift nur die
; Haelfte der Anpassung. Rechnen Sie in der alphabetisch ersten Datei nach,
; wirken memory_limit & Co., pm.max_children aber kommt weiter aus der
; anderen. In der letzten Datei ist es umgekehrt. Unter ihren eigenen Namen
; sortiert php-fpm-pool.conf vor shopware-fpm.conf. Auch das meldet
; `php-fpm8.3 -t` als erfolgreich; `php-fpm8.3 -tt` fuehrt bei den Listen
; beide Werte auf, wirksam ist der jeweils zuletzt aufgefuehrte.
;
; Sieben wirksame Zeilen unterscheiden sich:
;
;   nur hier:      env[PATH], env[TMP], env[TMPDIR], env[TEMP]
;                  php_value[upload_max_filesize] = 128M
;                  php_value[post_max_size] = 128M
;   nur Kapitel 9: listen.backlog = 65535
;
; Die beiden php_value-Zeilen braucht diese Vorlage, weil Anhang C keine
; eigene conf.d-Datei ausliefert; im Kapitel-9-Satz stehen dieselben 128M in
; chapters/09-php-performance/config/99-shopware.ini.
;
; Geprueft mit `php-fpm8.3 -t` und ueber einen echten FastCGI-Request
; (cgi-fcgi) gegen php:8.3-fpm. Auf Debian/Ubuntu heisst das Binary
; versioniert — ein blankes `php-fpm` gibt es im PATH nicht.
;
; Die OPcache-Einstellungen stehen NICHT hier, sondern in
; chapters/09-php-performance/config/99-shopware-opcache.ini - bei dem
; Kapitel, das OPcache erklaert. Sie gehoeren in conf.d, damit sie fuer alle
; Pools gelten und `php-fpm8.3 -i` sie zeigt.
;
; ACHTUNG beim Zielpfad dieser OPcache-Datei: `10-opcache.ini` in conf.d ist
; auf Debian/Ubuntu bereits vergeben — ein Symlink der Distribution auf
; mods-available/opcache.ini, und NUR dort steht `zend_extension=opcache.so`.
; Wer ihn ueberschreibt, laedt die Erweiterung nicht mehr und hat OPcache
; damit abgeschaltet. Eigene Werte gehoeren in eine neue Datei mit hoeherer
; Nummer, z. B. 99-shopware-opcache.ini.
;
; @see https://github.com/MehmetGoekce/shopware-performance-examples

[shopware]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-shopware.sock
listen.owner = www-data
listen.group = www-data
; 0660 setzt voraus, dass der nginx-Worker ebenfalls als www-data laeuft.
; Laeuft er unter einem anderen Benutzer, endet jeder Request mit
; "connect() ... failed (13: Permission denied)" und 502.
listen.mode = 0660

; ============================================
; Process Manager
; ============================================
;
; pm.max_children ist die Zahl, die wirklich zaehlt: mehr gleichzeitige
; Requests als hier, und die uebrigen warten. Faustformel
;   (verfuegbares RAM in MB − Reserve fuer MySQL/Redis/OS) / RSS je Worker
; RSS je Worker misst man am laufenden Shop, nicht aus einer Tabelle — und
; filtert dabei auf die Pool-Prozesse, denn -C php-fpm8.3 trifft auch den
; Master, und der ist kein Worker. Wie stark er den Schnitt verzieht,
; haengt an der Zahl der Worker (gemessen in einem leeren Testpool mit
; drei Workern: Master 6,7 MB, Worker rund 56 MB — der ungefilterte
; Einzeiler meldet 43,4 statt 55,6 MB, also 22 Prozent zu wenig, und zwar
; in die gefaehrliche Richtung; bei 50 Workern sind es noch rund zwei
; Prozent). Am warmen Shop liegt der Wert hoeher - Kapitel 9 misst dort
; 79 bis 86 MB je Worker, und mit den 80 MB rechnet auch die 50 oben:
;   ps --no-headers -o rss,args -C php-fpm8.3 | grep 'pool' | awk '{s+=$1; n++} END {print s/n/1024" MB"}'
; Die robuste Fassung, die auch den versionierten Prozessnamen erkennt,
; liegt in chapters/09-php-performance/scripts/php-fpm-memory.sh.
; 50 passt zu einem 16-GB-Server mit ~80 MB je Worker.
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; Worker nach 1000 Requests neu starten. Faengt Speicherlecks in
; Erweiterungen auf, kostet sonst nichts.
pm.max_requests = 1000

; ============================================
; Timeouts und Slowlog
; ============================================

; Gestaffelt: max_execution_time 300 < request_terminate_timeout 330 <
; fastcgi_read_timeout 360 (nginx). So bricht immer PHP zuerst ab und
; schreibt einen Fatal Error ins Log. Stehen alle drei auf demselben Wert,
; entscheidet der Zufall, ob es einen Logeintrag gibt oder nur einen 504.
request_terminate_timeout = 330
request_slowlog_timeout = 10
slowlog = /var/log/php-fpm/shopware-slow.log

; Das Verzeichnis legt PHP-FPM nicht selbst an:
;   sudo mkdir -p /var/log/php-fpm && sudo chown www-data:www-data /var/log/php-fpm

; ============================================
; Status-Endpunkt
; ============================================
;
; Liefert u. a. "listen queue" — die Zahl der wartenden Requests. Steht dort
; dauerhaft etwas ueber 0, ist pm.max_children zu klein.
;
; Der Pfad ist nur erreichbar, wenn der Webserver ihn ausdruecklich
; weiterreicht. Mit einem blossen `location /` plus try_files landet er auf
; /index.php und PHP-FPM liefert Shopwares 404. Die passenden
; `location = /fpm-status` und `= /fpm-ping` stehen in nginx-shopware.conf.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; ============================================
; Environment
; ============================================
;
; PHP-FPM reicht die Umgebung des Elternprozesses NICHT weiter. Was Shopware
; braucht, steht in .env bzw. .env.local; hier stehen nur die Variablen, die
; Bibliotheken direkt lesen.
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; ============================================
; PHP-Einstellungen
; ============================================

php_admin_value[error_log] = /var/log/php-fpm/shopware-error.log
php_admin_flag[log_errors] = on

php_value[memory_limit] = 512M
php_value[max_execution_time] = 300

; Muss zu client_max_body_size in nginx passen (dort 128M).
php_value[upload_max_filesize] = 128M
php_value[post_max_size] = 128M

; realpath_cache_size steht hier nicht: 4096K ist seit PHP 7.0.16 / 7.1.2
; der Vorgabewert, die Zeile aendert nichts. Der TTL dagegen steht ab Werk
; auf 120 Sekunden; Shopwares Performance-Doku empfiehlt 3600.
; @see https://developer.shopware.com/docs/guides/hosting/performance/performance-tweaks.html
php_value[realpath_cache_ttl] = 3600
