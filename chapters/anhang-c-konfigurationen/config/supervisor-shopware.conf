; Supervisor: Worker und Scheduler fuer Shopware 6
; Anhang C: Konfigurationen
;
; Datei: /etc/supervisor/conf.d/shopware-worker.conf
;        sudo supervisorctl reread && sudo supervisorctl update
;
; Geprueft mit `supervisord -c … -n` gegen supervisor 4.2 und mit
; `messenger:consume async low_priority` im Testshop (Shopware 6.6.10.6).
;
; Kapitel 22, Problem 15 zeigt dieselben zwei Dienste als systemd-Units.
; Nehmen Sie eines von beiden, nicht beides — sonst laufen die Worker doppelt.
;
; ============================================================
; VORHER: den Admin-Worker abschalten
; ============================================================
;
; shopware.admin_worker.enable_admin_worker steht ab Werk auf true. Dann
; arbeitet der Browser einer offenen Admin-Sitzung die Queue mit ab, parallel
; zu den Prozessen hier — und belegt dabei einen PHP-FPM-Worker pro
; Poll-Intervall. In config/packages/shopware.yaml:
;
;     shopware:
;         admin_worker:
;             enable_admin_worker: false
;
; @see https://github.com/MehmetGoekce/shopware-performance-examples

; ============================================================
; Message-Queue-Worker
; ============================================================
;
; Beide Transporte in einem Aufruf: Shopware liefert async UND low_priority
; aus (framework.yaml), und was nur nach low_priority geroutet ist, bleibt
; sonst dauerhaft liegen. Die Reihenfolge ist die Prioritaet — low_priority
; kommt erst dran, wenn async leer ist.
;
; --time-limit ist Absicht, kein Umweg: der Prozess beendet sich regelmaessig
; selbst, supervisor startet ihn neu. So waechst der Speicher nicht endlos
; und neuer Code nach einem Deploy wird wirklich geladen.

[program:shopware-worker]
command=/usr/bin/php /var/www/shopware/bin/console messenger:consume async low_priority --time-limit=3600 --memory-limit=256M
directory=/var/www/shopware
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
; Beendet auch Kindprozesse, die der Worker gestartet hat.
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/shopware-worker-error.log
stdout_logfile=/var/log/supervisor/shopware-worker.log

; ============================================================
; Scheduler
; ============================================================
;
; scheduled-task:run stellt faellige Aufgaben nur in die Queue; abgearbeitet
; werden sie vom Worker oben. Beide Dienste werden also gebraucht.
;
; Der Befehl ist ein Dauerlaeufer und gehoert NICHT in die crontab: als
; taeglicher Cronjob kommt jeden Tag ein Prozess dazu, der nie endet
; (Kapitel 22, Problem 15). Genau eine Instanz, deshalb numprocs=1.

[program:shopware-scheduled-task]
command=/usr/bin/php /var/www/shopware/bin/console scheduled-task:run --time-limit=3600
directory=/var/www/shopware
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/shopware-scheduled-error.log
stdout_logfile=/var/log/supervisor/shopware-scheduled.log
