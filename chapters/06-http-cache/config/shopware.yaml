# HTTP-Cache: globale Einstellungen für Shopware 6.6
# Kapitel 6: HTTP-Caching
#
# Kopieren nach: config/packages/http_cache.yaml (oder in bestehende Datei mergen)
# Abschnittsnummern (6.4, 6.5) beziehen sich auf Kapitel 6 des Buchs.
# Danach: bin/console cache:clear
#
# Der HTTP-Cache ist ab Werk AKTIV. Ein- und Ausschalten sowie die Standard-TTL
# laufen über Umgebungsvariablen, nicht über diese Datei:
#
#   SHOPWARE_HTTP_CACHE_ENABLED=1     # Default: 1
#   SHOPWARE_HTTP_DEFAULT_TTL=7200    # Default: 7200 Sekunden, gilt für Routen mit _httpCache ohne maxAge
#   APP_ENV=prod                      # In dev liegt der Cache nur im RAM des Requests: nie ein Treffer
#
# Welche Seiten gecacht werden, entscheidet die Route (Default "_httpCache"),
# siehe src/Controller/CacheableController.php.
#
# Varnish-Anbindung: config/varnish.yaml
#
# @see https://github.com/MehmetGoekce/shopware-performance-examples

shopware:
    http_cache:
        # Ab Werk nicht gesetzt (null). Gesetzt hängt Shopware sie als
        # Cache-Control-Direktiven an jede cachebare Antwort.
        # Wirkung: im eingebauten Cache und bei CDNs, die sie auswerten.
        # Varnish kennt stale-if-error nicht; die VCL in 6.5 setzt Grace selbst (6.4).
        # Der Browser sieht für HTML "no-cache, private" bzw. hinter Varnish "no-store".
        # Mit dem Feature-Flag CACHE_REWORK (ab 6.7.6) wirkungslos, Entfernung in 6.8.
        stale_while_revalidate: 14400   # 4 Stunden
        stale_if_error: 86400           # 24 Stunden

        # Tracking-Parameter, die keinen eigenen Cache-Eintrag erzeugen sollen.
        # Shopware bringt bereits rund 100 Einträge mit (utm_*, gclid, fbclid,
        # msclkid, pk_*, mc_cid ...). Eigene Einträge werden an diese Liste
        # angehängt, hier also nur Parameter, die dort fehlen.
        # Gilt nur für den eingebauten Cache! Hinter Varnish muss die VCL den
        # Parameter entfernen (config/varnish.vcl, vcl_recv).
        ignored_url_parameters:
            - 'newsletter_id'           # Beispiel für einen shop-eigenen Parameter

    cache:
        invalidation:
            # 0 = sofort invalidieren (Default). Ein Wert > 0 sammelt Invalidierungen
            # und verarbeitet sie per Scheduled Task "shopware.invalidate_cache"
            # (manuell: bin/console cache:clear:delayed).
            delay: 0

            # Zustände, in denen Besucher am HTTP-Cache vorbeigehen (Default).
            # Shopware setzt dafür das Cookie "sw-states".
            http_cache: ['logged-in', 'cart-filled']

            # Die *_route-Keys (product_detail_route, product_listing_route ...)
            # sind ebenfalls Zustandslisten (Default: leer), KEINE Klassennamen.
            # Sie steuern den Objekt-Cache der Cached*Route-Klassen, den Store-API
            # und Storefront-Seiten nutzen (6.6; die Klassen entfallen mit 6.7).
            # Beispiel: Produktdaten für eingeloggte Kunden nicht aus diesem Cache:
            # product_detail_route: ['logged-in']

# Kein framework.cache.pools.cache.http-Override nötig: Shopware legt den Pool
# ab Werk auf cache.app (Filesystem, bzw. Redis, wenn cache.app auf Redis zeigt).
