# Eigener Log-Kanal fuer RUM-Beacons: eine JSON-Zeile pro Metrik.
#
# rotating_file haengt das Datum an den Namen: aus rum.log wird
# var/log/rum-2026-09-22.log. rum:report und rum:check-alerts lesen deshalb
# rum-*.log, nicht rum.log. Nach 30 Tagen loescht Monolog die aelteste Datei.
monolog:
    channels: ['rum']

    handlers:
        rum:
            type: rotating_file
            path: '%kernel.logs_dir%/rum.log'
            level: info
            channels: ['rum']
            max_files: 30
            formatter: monolog.formatter.json
