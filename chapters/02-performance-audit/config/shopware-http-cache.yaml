# Shopware 6 HTTP-Cache Konfiguration
# Kapitel 2: Performance-Audit
#
# Datei: config/packages/shopware.yaml
# @see https://github.com/MehmetGoekce/shopware-performance-examples

shopware:
    http_cache:
        # Cache aktivieren (WICHTIG!)
        enabled: true

        # Standard TTL in Sekunden (2 Stunden)
        default_ttl: 7200

        # Stale-While-Revalidate: Veralteten Cache ausliefern während Refresh
        # Verbessert User Experience massiv
        stale_while_revalidate: 3600

        # Stale-If-Error: Cache bei Backend-Fehlern ausliefern
        # Wichtig für Ausfallsicherheit
        stale_if_error: 86400

        # Cache-Invalidierung bei Produkt-Updates
        invalidation:
            product_indexer: true
            product_detail_route: true
            product_listing_route: true

    # Cache für Storefront-Requests
    storefront:
        csrf:
            # Bei aktivem HTTP-Cache: AJAX für CSRF-Token
            mode: ajax
