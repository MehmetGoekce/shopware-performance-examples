; Supervisor-Konfiguration für Shopware 6 Message Queue Worker
; Kapitel 2: Performance-Audit
;
; Installation:
; 1. sudo cp shopware-worker.conf /etc/supervisor/conf.d/
; 2. sudo supervisorctl reread
; 3. sudo supervisorctl update
; 4. sudo supervisorctl start shopware-worker:*
;
; @see https://github.com/MehmetGoekce/shopware-performance-examples

[program:shopware-worker]
; Pfad anpassen!
command=/var/www/shop/bin/console messenger:consume async --time-limit=300 --memory-limit=256M
directory=/var/www/shop

; Benutzer (www-data für Apache/Nginx)
user=www-data

; Anzahl Worker-Prozesse (2-4 empfohlen)
numprocs=2
process_name=%(program_name)s_%(process_num)02d

; Automatischer Start
autostart=true
autorestart=true

; Timeout für Graceful Shutdown (300s = time-limit)
stopwaitsecs=310

; Logging
stdout_logfile=/var/log/shopware/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/shopware/worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; Umgebungsvariablen
environment=APP_ENV="prod"
