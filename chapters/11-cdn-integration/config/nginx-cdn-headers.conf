# Nginx Cache-Header Konfiguration für CDN
#
# Installation:
#   Include in server{} Block oder als separate Datei
#   include /etc/nginx/conf.d/cdn-headers.conf;
#
# Quelle: https://developer.shopware.com/docs/guides/hosting/infrastructure/cdn.html

# ============================================================================
# HTTP/3 (QUIC) — optional, nur bei Self-Hosted-Origin ohne Edge-CDN
# ============================================================================
#
# Nginx 1.25+ mit ngx_http_v3_module (BUILD QUIC). In 2026 weiterhin als
# "experimental" markiert. Voraussetzung: Linux 5.7+, OpenSSL 1.1.1+ oder
# BoringSSL. Apache httpd hat KEINEN nativen HTTP/3-Support.
#
# Empfehlung: HTTP/3 am CDN-Edge (Cloudflare/Fastly/Bunny) terminieren,
# Origin auf HTTP/2 lassen. Folgende Direktiven nur fuer Self-Hosted-Setups
# mit eigenem QUIC-Build aktivieren:
#
#   listen 443 ssl;          # TCP HTTP/2 (Fallback)
#   http2 on;
#   listen 443 quic reuseport;  # UDP QUIC
#   http3 on;
#   add_header alt-svc 'h3=":443"; ma=86400';
#
# Vorher mit wrk + h2load gegen reale Browser-Traffic-Pattern lasttesten.
# Quelle: https://nginx.org/en/docs/http/ngx_http_v3_module.html

# ============================================================================
# Statische Assets - Maximales Caching
# ============================================================================

# Bundles (JS/CSS mit Hash im Dateinamen)
location /bundles/ {
    # 1 Jahr Browser-Cache (Assets sind versioniert)
    add_header Cache-Control "public, max-age=31536000, immutable";

    # CORS für Fonts (falls von Subdomain geladen)
    add_header Access-Control-Allow-Origin "*";

    # Keine Cookies für statische Assets
    add_header Set-Cookie "";

    # Kompression
    gzip on;
    gzip_types application/javascript text/css;
}

# Theme Assets (kompilierte Storefront-Dateien)
location /theme/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";

    gzip on;
    gzip_types application/javascript text/css application/json;
}

# Media (Produktbilder, Uploads)
location /media/ {
    add_header Cache-Control "public, max-age=31536000";
    add_header Access-Control-Allow-Origin "*";

    # WebP-Fallback
    location ~* \.webp$ {
        add_header Cache-Control "public, max-age=31536000";
        add_header Vary "Accept";
    }
}

# Thumbnail (generierte Bilder)
location /thumbnail/ {
    add_header Cache-Control "public, max-age=31536000";
    add_header Access-Control-Allow-Origin "*";
}

# ============================================================================
# Fonts - Spezielles Handling
# ============================================================================

location ~* \.(woff|woff2|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=31536000";

    # CORS ist PFLICHT für Fonts!
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept";

    # Preflight
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}

# ============================================================================
# Dynamische Seiten - Kurzes Caching
# ============================================================================

# Produktseiten, Kategorien (cachebar)
location ~* ^/(detail|navigation|search)/ {
    # 5 Minuten Cache, 1 Minute Stale-While-Revalidate
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";

    # Vary nur für nötige Header (NICHT Cookie!)
    add_header Vary "Accept-Encoding, Accept-Language";
}

# Startseite
location = / {
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";
    add_header Vary "Accept-Encoding, Accept-Language";
}

# ============================================================================
# Bypass-Bereiche - NIEMALS cachen
# ============================================================================

# Checkout (personalisiert, sicherheitskritisch)
location /checkout/ {
    add_header Cache-Control "private, no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

# Account (personalisiert)
location /account/ {
    add_header Cache-Control "private, no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

# Admin (sicherheitskritisch)
location /admin/ {
    add_header Cache-Control "private, no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";

    # Zusätzliche Security-Header
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}

# Store API (dynamisch, personalisiert)
location /store-api/ {
    add_header Cache-Control "private, no-store";

    # CORS für API
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, sw-access-key, sw-context-token";
}

# API (Backend)
location /api/ {
    add_header Cache-Control "private, no-store";
}

# ============================================================================
# CDN-spezifische Header
# ============================================================================

# Surrogate-Control für CDN (wird vom CDN entfernt, nicht an Browser gesendet)
# Erlaubt unterschiedliche TTLs für CDN vs. Browser
# add_header Surrogate-Control "max-age=3600";

# Cache-Tag für selektives Purging (Fastly, Cloudflare Enterprise)
# add_header Cache-Tag "product category-123";

