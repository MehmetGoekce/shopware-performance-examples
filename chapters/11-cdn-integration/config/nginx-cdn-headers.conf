# Nginx Cache-Header fuer statische Assets vor einem CDN
#
# Installation:
#   In den BESTEHENDEN Shopware-server{}-Block einbinden:
#       include /etc/nginx/conf.d/cdn-headers.conf;
#   Danach: nginx -t && systemctl reload nginx
#
# WICHTIG — drei Dinge, die diese Datei bewusst NICHT tut:
#
#   1. Sie definiert kein "location /". Shopwares Standard-Block
#      (`try_files $uri /index.php$is_args$args;`) muss bleiben. Wird er
#      ersetzt, liefert jede URL ausser der Startseite 404; wird ein zweites
#      "location /" eingefuegt, startet nginx mit
#      `duplicate location "/"` gar nicht erst.
#
#   2. Sie setzt keine Cache-Header fuer HTML. Nach dem internen Redirect auf
#      /index.php gilt `location ~ \.php$` — ein add_header aus einem anderen
#      Block erreicht die PHP-Antwort nie. HTML-TTLs steuert Shopware
#      (Routen-Default `_httpCache` + SHOPWARE_HTTP_DEFAULT_TTL), siehe
#      config/shopware-cdn.yaml.
#
#   3. Sie legt keine Bypass-Bloecke fuer /checkout/, /account/, /admin/ oder
#      /store-api/ an. Shopware sendet fuer diese Routen bereits
#      `private`/`no-store`. Solche Bloecke ohne try_files/fastcgi_pass machen
#      Checkout, Kundenkonto und Store-API zu 404 (im Testshop verifiziert).
#
# Warum ^~ statt eines reinen Praefix: ohne ^~ gewinnt eine Regex-Location
# (z.B. `~* \.(css|js)$`) gegen den Praefix — die Bloecke waeren fuer CSS/JS tot.
# Und: kein `expires` zusaetzlich zum add_header, sonst stehen ZWEI
# Cache-Control-Header in der Antwort. Genau diese Kombination steht in
# Shopwares eigener nginx-Referenz (`expires 1y;` plus `add_header
# Cache-Control "public, must-revalidate, proxy-revalidate";`) — die Doppelung
# wird also meist von dort abgeschrieben.
#
# Quellen:
#   https://nginx.org/en/docs/http/ngx_http_core_module.html#location
#   https://nginx.org/en/docs/http/ngx_http_headers_module.html
#   https://developer.shopware.com/docs/resources/references/config-reference/server/nginx.html

# ============================================================================
# Theme-Assets (kompiliertes CSS/JS, Fonts) — Pfad enthaelt den Theme-Hash
# ============================================================================

location ^~ /theme/ {
    try_files $uri =404;
    access_log off;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ============================================================================
# Bundle-Assets (Plugin-/Storefront-JS und -CSS)
# ============================================================================
#
# ACHTUNG: Diese Dateien werden NICHT ueber den Dateinamen versioniert, sondern
# ueber einen Query-String (`?<lastModified>`, FlysystemLastModifiedVersion-
# Strategy). Der CDN-Cache-Key MUSS den Query-String enthalten — bei Bunny
# heisst die Einstellung `IgnoreQueryStrings: false`. Sonst liefert das CDN nach
# einem Plugin-Update bis zu einem Jahr lang das alte JS aus.

location ^~ /bundles/ {
    try_files $uri /index.php$is_args$args;
    access_log off;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ============================================================================
# Medien und Thumbnails
# ============================================================================
#
# `immutable` ist hier korrekt: Shopware schreibt den Upload-Timestamp in den
# Pfad (media/<hash-teile>/<cacheBuster>/datei.jpg) UND haengt zusaetzlich
# `?ts=<uploadedAt>` an. Eine ersetzte Datei bekommt eine neue URL, die alte
# muss nicht revalidiert werden.

location ^~ /media/ {
    try_files $uri /index.php$is_args$args;
    access_log off;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location ^~ /thumbnail/ {
    try_files $uri /index.php$is_args$args;
    access_log off;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
}

