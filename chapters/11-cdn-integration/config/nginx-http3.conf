# HTTP/3 (QUIC) am eigenen nginx-Origin
# Kapitel 11: CDN-Integration
#
# Dieser Block gehoert in einen server{}-Kontext mit TLS-Zertifikat. Er wird in
# der CI mit `nginx -t` gegen das offizielle nginx:alpine-Image geprueft; das
# Image bringt --with-http_v3_module mit.
#
# Voraussetzungen (nginx.org/en/docs/http/ngx_http_v3_module.html, Abruf
# 2026-09-19):
#   - Modul ab nginx 1.25.0, nicht per Default gebaut (--with-http_v3_module)
#   - OpenSSL ab 1.1.1 fuer QUIC ueberhaupt
#   - 0-RTT zusaetzlich OpenSSL ab 3.5.1 (oder BoringSSL/LibreSSL/QuicTLS);
#     vor nginx 1.29.1 liess sich 0-RTT mit OpenSSL gar nicht einschalten
#   - Das Modul ist weiterhin als "experimental" markiert
#
# Fallstrick: `reuseport` darf pro address:port nur in EINEM listen im ganzen
# Config-Baum stehen. Ein zweiter server{}-Block mit `listen 443 quic reuseport`
# bricht den Start mit `duplicate listen options for 0.0.0.0:443` ab
# (im Testshop nachgestellt).
#
# @see https://github.com/MehmetGoekce/shopware-performance-examples

# TCP-HTTP/2 bleibt aktiv: Fallback fuer Clients ohne QUIC.
listen 443 ssl;
http2 on;

# QUIC-Listener auf UDP 443. `http3` steht ohnehin auf `on` (Default) und
# koennte entfallen - hier steht es, damit die Absicht sichtbar ist.
listen 443 quic reuseport;
http3 on;

# Bewirbt HTTP/3 gegenueber dem Client. Ohne diesen Header findet kein Browser
# den QUIC-Listener.
add_header alt-svc 'h3=":443"; ma=86400' always;
