# Shopware-Konfiguration fuer Asset-Auslieferung ueber ein CDN
#
# Installation:
#   1. Datei nach config/packages/cdn.yaml kopieren
#   2. CDN_URL in .env.local setzen (siehe .env.example)
#   3. bin/console cache:clear
#
# Getestet gegen Shopware 6.6.10.6 (Dockware, prod).
#
# FALLE 1 — `url` ohne `type` bricht den Container:
#   shopware:
#       filesystem:
#           public:
#               url: 'https://cdn.example.com'   # <- so NICHT
#   Ergebnis: `cache:clear` bricht ab mit
#   „The parameter shopware.filesystem.theme.type has a dependency on a
#   non-existent parameter shopware.filesystem.public.type", danach liefert die
#   Storefront HTTP 500. Der Knoten wird komplett ersetzt, `type` muss mit.
#
# FALLE 2 — `public` allein reicht nicht:
#   Fuer `theme`, `asset` und `sitemap` setzt der
#   FilesystemConfigMigrationCompilerPass die URL auf '' und uebernimmt die
#   public-*Storage*-Config („6.1 always refers to the main shop url on theme,
#   asset and sitemap."). Das FallbackUrlPackage nimmt dann den Request-Host —
#   Theme-CSS/JS und /bundles/ bleiben auf der Shop-Domain. Verifiziert: mit nur
#   `public` wandern die Medien aufs CDN, die Theme-Assets nicht.
#
# FALLE 3 — Shopware liest weder ASSET_URL noch CDN_URL von sich aus.
#   CDN_URL ist ausschliesslich der Platzhalter, den diese Datei referenziert.
#
# Quellen:
#   src/Core/Framework/DependencyInjection/FilesystemConfigMigrationCompilerPass.php @v6.6.10.0
#   https://developer.shopware.com/docs/guides/hosting/infrastructure/filesystem.html

shopware:
    filesystem:
        # Medien, Thumbnails, Sitemap-Dateien
        public:
            type: 'local'
            url: '%env(CDN_URL)%'
            config:
                root: '%kernel.project_dir%/public'

        # Kompilierte Theme-Assets (/theme/<hash>/...)
        theme:
            type: 'local'
            url: '%env(CDN_URL)%'
            config:
                root: '%kernel.project_dir%/public'

        # Bundle-Assets der Plugins (/bundles/...)
        asset:
            type: 'local'
            url: '%env(CDN_URL)%'
            config:
                root: '%kernel.project_dir%/public'

        # sitemap.xml und die generierten .xml.gz-Dateien
        sitemap:
            type: 'local'
            url: '%env(CDN_URL)%'
            config:
                root: '%kernel.project_dir%/public'

# ============================================================================
# Optional: S3-kompatibles Storage als Origin
# ============================================================================
#
# Die CDN-URL gehoert auf `url` der jeweiligen Sektion, NICHT in `config`.
#
# shopware:
#     filesystem:
#         public:
#             type: 'amazon-s3'
#             url: '%env(CDN_URL)%'
#             config:
#                 bucket: '%env(S3_BUCKET)%'
#                 region: '%env(S3_REGION)%'
#                 endpoint: '%env(S3_ENDPOINT)%'
#                 options:
#                     ACL: public-read
#
# Ob Bunny Storage unter https://storage.bunnycdn.com eine S3-kompatible API
# anbietet, ist nicht verifiziert — vor dem Einsatz beim Anbieter pruefen.

# ============================================================================
# HTML-Caching: was Shopware steuert und was das CDN steuert
# ============================================================================
#
# Es gibt KEINE Keys `shopware.http_cache.default_ttl` und
# `shopware.http_cache.tag_headers` (Configuration.php @v6.6.10.0) — wer sie
# setzt, bekommt „Unrecognized option".
#
# Die TTL kommt aus der Umgebung:
#     SHOPWARE_HTTP_DEFAULT_TTL=7200
#
# Ohne Reverse Proxy sendet Shopware an JEDE Storefront-Antwort
# `Cache-Control: no-cache, private` (CacheControlListener) — ein CDN kann dann
# kein HTML cachen, egal was im Dashboard eingestellt ist.
#
# Mit Reverse Proxy sendet Shopware `public, s-maxage=<TTL>` plus den Header
# `sw-invalidation-states: logged-in,cart-filled`. Dieser Header ist der
# Vertrag: der Proxy MUSS Requests mit dem Cookie `sw-states=…` am Cache
# vorbeischicken. Varnish tut das mit der offiziellen VCL
# (github.com/shopware/varnish-shopware). Ein CDN tut es nicht von selbst —
# dort braucht es eine Cache-Rule, die bei `sw-states` bzw. `sw-cache-hash`
# auf Bypass geht.
#
# shopware:
#     http_cache:
#         reverse_proxy:
#             enabled: true
#             # PFLICHT: Shopware liefert den Default `redis_url: "redis://redis"`
#             # mit (Core-shopware.yaml). Ohne erreichbaren Redis endet JEDE Seite
#             # in HTTP 500. Fuer Varnish deshalb explizit umschalten:
#             use_varnish_xkey: true
#             redis_url: null
#             hosts:
#                 - 'http://varnish:80'
#
# Achtung: bei aktivem reverse_proxy schickt `bin/console cache:clear` ein
# `BAN /` an jeden Host dieser Liste. Antwortet der Host nicht mit 2xx, bricht
# cache:clear mit einer Exception ab.

# ============================================================================
# Cache-Tags: was Shopware wirklich sendet
# ============================================================================
#
# Mit aktivem Reverse Proxy haengt Shopware die Tags als EINEN Header an:
#     xkey: theme.assets.css product-<id> navigation … (space-separiert)
# Gemessen: Produktseite 139 Tags / 4963 Bytes, Startseite 95 Tags / 3192 Bytes.
#
# Einen `Cache-Tag`-Header (Cloudflare-Konvention) sendet Shopware NIE. Wer am
# CDN per Tag purgen will, muss ihn selbst setzen — siehe
# src/EventSubscriber/CdnCacheTagSubscriber.php. Cloudflare-Grenzen:
# Header max. 16 KB (~1.000 Tags), keine Leerzeichen im Tag, komma-separiert,
# max. 100 Tags pro Purge-Request.
# Quelle: https://developers.cloudflare.com/cache/how-to/purge-cache/purge-by-tags/
