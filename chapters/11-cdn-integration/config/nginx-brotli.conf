# Brotli-Kompression am eigenen nginx-Origin
# Kapitel 11: CDN-Integration
#
# Modul: https://github.com/google/ngx_brotli
# Debian/Ubuntu liefern das Modul in ZWEI Paketen:
#   libnginx-mod-http-brotli-filter  -> `brotli` / `brotli_comp_level` (runtime)
#   libnginx-mod-http-brotli-static  -> `brotli_static` (vorkomprimierte .br)
# Ohne das -static-Paket kennt nginx die Direktive `brotli_static` nicht und
# bricht mit "unknown directive" ab.
#
# In der CI mit `nginx -t` gegen ein nginx-Image MIT ngx_brotli geprueft; das
# offizielle nginx:alpine bringt das Modul nicht mit.
#
# @see https://github.com/MehmetGoekce/shopware-performance-examples

# Statische Assets: die vorkomprimierte .br-Datei ausliefern, wenn es sie gibt.
# Lohnt sich nur zusammen mit Offline-Encoding auf Level 11.
brotli_static on;

# Dynamische Antworten zur Laufzeit komprimieren. Level 6 als Startpunkt -
# jede Stufe hoeher kostet CPU in jedem einzelnen Request.
brotli on;
brotli_comp_level 6;
brotli_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;
