# Shopware-vHost mit PHP-FPM-Anbindung
#
# Installation:
#   sudo cp nginx-shopware-vhost.conf /etc/nginx/sites-available/shopware
#   sudo ln -s /etc/nginx/sites-available/shopware /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Setzt den Upstream aus nginx-php-fpm.conf voraus.
#
# Geprueft auf Ubuntu 22.04 mit nginx 1.18 gegen einen laufenden FPM-Pool:
# /fpm-status liefert die Pool-Statistik, /fpm-ping liefert "pong", beide von
# aussen 403, und die Anwendung antwortet weiter normal.

server {
    listen 443 ssl http2;
    server_name shop.example.com;
    root /var/www/shopware/public;
    index index.php;

    # ... SSL-Konfiguration ...

    # === PHP-Verarbeitung ===
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass php-fpm-shopware;

        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 360s;
        fastcgi_read_timeout 360s;

        fastcgi_keep_conn on;

        # Kein `internal;` hier - das legte jede direkte .php-URL auf 404,
        # auch eine Monitoring-Seite, die Sie selbst ablegen. Der Schutz
        # gegen ausfuehrbare Uploads kommt aus `try_files $uri =404`.
    }

    # === Shopware-Routing ===
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # === Statische Assets (kein PHP) ===
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# Status und Ping nur auf dem Loopback, ohne TLS.
#
# Getrennt vom oeffentlichen vHost aus zwei Gruenden: Der oeffentliche hoert
# auf 443 mit einem Servernamen, ein Monitoring-Agent auf demselben Host will
# aber schlicht http://127.0.0.1:8080/fpm-status abfragen - und die Pfade
# haben nach aussen ohnehin nichts verloren.
#
# Ohne diesen Block sind pm.status_path und ping.path unerreichbar: Die
# Anfrage laeuft im oeffentlichen vHost in `location /` und landet per
# try_files auf /index.php - Shopware antwortet dann mit seiner eigenen
# 404-Seite, und zwar mit HTTP 200 fuer den, der nur den Statuscode prueft.
#
# Kein try_files hier: Die Pfade beantwortet PHP-FPM selbst, es gibt dazu
# keine Datei auf der Platte.
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location = /fpm-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass php-fpm-shopware;
    }

    location = /fpm-ping {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        fastcgi_pass php-fpm-shopware;
    }

    location / {
        return 404;
    }
}
