; Optimierte OPcache-Konfiguration fuer Shopware 6
;
; DIE EINE OPcache-Vorlage dieses Companions. Kapitel 22 (Problem 12) und
; Anhang C verweisen hierher und liefern keine eigene Fassung mehr. Bis
; September 2026 gab es zwei Vorlagen, und beide nannten dieselbe Zieldatei:
; Wer beide Kapitel abarbeitete, ueberschrieb sich still. Gemessen auf
; Ubuntu 24.04 mit PHP 8.3.6 kostete das in der Reihenfolge 9 -> 22 zwei
; wirksame Werte (max_wasted_percentage 10 -> 5 und log_verbosity_level
; 2 -> 1), und `php-fpm8.3 -t` meldete dabei weiter "test is successful".
; Zwei Dateien mit demselben Ziel driften auseinander - deshalb liegt die
; Konfiguration bei dem Kapitel, das sie erklaert, und nur dort.
;
; Installation:
;   sudo cp 99-shopware-opcache.ini /etc/php/8.3/fpm/conf.d/
;   sudo chmod 644 /etc/php/8.3/fpm/conf.d/99-shopware-opcache.ini
;   sudo systemctl reload php8.3-fpm
;
; Shopware 6.6 laeuft auf PHP 8.2 oder 8.3, ab 6.6.10.0 auch auf 8.4
; (composer.json) - den Pfad an die installierte Version anpassen, `php -v`
; zeigt sie an.
;
; NICHT nach 10-opcache.ini kopieren. Dieser Name ist auf Debian und Ubuntu
; bereits vergeben: Die Datei ist ein Symlink der Distribution auf
; /etc/php/8.3/mods-available/opcache.ini, und NUR dort steht
;   zend_extension=opcache.so
; Wer sie ueberschreibt, laedt die Erweiterung nicht mehr - OPcache ist dann
; komplett aus, obwohl hier opcache.enable=1 steht. `cp` folgt dabei dem
; Symlink und ueberschreibt mods-available/opcache.ini, auf die auch die CLI
; zeigt - auch ihr fehlt die Erweiterung danach (`php -m`). Der Symlink selbst
; bleibt stehen, `ls -l conf.d` sieht also unauffaellig aus. `php-fpm8.3 -t` meldet
; trotzdem "test is successful"; der Ausfall ist also lautlos. Die 99 im
; Dateinamen sorgt dafuer, dass diese Datei nach der Distributionsdatei
; gelesen wird und gewinnt.
;
; Ist es schon passiert: `apt-get install --reinstall php8.3-opcache` hilft
; NICHT. Der Paketmanager behaelt die lokal geaenderte Datei (beim Reinstall
; derselben Version ohne Rueckfrage) und legt zusaetzlich 20-opcache.ini-
; Symlinks auf dieselbe kaputte Datei an
; (phpenmod liest die Prioritaet aus der Zeile "; priority=10", die mit der
; Datei verschwunden ist, und faellt auf 20 zurueck). Die Werksfassung liegt
; unveraendert im Paket:
;   sudo cp /usr/share/php8.3-opcache/opcache/opcache.ini /etc/php/8.3/mods-available/opcache.ini
;   sudo rm -f /etc/php/8.3/*/conf.d/20-opcache.ini
;   sudo systemctl restart php8.3-fpm
;   php-fpm8.3 -m 2>&1 | grep -E 'Zend OPcache|already loaded'
;   php -m 2>&1 | grep -E 'Zend OPcache|already loaded'
; Die rm-Zeile ist nur nach einem --reinstall noetig und raeumt dessen
; Symlinks weg; bleiben sie stehen, meldet jeder Aufruf "Cannot load Zend
; OPcache - it was already loaded" - auf stderr, deshalb 2>&1 in der
; Kontrolle. Richtig ist: nur Zeilen "Zend OPcache". Gemessen auf Ubuntu 24.04.
;
; Die Ordnung ist dabei die der ZEICHENKETTEN, nicht die der Zahlen. Gemessen
; auf Ubuntu 24.04: 99-a.ini gewinnt gegen 100-b.ini, weil "9" hinter "1"
; einsortiert. Gegen 10-opcache.ini stimmt der Rat also - aber die 99 ist eine
; Sortier-Konvention, keine Prioritaet. Wer eine dreistellige Nummer vergibt,
; landet vor allem Zweistelligen.
;
; Zum chmod 644 oben - aber nicht aus dem Grund, der dafuer meist genannt
; wird. Eine 0600-Datei mit root als Eigentuemer wird NICHT uebergangen: Der
; FPM-Master liest conf.d als root, bevor er die Worker auf www-data
; herunterstuft. Gemessen auf Ubuntu 24.04 mit PHP 8.3.6 kam eine 0600-Datei
; mit opcache.memory_consumption=333 im echten FastCGI-Request mit 333 an.
; Still ist nicht das Laden, sondern die KONTROLLE: `php-fpm8.3 -i` als
; unprivilegierter Benutzer meldet fuer dieselbe Datei den Vorgabewert 128 und
; warnt mit keinem Wort. Wer so prueft, sucht danach einen Fehler, den es
; nicht gibt. 644 sorgt dafuer, dass die Kontrolle stimmt - und dass die Werte
; auch dann gelten, wenn der Master ausnahmsweise nicht als root laeuft. In
; dem Fall wird die Datei wirklich stillschweigend uebergangen.
;
; Gegenprobe nach dem Reload - FPM, nicht CLI:
;   php-fpm8.3 -m | grep -i 'zend opcache'
;   php-fpm8.3 -i | grep -E '^opcache\.(enable|memory_consumption) =>'
; `php -i | grep opcache` beantwortet etwas anderes: Die CLI hat unter
; Debian und Ubuntu ihre eigene php.ini (/etc/php/8.3/cli/php.ini), und
; opcache.enable_cli steht hier bewusst auf 0. Wer dort prueft, sieht nie die
; Werte, mit denen der Shop laeuft.
;
; Quellen:
;   https://tideways.com/profiler/blog/fine-tune-your-opcache-configuration-to-avoid-caching-suprises
;   https://www.php.net/manual/en/opcache.configuration.php

[opcache]
; === Grundeinstellungen ===
opcache.enable=1

; CLI bewusst aus (das ist auch der Default). Jeder CLI-Aufruf hat seinen
; eigenen OPcache und wirft ihn beim Beenden wieder weg - der Cache bringt
; dort nichts und kostet beim Start Zeit.
opcache.enable_cli=0

; === Speicher-Konfiguration ===

; Shared Memory fuer Bytecode.
; Gemessen an einem warmen Storefront (Shopware 6.6.10.6, Demo-Daten):
; 2278 gecachte Skripte belegen 58,6 MB. 256 MB sind der Startwert; pruefen
; Sie den eigenen Verbrauch, statt zu raten:
;   opcache_get_status(false)['memory_usage']['used_memory']
opcache.memory_consumption=256

; Speicher fuer interned Strings (Klassennamen, Funktionsnamen).
; Default ist 8 MB. 20 empfiehlt Shopwares Performance-Doku; gemessen belegten
; Storefront und Admin-API (6.6.10.6, zwei Demo-Plugins, warm) 12,1 von 16 MB,
; direkt nach einem Cache-Clear 14,7 MB, und jedes Plugin bringt weitere Namen
; mit. Einen Ueberlauf meldet kein Log (siehe log_verbosity_level unten);
; den Stand zeigt nur ein echter Request:
;   opcache_get_status(false)['interned_strings_usage']['free_memory']
;
; opcache.enable_file_override=1 aus derselben Doku steht mit Absicht nicht
; hier: Shopware warnt dort selbst, dass danach nach einem Cache-Clear Fehler
; geworfen werden, weil der alte Container-Pfad im Cache liegt.
; @see https://developer.shopware.com/docs/guides/hosting/performance/performance-tweaks.html
opcache.interned_strings_buffer=20

; Maximale Anzahl gecachter Skripte.
; PHP rundet auf die naechste Zahl der Reihe 223, 463, 983, 1979, 3907, 7963,
; 16229, 32531, 65407, 130987, 262237, 524521 und so fort auf. Aus 50000
; wuerde also 65407 - gleich den wirksamen Wert schreiben. Shopware 6.6.10.6
; mit den beiden Demo-Plugins hat 14177 PHP-Dateien, davon 14160 unter
; vendor/; zaehlen Sie die eigenen mit
;   find /var/www/shopware/vendor /var/www/shopware/src \
;        /var/www/shopware/custom -name '*.php' | wc -l
; Die drei Verzeichnisse sind Absicht: var/ enthaelt den kompilierten Container
; und schwankt je nach Cache-Stand um einige hundert Dateien.
; ACHTUNG: opcache_get_configuration() meldet den EINGETRAGENEN Wert, nicht die
; Rundung. Den wirksamen Wert zeigt nur
;   opcache_get_status(false)['opcache_statistics']['max_cached_keys']
opcache.max_accelerated_files=32531

; === Validierung (KRITISCH fuer Production!) ===

; PRODUCTION: Keine Datei-Aenderungspruefung.
; Dazu gehoert zwingend ein zweiter Schritt: Ohne Reset laeuft nach dem Deploy
; weiter der alte Code. Ins Deployment-Skript gehoert
;   systemctl reload php8.3-fpm
; oder
;   cachetool opcache:reset --fcgi=/var/run/php/php8.3-fpm-shopware.sock
; `bin/console cache:clear` und `php -r 'opcache_reset();'` erreichen den
; FPM-OPcache NICHT - die CLI hat ihre eigene SAPI.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; DEVELOPMENT: Aenderungen pruefen (statt der beiden Zeilen oben)
; opcache.validate_timestamps=1
; opcache.revalidate_freq=2

; === Optimierungen ===

; Maximales Optimierungslevel (entspricht dem Default).
opcache.optimization_level=0x7FFEBFFF

; Kommentare behalten - Shopware und Symfony lesen PHP-Attribute zur Laufzeit.
; Das ist ebenfalls der Default; die Zeile steht hier, damit niemand sie
; versehentlich auf 0 setzt.
opcache.save_comments=1

; === Fehlervermeidung ===

; Ab diesem Anteil verschwendeten Speichers startet OPcache neu. Default ist 5.
opcache.max_wasted_percentage=10

; Default ist 1 (nur Fehler). 2 nimmt OPcaches eigene Warnungen dazu. Sichtbar
; werden davon die beim Start: ungueltige Werte in dieser Datei -
; max_wasted_percentage=55 faellt still auf 5 zurueck, erst mit 2 steht
; "must be set between 1 and 50" auf stderr des FPM-Masters, also im Journal
; (gemessen PHP 8.3.6). Warnungen zur Laufzeit ("Interned string buffer
; overflow", "Not enough free shared space") entstehen im Worker, und dessen
; stderr verwirft FPM ohne catch_workers_output. Mit catch_workers_output
; oder opcache.error_log kommen sie an - als Flut, eine Zeile je String.
; Cache-Neustarts ("Restarting!") meldet erst Stufe 4. Die JIT-Warnung wegen
; pcov/Xdebug haengt NICHT an diesem Wert - sie erscheint bei 0, 1 und 2
; gleich (MEM-284).
opcache.log_verbosity_level=2

; Huge Pages fuer das Code-Segment. Bleibt aus: Die Direktive wirkt nur, wenn
; der Kernel dafuer Huge Pages allokiert hat -
;   sudo sysctl -w vm.nr_hugepages=512
;   grep -E 'HugePages_(Total|Free)' /proc/meminfo
; Ohne diese Vorarbeit ist sie wirkungslos. Einen Gewinn haben wir fuer
; Shopware nicht gemessen; wer es probiert, misst vorher und nachher.
; opcache.huge_code_pages=1
;
; opcache.fast_shutdown gibt es seit PHP 7.2 nicht mehr - die Direktive wuerde
; in 8.x nur unbekannt in der ini stehen.

; === JIT: bewusst aus ===
;
; Shopwares Performance-Doku gibt keine Empfehlung zum OPcache-JIT ab. Ob JIT
; etwas bringt, ist eine Messfrage: Shopware-Requests haengen ueberwiegend an
; Datenbank, Cache und I/O, nicht an der CPU. Der Buffer geht ausserdem
; ZUSAETZLICH zu opcache.memory_consumption vom Speicher ab.
;
; Eigene Messung (Dockware 6.6.10.6, Demo-Daten, ungecachte Route, 14 Paare):
; Median 56,5 -> 62,5 req/s, also rund +10 %. Auf einem Shop mit echter
; Datenmenge faellt der CPU-Anteil kleiner aus - messen Sie selbst mit
; scripts/jit-benchmark.sh, bevor Sie das hier einschalten.
;
; DREI FALLEN, falls Sie es einschalten:
;   1. Die Distributionsdatei 10-opcache.ini enthaelt bereits opcache.jit=off.
;      Nur eine alphabetisch spaetere Datei ueberschreibt das (siehe oben:
;      Zeichenketten-, nicht Zahlenordnung).
;   2. opcache.jit ohne opcache.jit_buffer_size laeuft nicht. Die Vorgabe des
;      Buffers ist 0, und dann gibt es GAR KEINE Meldung - weder im Pool-Log
;      noch im FPM-Log noch auf stderr des Masters. Das ist der wirklich
;      stille Fall; beide Zeilen unten gehoeren zusammen.
;   3. JIT wird abgeschaltet, sobald eine Erweiterung zend_execute_ex()
;      ueberschreibt. Gemessen auf PHP 8.3: pcov mit pcov.enabled=1 (Vorgabe)
;      und Xdebug in jedem Modus ausser off - also beide so, wie die
;      Distributionspakete sie installieren. Sind beide installiert, muessen
;      auch beide aus: gemessen (PHP 8.3, pcov und Xdebug geladen) laeuft der
;      JIT erst mit pcov.enabled=0 UND xdebug.mode=off - jede der beiden
;      Erweiterungen allein haelt ihn aus. Tideways laeuft ohnehin weiter.
;      Hier gibt es eine Warnzeile:
;        "JIT is incompatible with third party extensions that override
;         zend_execute_ex(). JIT disabled."
;      Der FPM-Master stellt ihr "NOTICE: PHP message: " voran - ein
;      grep '^PHP Warning' findet sie deshalb nicht.
;      Sie steht aber NICHT im error_log des Pools und nicht im globalen
;      FPM-Log, sondern auf stderr des FPM-Masters. Mit der systemd-Unit der
;      Distribution landet sie damit im journal:
;        journalctl -u php8.3-fpm | grep -i 'JIT disabled'
;      Von Hand mit -D gestartet geht sie an die aufrufende Shell und ist
;      danach ganz weg.
;
; In allen drei Faellen meldet ini_get('opcache.jit') weiter den eingetragenen
; Wert. Beweis liefert nur
;   opcache_get_status(false)['jit']['enabled']
; und zwar ueber einen echten Request: In der CLI gibt die Funktion mit
; opcache.enable_cli=0 nur false zurueck.
;
; Zu den Ziffern: 1255 ist derselbe Wert wie in Anhang C des Buchs. Die letzten
; beiden Stellen sind Trigger und Optimierungsgrad - 1255 entspricht dem
; Tracing-JIT mit Grad 5. Der lesbare Alias `tracing` ist 1254, also derselbe
; Trigger mit Grad 4. Beides ist gueltig; wir bleiben bei 1255, damit im Buch
; ueberall derselbe Wert steht.
;
; opcache.jit=1255
; opcache.jit_buffer_size=100M
