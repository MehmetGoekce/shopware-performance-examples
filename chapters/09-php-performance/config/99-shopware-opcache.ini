; Optimierte OPcache-Konfiguration fuer Shopware 6
;
; Installation:
;   sudo cp 99-shopware-opcache.ini /etc/php/8.3/fpm/conf.d/
;   sudo systemctl reload php8.3-fpm
;
; Quellen:
;   https://tideways.com/profiler/blog/fine-tune-your-opcache-configuration-to-avoid-caching-suprises
;   https://loadforge.com/guides/maximizing-your-php-applications-speed-with-opcache-optimization

[opcache]
; === Grundeinstellungen ===
opcache.enable=1
opcache.enable_cli=1

; === Speicher-Konfiguration ===

; Shared Memory fuer Bytecode
; Shopware 6 + typische Plugins: 30.000-50.000 Dateien
; Empfehlung: 256MB fuer kleine, 512MB fuer grosse Shops
opcache.memory_consumption=512

; Maximale Anzahl gecachter Skripte
; MUSS hoeher sein als die Anzahl der PHP-Dateien im Projekt!
; Shopware 6 Core: ~15.000 Dateien, mit Plugins: 30.000-50.000
opcache.max_accelerated_files=50000

; Speicher fuer interned Strings (Klassennamen, Funktionsnamen)
; Standard: 8MB, empfohlen: 64MB fuer grosse Projekte
opcache.interned_strings_buffer=64

; === Validierung (KRITISCH fuer Production!) ===

; PRODUCTION: Keine Datei-Aenderungspruefung
; Dateien werden NIE neu kompiliert bis OPcache geleert wird
; Nach jedem Deployment: PHP-FPM reload!
opcache.validate_timestamps=0

; DEVELOPMENT: Aenderungen pruefen (auskommentieren fuer Dev)
; opcache.validate_timestamps=1
; opcache.revalidate_freq=2

; === Optimierungen ===

; Maximales Optimierungslevel
opcache.optimization_level=0x7FFEBFFF

; Kommentare behalten (fuer Annotations/Attributes)
opcache.save_comments=1

; Huge Pages nutzen (wenn vom OS unterstuetzt)
; Kann 5-10% zusaetzliche Performance bringen
opcache.huge_code_pages=1

; === Fehlervermeidung ===

; Wasted Memory Threshold fuer Restart
opcache.max_wasted_percentage=10

; Logs bei OPcache-Fehlern
opcache.log_verbosity_level=2

; === JIT-Konfiguration (PHP 8.0+) ===

; JIT-Modus: "tracing" ist fuer Web-Apps empfohlen
; Alternativen: "off", "function", "tracing"
; Quelle: https://php.watch/articles/jit-in-depth
opcache.jit=tracing

; Buffer fuer JIT-kompilierten Code
; 64-128MB sind ausreichend fuer die meisten Shops
opcache.jit_buffer_size=128M

; JIT-Trigger: Wann wird Code kompiliert?
opcache.jit_hot_func=127
opcache.jit_hot_loop=127
