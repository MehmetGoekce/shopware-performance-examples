; Shopware-spezifische PHP-Einstellungen fuer FPM
;
; Installation:
;   sudo cp 99-shopware.ini /etc/php/8.3/fpm/conf.d/
;   sudo systemctl reload php8.3-fpm
;
; Quelle: https://developer.shopware.com/docs/guides/installation/requirements.html

[PHP]
; === Speicher ===
; Minimum 512M laut Shopware-Anforderungen
; Fuer Imports und grosse Plugins: 1024M
memory_limit = 512M

; === Execution Limits ===
; Standard-Requests: 30s reicht
; Imports/Cronjobs: 300s oder mehr
max_execution_time = 300
max_input_time = 300

; === Input-Variablen ===
; Shopware-Admin mit vielen Feldern braucht mehr
max_input_vars = 10000

; === Uploads ===
; Fuer Produkt-Bilder und Medien
upload_max_filesize = 32M
post_max_size = 33M
max_file_uploads = 50

; === Sessions ===
; Redis fuer Sessions (empfohlen)
session.save_handler = redis
session.save_path = "tcp://127.0.0.1:6379?database=2"
session.gc_maxlifetime = 86400

; Alternativ: Filesystem (falls kein Redis)
; session.save_handler = files
; session.save_path = /var/lib/php/sessions

; === Realpath Cache ===
; Beschleunigt Autoloading erheblich
; Standard 4K ist viel zu wenig fuer Shopware!
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; === Zeitzone ===
; Vermeidet wiederholte Berechnungen
date.timezone = Europe/Zurich

; === Error Handling (Production) ===
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
; E_STRICT wurde mit PHP 8.0 entfernt. Korrekt fuer PHP 8.x:
error_reporting = E_ALL & ~E_DEPRECATED

; === Sicherheit ===
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; === Output ===
output_buffering = 4096
implicit_flush = Off
zlib.output_compression = Off
