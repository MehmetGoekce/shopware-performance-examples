; Shopware-spezifische PHP-Einstellungen fuer FPM
;
; Installation:
;   sudo cp 99-shopware.ini /etc/php/8.3/fpm/conf.d/
;   sudo systemctl reload php8.3-fpm
;
; Quelle: https://developer.shopware.com/docs/v6.6/guides/installation/requirements.html
;
; Das Logverzeichnis /var/log/php-fpm legt PHP nicht selbst an:
;   sudo mkdir -p /var/log/php-fpm && sudo chown www-data:www-data /var/log/php-fpm
; Fehlt es, schreibt PHP die Fehler still nirgendwohin.
;
; Gegenprobe nach dem Reload - in der FPM-SAPI, nicht in der CLI:
;   php-fpm8.3 -i | grep -E '^(memory_limit|max_execution_time|realpath_cache_ttl) =>'
; `php -i` durchsucht nur /etc/php/8.3/cli/conf.d und sieht diese Datei nie.

[PHP]
; === Speicher ===
; Minimum 512M laut Shopware-Anforderungen
; Fuer Imports und grosse Plugins: 1024M
memory_limit = 512M

; === Execution Limits ===
; Standard-Requests: 30s reicht
; Imports/Cronjobs: 300s oder mehr
max_execution_time = 300
max_input_time = 300

; === Input-Variablen ===
; Shopware-Admin mit vielen Feldern braucht mehr
max_input_vars = 10000

; === Uploads ===
; Fuer Produkt-Bilder und Medien
upload_max_filesize = 32M
post_max_size = 33M
max_file_uploads = 50

; === Sessions ===
; Redis fuer Sessions (empfohlen). Wirkt, weil Shopware in framework.yaml
; `session.handler_id: ~` setzt - Symfony nutzt dann den nativen PHP-Handler,
; und der liest diese beiden Zeilen.
session.save_handler = redis
session.save_path = "tcp://127.0.0.1:6379?database=2"
session.gc_maxlifetime = 86400

; Alternativ: Filesystem (falls kein Redis)
; session.save_handler = files
; session.save_path = /var/lib/php/sessions

; === Realpath Cache ===
; Beschleunigt das Autoloading: PHP merkt sich aufgeloeste Pfade, statt bei
; jedem include erneut das Dateisystem zu fragen.
;
; realpath_cache_size steht seit PHP 7.0.16 ab Werk auf 4096K - die frueher
; hier stehende Zeile `realpath_cache_size = 4096K` hat also nichts geaendert.
; Sie steht deshalb nicht mehr drin. Wer sehr viele Plugins hat, kann hoeher
; gehen; pruefen Sie vorher den Ist-Wert mit
;   php-fpm8.3 -i | grep -E '^realpath_cache_size =>'
;
; Der TTL dagegen lohnt sich: ab Werk 120 Sekunden.
realpath_cache_ttl = 3600

; === Zeitzone ===
; Vermeidet wiederholte Berechnungen
date.timezone = Europe/Zurich

; === Error Handling (Production) ===
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php-fpm/error.log
; E_STRICT wurde mit PHP 8.0 entfernt. Korrekt fuer PHP 8.x:
error_reporting = E_ALL & ~E_DEPRECATED

; === Sicherheit ===
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; === Output ===
output_buffering = 4096
implicit_flush = Off
zlib.output_compression = Off
