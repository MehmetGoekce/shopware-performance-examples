; PHP-FPM Pool fuer Shopware 6 - kommentierte Lernfassung zu Kapitel 9
;
; Installation:
;   sudo cp shopware-fpm.conf /etc/php/8.3/fpm/pool.d/shopware.conf
;   sudo mkdir -p /var/log/php-fpm && sudo chown www-data:www-data /var/log/php-fpm
;   sudo php-fpm8.3 -t && sudo systemctl restart php8.3-fpm
;
; Das Logverzeichnis legt PHP-FPM NICHT selbst an. Fehlt es, startet FPM nicht:
;   ERROR: Unable to create or open slowlog(...): No such file or directory
;   ERROR: FPM initialization failed
;
; Danach den mitgelieferten Pool www.conf abschalten. Sonst laufen zwei Pools
; nebeneinander und pm.max_children zaehlt doppelt - der Server plant dann mit
; der doppelten Worker-Zahl, die er an RAM nie hat.
;
; Zielwerte identisch mit der Referenzfassung in
; chapters/anhang-c-konfigurationen/config/php-fpm-pool.conf. Dort steht die
; knappe Version fuer den Anhang, hier die ausfuehrlich kommentierte fuer das
; Kapitel. Wenn Sie beide sehen: es ist dieselbe Datei.
;
; Quelle: https://tideways.com/profiler/blog/an-introduction-to-php-fpm-tuning

[shopware]
; === Identitaet ===
user = www-data
group = www-data

; === Socket (schneller als TCP) ===
listen = /run/php/php8.3-fpm-shopware.sock
listen.owner = www-data
listen.group = www-data
; 0660 setzt voraus, dass der nginx-Worker ebenfalls als www-data laeuft.
; Laeuft er unter einem anderen Benutzer, endet jeder Request mit
; "connect() ... failed (13: Permission denied)" und 502.
listen.mode = 0660

; Backlog fuer wartende Verbindungen. Bei "502 Bad Gateway" erhoehen.
listen.backlog = 65535

; === Process Manager ===
;
; "dynamic" ist der Standardfall fuer einen Shop: Tag/Nacht-Schwankungen und
; Kampagnen-Spitzen. "static" lohnt erst bei hoher, gleichmaessiger Last,
; "ondemand" fuer Hintergrund-Pools, bei denen Latenz egal ist.
;
; pm.max_children ist die Zahl, die wirklich zaehlt: mehr gleichzeitige
; Requests als hier, und die uebrigen warten. Faustformel
;   (verfuegbares RAM in MB - Reserve fuer MySQL/Redis/OS) / RSS je Worker
; Den RSS misst man am laufenden Shop, nicht aus einer Tabelle - dafuer ist
; scripts/php-fpm-memory.sh da.
;
; 50 passt zu einem 16-GB-Server, auf dem alles zusammen laeuft:
;   MySQL Buffer Pool 4 GB + PHP-FPM 50 x ~80 MB = 4 GB + Redis-Cache 4 GB
;   + Redis-Sessions 1 GB = 13 GB, der Rest bleibt fuer System und
;   Dateisystem-Cache.
; Gemessen an einem warmen Shopware 6.6.10.6 mit Demo-Daten: 81 und 86 MB RSS
; je Worker.
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; === Memory Leak Prevention ===
; Worker nach 1000 Requests neu starten. Faengt Speicherlecks in
; Erweiterungen auf, kostet sonst nichts.
pm.max_requests = 1000

; === Timeouts und Slowlog ===
;
; Gestaffelt: max_execution_time 300 < request_terminate_timeout 330 <
; fastcgi_read_timeout 360 (nginx). So bricht immer PHP zuerst ab und
; schreibt einen Fatal Error ins Log. Stehen alle drei auf demselben Wert,
; entscheidet der Zufall, ob es einen Logeintrag gibt oder nur einen 504.
request_terminate_timeout = 330
request_slowlog_timeout = 10
slowlog = /var/log/php-fpm/shopware-slow.log

; === Status-Endpunkt ===
;
; Liefert u. a. "listen queue" - die Zahl der wartenden Requests. Steht dort
; dauerhaft etwas ueber 0, ist pm.max_children zu klein.
;
; Der Pfad ist nur erreichbar, wenn der Webserver ihn ausdruecklich
; weiterreicht. Mit einem blossen `location /` plus try_files landet er auf
; /index.php, und PHP-FPM liefert Shopwares 404 statt der Statusseite. Die
; passenden `location = /fpm-status` und `= /fpm-ping` stehen in
; nginx-php-fpm.conf.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; === PHP-Einstellungen fuer diesen Pool ===
php_admin_value[error_log] = /var/log/php-fpm/shopware-error.log
php_admin_flag[log_errors] = on

; Shopware-Anforderung: mindestens 512M
; @see https://developer.shopware.com/docs/v6.6/guides/installation/requirements.html
php_value[memory_limit] = 512M
php_value[max_execution_time] = 300

; realpath_cache_size steht hier nicht: 4096K ist seit PHP 7.0.16 der
; Vorgabewert, die Zeile aendert nichts. Der TTL dagegen steht ab Werk auf
; 120 Sekunden.
php_value[realpath_cache_ttl] = 3600
