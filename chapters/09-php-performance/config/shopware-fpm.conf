; PHP-FPM Pool fuer Shopware 6 - kommentierte Lernfassung zu Kapitel 9
;
; Installation:
;   sudo cp shopware-fpm.conf /etc/php/8.3/fpm/pool.d/shopware.conf
;   sudo mkdir -p /var/log/php-fpm && sudo chown www-data:www-data /var/log/php-fpm
;   sudo php-fpm8.3 -t && sudo systemctl restart php8.3-fpm
;
; Das Logverzeichnis legt PHP-FPM NICHT selbst an. Fehlt es, startet FPM nicht:
;   ERROR: Unable to create or open slowlog(...): No such file or directory
;   ERROR: failed to post process the configuration
;   ERROR: FPM initialization failed
;
; Nach dem nginx-Umbau (Kapitel 9, Schritt 6) den mitgelieferten Pool www.conf
; abschalten. Sonst laeuft neben diesem ein zweiter Pool, den niemand anspricht. Teuer ist er ab Werk nicht:
; Das mitgelieferte www.conf haelt zwei Worker im Leerlauf und waechst
; hoechstens auf fuenf (pm.max_children = 5). Aber diese Worker stehen in
; keiner RAM-Rechnung, und was Sie in www.conf eintragen, wirkt nicht auf
; diesen Pool. Unter pm = dynamic, wie dort, ist pm.max_children eine
; Obergrenze und reserviert keinen Speicher.
;
; Abschalten heisst umbenennen: php-fpm.conf liest nur
;   include=/etc/php/8.3/fpm/pool.d/*.conf
; www.conf.disabled bleibt also liegen und wird nicht geladen. Auch ein
; `apt-get install --reinstall php8.3-fpm` legt www.conf nicht wieder an
; (gemessen auf Ubuntu 24.04). Aber erst, wenn nginx auf den Socket DIESES
; Pools zeigt (Kapitel 9, Schritt 6): www.conf hoert auf
; /run/php/php8.3-fpm.sock, und mit ihm verschwindet auch der Sammel-Socket
; /run/php/php-fpm.sock, den das Paket nur fuer www.conf anlegt. Fragt nginx
; noch einen der beiden an, liefert der Shop 502. Die Suche muss leer bleiben:
;   sudo nginx -T 2>/dev/null | grep -E '^[^#]*/run/php/php(8\.3)?-fpm\.sock'
;   sudo mv /etc/php/8.3/fpm/pool.d/www.conf /etc/php/8.3/fpm/pool.d/www.conf.disabled
;   sudo php-fpm8.3 -t && sudo systemctl restart php8.3-fpm
;
; Das ist die EINZIGE Pool-Vorlage des Companions. Anhang C druckt sie ab und
; liefert keine eigene mehr (bis September 2026 lag dort eine zweite Fassung
; mit derselben Zieldatei, MEM-288). Grund: Zwei Vorlagen auf einer Zieldatei
; ueberschreiben sich lautlos - es gewinnt, was zuletzt kopiert wurde, und
; `php-fpm8.3 -t` meldet trotzdem "test is successful".
;
; Liegt von frueher noch eine zweite Datei mit [shopware] in pool.d, hilft
; auch ein eigener Dateiname nicht: FPM baut aus allen Dateien mit demselben
; Poolnamen EINEN Pool. Wo zwei davon dieselbe Direktive setzen, haengt der
; Gewinner an der Art der Direktive:
;
;   Einzelwerte - pm.*, listen, request_*, slowlog, user ...:
;     die alphabetisch LETZTE Datei gewinnt
;   Listen - php_value, php_flag, php_admin_value, php_admin_flag, env[...]:
;     die alphabetisch ERSTE Datei gewinnt
;     (php_admin_value schlaegt php_value derselben Einstellung aber immer,
;     gleich in welcher Datei es steht)
;
; Wer dann nur eine der beiden Dateien anpasst, bekommt nur die Haelfte der
; Anpassung. Auch das meldet `php-fpm8.3 -t` als erfolgreich; `php-fpm8.3 -tt`
; fuehrt bei den Listen beide Werte auf, wirksam ist der jeweils zuletzt
; aufgefuehrte. Pruefen:
;   grep -l '^\[shopware\]' /etc/php/8.3/fpm/pool.d/*.conf
; Die Ausgabe muss genau eine Datei nennen.
;
; Geprueft in CI (Job "PHP-FPM Pool Boot") auf ubuntu:24.04 mit einem echten
; FastCGI-Request (cgi-fcgi). Das Binary heisst je nach Herkunft verschieden:
; im offiziellen Image php:8.3-fpm `php-fpm`, in den Paketen von Debian und
; Ubuntu versioniert `php-fpm8.3` - ein blankes `php-fpm` gibt es dort im PATH
; nicht.
;
; Die OPcache-Einstellungen stehen NICHT hier, sondern in
; 99-shopware-opcache.ini: Sie gehoeren nach conf.d, damit sie fuer alle Pools
; gelten und `php-fpm8.3 -i` sie zeigt.
;
; Quelle: https://tideways.com/profiler/blog/an-introduction-to-php-fpm-tuning

[shopware]
; === Identitaet ===
user = www-data
group = www-data

; === Socket (schneller als TCP) ===
listen = /run/php/php8.3-fpm-shopware.sock
listen.owner = www-data
listen.group = www-data
; 0660 setzt voraus, dass der nginx-Worker ebenfalls als www-data laeuft.
; Laeuft er unter einem anderen Benutzer, endet jeder Request mit
; "connect() ... failed (13: Permission denied)" und 502.
listen.mode = 0660

; Backlog fuer wartende Verbindungen. Bei "502 Bad Gateway" erhoehen.
listen.backlog = 65535

; === Process Manager ===
;
; "dynamic" ist der Standardfall fuer einen Shop: Tag/Nacht-Schwankungen und
; Kampagnen-Spitzen. "static" lohnt erst bei hoher, gleichmaessiger Last,
; "ondemand" fuer Hintergrund-Pools, bei denen Latenz egal ist.
;
; pm.max_children ist die Zahl, die wirklich zaehlt: mehr gleichzeitige
; Requests als hier, und die uebrigen warten. Faustformel
;   (verfuegbares RAM in MB - Reserve fuer MySQL/Redis/OS) / RSS je Worker
; Den RSS misst man am laufenden Shop, nicht aus einer Tabelle - dafuer ist
; scripts/php-fpm-memory.sh da. Wer es selbst mit ps macht, filtert auf die
; Pool-Prozesse: -C php-fpm8.3 trifft auch den Master, und der ist kein
; Worker. In einem leeren Testpool mit drei Workern (Master 6,7 MB, Worker
; rund 56 MB) meldet der ungefilterte Schnitt 43,4 statt 55,6 MB - 22 Prozent
; zu wenig, in die gefaehrliche Richtung; bei 50 Workern noch rund zwei
; Prozent:
;   ps --no-headers -o rss,args -C php-fpm8.3 | grep 'pool' | awk '{s+=$1; n++} END {print s/n/1024" MB"}'
;
; 50 passt zu einem 16-GB-Server, auf dem alles zusammen laeuft:
;   MySQL Buffer Pool 4 GB + PHP-FPM 50 x ~80 MB = 4 GB + Redis-Cache 4 GB
;   + Redis-Sessions 1 GB = 13 GB, der Rest bleibt fuer System und
;   Dateisystem-Cache.
; Gemessen an einem warmen Shopware 6.6.10.6 mit Demo-Daten: 81 und 86 MB RSS
; je Worker.
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; === Memory Leak Prevention ===
; Worker nach 1000 Requests neu starten. Faengt Speicherlecks in
; Erweiterungen auf, kostet sonst nichts.
pm.max_requests = 1000

; === Timeouts und Slowlog ===
;
; Gestaffelt: max_execution_time 300 < request_terminate_timeout 330 <
; fastcgi_read_timeout 360 (nginx). So bricht immer PHP zuerst ab und
; schreibt einen Fatal Error ins Log. Stehen alle drei auf demselben Wert,
; entscheidet der Zufall, ob es einen Logeintrag gibt oder nur einen 504.
request_terminate_timeout = 330
request_slowlog_timeout = 10
slowlog = /var/log/php-fpm/shopware-slow.log

; === Status-Endpunkt ===
;
; Liefert u. a. "listen queue" - die Zahl der wartenden Requests. Steht dort
; dauerhaft etwas ueber 0, ist pm.max_children zu klein.
;
; Der Pfad ist nur erreichbar, wenn der Webserver ihn ausdruecklich
; weiterreicht. Mit einem blossen `location /` plus try_files landet er auf
; /index.php, und PHP-FPM liefert Shopwares 404 statt der Statusseite. Die
; passenden `location = /fpm-status` und `= /fpm-ping` stehen im vHost aus
; Anhang C (chapters/anhang-c-konfigurationen/config/nginx-shopware.conf),
; auf einem eigenen Loopback-Listener 127.0.0.1:8080.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; === Environment ===
;
; PHP-FPM reicht die Umgebung des Elternprozesses NICHT weiter. Was Shopware
; braucht, steht in .env bzw. .env.local; hier stehen nur die Variablen, die
; Bibliotheken direkt lesen.
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; === PHP-Einstellungen fuer diesen Pool ===
php_admin_value[error_log] = /var/log/php-fpm/shopware-error.log
php_admin_flag[log_errors] = on

; Shopware-Anforderung: mindestens 512M
; @see https://developer.shopware.com/docs/v6.6/guides/installation/requirements.html
php_value[memory_limit] = 512M
php_value[max_execution_time] = 300

; Muss zu client_max_body_size im nginx-vHost passen (Anhang C, dort 128M).
; 99-shopware.ini setzt dieselben 128M in conf.d; der Pool setzt sie
; trotzdem, damit er auch ohne diese Datei vollstaendig ist - sonst gilt
; PHPs Vorgabe, 2M bzw. 8M. php_value im Pool gewinnt gegen conf.d.
php_value[upload_max_filesize] = 128M
php_value[post_max_size] = 128M

; realpath_cache_size steht hier nicht: 4096K ist seit PHP 7.0.16 / 7.1.2
; der Vorgabewert, die Zeile aendert nichts. Der TTL dagegen steht ab Werk
; auf 120 Sekunden; Shopwares Performance-Doku empfiehlt 3600.
; @see https://developer.shopware.com/docs/guides/hosting/performance/performance-tweaks.html
php_value[realpath_cache_ttl] = 3600
