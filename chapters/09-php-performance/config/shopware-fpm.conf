; Optimierter PHP-FPM Pool fuer Shopware 6
;
; Installation:
;   sudo cp shopware-fpm.conf /etc/php/8.3/fpm/pool.d/
;   sudo systemctl reload php8.3-fpm
;
; WICHTIG: pm.max_children MUSS an Ihren Server angepasst werden!
; Nutzen Sie calculate-max-children.sh zur Berechnung.
;
; Quelle: https://tideways.com/profiler/blog/an-introduction-to-php-fpm-tuning

[shopware]
; === Identitaet ===
user = www-data
group = www-data

; === Socket (schneller als TCP) ===
listen = /var/run/php/php8.3-fpm-shopware.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Backlog fuer wartende Verbindungen
; Bei "502 Bad Gateway" erhoehen
listen.backlog = 65535

; === Process Manager ===
; "dynamic" ist fuer variable Last optimal
; Alternative: "static" fuer konstante Last
pm = dynamic

; ANPASSEN! Berechnet fuer 16GB RAM Server:
; (16384 - 2048 - 4096) * 0.8 / 128 = 64 Worker
; Nutzen Sie calculate-max-children.sh fuer Ihren Server!
pm.max_children = 64

; Empfehlung: 25% von max_children
pm.start_servers = 16

; Minimum idle Workers
pm.min_spare_servers = 16

; Maximum idle Workers (75% von max_children)
pm.max_spare_servers = 48

; === Memory Leak Prevention ===
; Worker nach X Requests recyclen
; Verhindert Memory Leaks durch fehlerhafte Plugins
pm.max_requests = 1000

; === Timeouts ===
; Request-Timeout (Import-Prozesse brauchen mehr)
request_terminate_timeout = 300s

; === Slow Log (WICHTIG fuer Debugging!) ===
; Loggt Requests die laenger als X Sekunden dauern
slowlog = /var/log/php/shopware-slow.log
request_slowlog_timeout = 5s

; === Status-Seite fuer Monitoring ===
pm.status_path = /php-fpm-status
ping.path = /php-fpm-ping

; === PHP-Einstellungen fuer diesen Pool ===
php_admin_value[error_log] = /var/log/php/shopware-error.log
php_admin_flag[log_errors] = on

; Shopware-Anforderung: mindestens 512M
php_admin_value[memory_limit] = 512M
