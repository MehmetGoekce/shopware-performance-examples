; Shopware-spezifische PHP-Einstellungen fuer CLI
;
; Installation:
;   sudo cp 99-shopware-cli.ini /etc/php/8.3/cli/conf.d/
;
; Hinweis: CLI braucht andere Limits als FPM
;
; Das Logverzeichnis /var/log/php-fpm legt PHP nicht selbst an:
;   sudo mkdir -p /var/log/php-fpm && sudo chown www-data:www-data /var/log/php-fpm
; Fehlt es, schreibt PHP die Fehler still nirgendwohin.

[PHP]
; CLI braucht mehr Memory fuer Imports/Indexierung
memory_limit = 2G

; Keine Zeitbegrenzung fuer lange Prozesse
max_execution_time = 0

; Realpath-TTL auch fuer die CLI. realpath_cache_size steht seit PHP 7.0.16
; ab Werk auf 4096K - eine Zeile dafuer aendert nichts. Der TTL dagegen
; steht ab Werk auf 120 Sekunden.
realpath_cache_ttl = 3600

; Zeitzone
date.timezone = Europe/Zurich

; Error Handling fuer CLI
display_errors = On
log_errors = On
error_log = /var/log/php-fpm/cli-error.log
error_reporting = E_ALL
