# Nginx FastCGI-Konfiguration fuer PHP-FPM
#
# Installation:
#   sudo cp nginx-php-fpm.conf /etc/nginx/conf.d/php-fpm.conf
#   # Die location-Bloecke unten in den eigenen vHost uebernehmen
#   sudo nginx -t && sudo systemctl reload nginx
#
# Diese Datei liegt im http-Kontext und enthaelt deshalb nur den Upstream.
# location-Bloecke gehoeren in den server-Block des vHosts - sie stehen unten
# als Vorlage zum Kopieren.
#
# Geprueft auf Ubuntu 22.04 mit nginx 1.18 gegen einen laufenden FPM-Pool:
# /fpm-status liefert die Pool-Statistik, /fpm-ping liefert "pong", beide von
# aussen 403, und die Anwendung antwortet weiter normal.

# === Upstream Definition ===
upstream php-fpm-shopware {
    # Unix Socket (schneller als TCP)
    server unix:/run/php/php8.3-fpm-shopware.sock;

    # Keep-Alive Verbindungen zum FPM
    keepalive 32;
}

# =====================================================================
# Vorlage fuer den server-Block. Reihenfolge beachten: exakte Treffer
# (location = ...) gewinnen vor dem regulaeren Ausdruck fuer .php.
# =====================================================================
#
# # --- Status und Ping ---
# #
# # Ohne diese beiden Bloecke sind pm.status_path und ping.path aus dem Pool
# # nicht erreichbar: Die Anfrage laeuft in `location /` und landet per
# # try_files auf /index.php - der Shop antwortet dann mit seiner eigenen
# # 404-Seite, und zwar mit HTTP 200 fuer den, der nur den Statuscode prueft.
# #
# # Kein try_files und kein SCRIPT_FILENAME auf eine echte Datei: Die Pfade
# # beantwortet PHP-FPM selbst, es gibt dazu kein Skript auf der Platte.
