#
#     # KEIN `internal;` hier. Das wuerde jede direkte .php-URL auf 404 legen -
#     # auch eine Monitoring-Seite, die Sie selbst ablegen. Der Schutz gegen
#     # ausfuehrbare Uploads kommt aus `try_files $uri =404` plus der Regel,
