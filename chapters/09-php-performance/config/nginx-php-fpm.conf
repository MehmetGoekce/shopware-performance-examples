#     fastcgi_param DOCUMENT_ROOT $realpath_root;
#
#     # Buffer fuer grosse Responses (Admin-Seiten ~2 MB, API ~1 MB).
#     # Sizing-Beispiel: 256 x 16k = 4 MB Buffer-Headroom pro Worker.
#     # fastcgi_buffer_size beschreibt den ERSTEN Buffer (Header-Antwort).
#     fastcgi_buffer_size 128k;
#     fastcgi_buffers 256 16k;
#     fastcgi_busy_buffers_size 256k;
#     fastcgi_temp_file_write_size 256k;
#
#     # Timeouts: gestaffelt hinter PHP (max_execution_time 300) und FPM
