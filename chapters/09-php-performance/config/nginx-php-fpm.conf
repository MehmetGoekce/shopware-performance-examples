# Nginx FastCGI-Konfiguration fuer PHP-FPM
#
# Installation:
#   sudo cp nginx-php-fpm.conf /etc/nginx/conf.d/php-fpm.conf
#   # Dann in Ihrem vHost include oder Upstream nutzen
#   sudo nginx -t && sudo systemctl reload nginx

# === Upstream Definition ===
upstream php-fpm-shopware {
    # Unix Socket (schneller als TCP)
    server unix:/var/run/php/php8.3-fpm-shopware.sock;

    # Keep-Alive Verbindungen zum FPM
    keepalive 32;
}

