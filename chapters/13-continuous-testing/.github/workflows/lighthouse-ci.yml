# Lighthouse CI GitHub Actions Workflow
#
# Führt Performance-Tests bei jedem Push/PR aus.
#
# Setup:
#   1. Repository Settings > Secrets > LHCI_GITHUB_APP_TOKEN hinzufügen
#   2. Optional: LHCI_TOKEN für LHCI Server
#
# Dokumentation:
#   https://github.com/GoogleChrome/lighthouse-ci/blob/main/docs/getting-started.md

name: Lighthouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manueller Trigger
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Optional: Shopware Build
      # - name: Build Shopware Storefront
      #   run: |
      #     bin/console theme:compile
      #     bin/console assets:install

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          # Optional: LHCI Server Token
          # LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}

      # Ergebnisse als Artifact speichern
      - name: Upload Lighthouse Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      # Optional: PR-Kommentar mit Ergebnissen
      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.lighthouseci/manifest.json';

            if (!fs.existsSync(path)) {
              console.log('No manifest found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const results = manifest.map(entry => {
              const summary = entry.summary;
              return `| ${entry.url} | ${Math.round(summary.performance * 100)} | ${Math.round(summary.accessibility * 100)} | ${Math.round(summary.seo * 100)} |`;
            });

            const comment = `## Lighthouse CI Results

            | URL | Performance | Accessibility | SEO |
            |-----|-------------|---------------|-----|
            ${results.join('\n')}

            [Full Report](${manifest[0]?.htmlPath || 'N/A'})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Separater Job für Staging-Umgebung
  lighthouse-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs: lighthouse

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Test Staging Environment
        run: |
          lhci autorun \
            --collect.url="https://staging.ihr-shop.de/" \
            --collect.url="https://staging.ihr-shop.de/kategorie/test/" \
            --collect.numberOfRuns=5
        env:
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
