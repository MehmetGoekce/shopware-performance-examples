# Lighthouse CI für Pull Requests — Kapitel 13
#
# Misst die Staging- oder Preview-URL aus der Repository-Variable
# LHCI_BASE_URL, nicht den Code im Runner. Der Stand des Pull Requests
# muss dort deployt sein.
#
# Einrichten:
#   1. lighthouserc.cjs aus config/ ins Repository-Root kopieren
#   2. Settings > Secrets and variables > Actions > Variables: LHCI_BASE_URL
#   3. Settings > Branches: Job "lighthouse" als Required Check setzen
#
# Getestet: Schritte lokal mit @lhci/cli 0.15.1 gegen Shopware 6.6.10.6.

name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Feste Version, kein "npx lhci": ohne installiertes @lhci/cli
      # lädt npx das fremde Paket "lhci", das immer mit Exit 0 endet
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.1

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_BASE_URL: ${{ vars.LHCI_BASE_URL }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: .lighthouseci/

      # Auch nach einer Regression kommentieren (dann ist er am wichtigsten)
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = '.lighthouseci/manifest.json';
            if (!fs.existsSync(path)) {
              core.warning('Kein manifest.json: Lighthouse CI brach vor dem Upload ab');
              return;
            }

            // Ein Eintrag je Lauf; nur den Median-Lauf je URL zeigen
            const runs = JSON.parse(fs.readFileSync(path, 'utf8'))
              .filter((run) => run.isRepresentativeRun);
            const pct = (score) => Math.round(score * 100);

            let body = '## Lighthouse CI\n\n';
            body += '| URL | Performance | Accessibility | Best Practices | SEO |\n';
            body += '|-----|-------------|---------------|----------------|-----|\n';
            for (const run of runs) {
              const s = run.summary;
              body += `| ${run.url} | ${pct(s.performance)} | ${pct(s.accessibility)} `
                + `| ${pct(s['best-practices'])} | ${pct(s.seo)} |\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
