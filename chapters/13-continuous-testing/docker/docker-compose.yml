# LHCI-Server für Verläufe und Build-Vergleiche — Kapitel 13
#
# Start:     LHCI_PASSWORD=… docker compose up -d
# Dashboard: http://localhost:9001 (Benutzer "ci", Passwort aus LHCI_PASSWORD)
# Projekt:   docker compose exec lhci-server npx lhci wizard
#            Server-URL: http://localhost:9001 — der Wizard im Container
#            übernimmt die Zugangsdaten aus der Umgebung des Containers.
#            ("lhci" allein liegt im Image nicht im PATH.)
#
# Das Image bringt SQLite unter /data/lhci.db mit; das Volume hält die Daten.
# Für den Zugriff aus der CI gehört ein Reverse-Proxy mit TLS davor.
#
# Getestet mit patrickhulce/lhci-server:0.15.1 (Podman).
#
# @see https://github.com/GoogleChrome/lighthouse-ci/blob/v0.15.1/docs/server.md

services:
  lhci-server:
    image: patrickhulce/lhci-server:0.15.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      # Ohne Passwort ist Dashboard und API für jeden offen
      LHCI_BASIC_AUTH__USERNAME: ci
      LHCI_BASIC_AUTH__PASSWORD: ${LHCI_PASSWORD:?LHCI_PASSWORD setzen}
    volumes:
      - lhci-data:/data

volumes:
  lhci-data:
