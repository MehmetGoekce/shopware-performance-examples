# LHCI Server Docker Setup
#
# Lighthouse CI Server für Trend-Analyse und Team-Dashboards
#
# Installation:
#   1. cp .env.example .env
#   2. LHCI_TOKEN generieren: openssl rand -hex 16
#   3. docker-compose up -d
#
# Dashboard: http://localhost:9001
#
# Dokumentation:
#   https://github.com/GoogleChrome/lighthouse-ci/blob/main/docs/server.md

version: '3.8'

services:
  lhci-server:
    image: patrickhulce/lhci-server:latest
    container_name: lhci-server
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - LHCI_NO_LIGHTHOUSERC=1
    volumes:
      - lhci-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

