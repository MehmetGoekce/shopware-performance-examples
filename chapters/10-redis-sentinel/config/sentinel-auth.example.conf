# /etc/redis/sentinel-auth.conf  (chmod 640, root:redis)
#
# Separates Secrets-File fuer Sentinel-Authentifizierung. Wird per `include`
# aus sentinel.conf eingebunden.
#
# Setup-Workflow (gleiches Passwort wie in redis-auth.conf):
#   sudo tee /etc/redis/sentinel-auth.conf > /dev/null <<EOF
#   sentinel auth-pass shopware-master ${REDIS_PWD}
#   EOF
#   sudo chown root:redis /etc/redis/sentinel-auth.conf
#   sudo chmod 640 /etc/redis/sentinel-auth.conf
#
# Diese .example-Datei ist NICHT lauffaehig — Platzhalter ersetzen!

sentinel auth-pass shopware-master <GENERATED-VIA-openssl-rand-base64-32>
