# /etc/redis/sentinel-auth.conf  (chmod 640, root:redis)
#
# Separates Secrets-File fuer Sentinel. Wird per `include` aus sentinel.conf
# eingebunden — WICHTIG: der include muss NACH den "sentinel monitor"-Zeilen
# stehen, sonst kennt Sentinel den Master-Namen noch nicht.
#
# Setup-Workflow (gleiches Passwort wie in redis-auth.conf):
#   sudo tee /etc/redis/sentinel-auth.conf > /dev/null <<EOF
#   sentinel auth-pass shopware-cache   ${REDIS_PWD}
#   sentinel auth-pass shopware-session ${REDIS_PWD}
#   EOF
#   sudo chown root:redis /etc/redis/sentinel-auth.conf
#   sudo chmod 640 /etc/redis/sentinel-auth.conf
#
# ---------------------------------------------------------------------------
# ACHTUNG: dieses Muster haelt das Passwort NICHT aus sentinel.conf heraus.
# ---------------------------------------------------------------------------
# Sentinel schreibt seine Konfiguration bei jeder Zustandsaenderung neu (neuer
# Replica entdeckt, Failover, neuer Sentinel im Quorum). Dabei haengt es einen
# Block "# Generated by CONFIG REWRITE" an — und darin steht das Passwort im
# Klartext:
#
#   # Generated by CONFIG REWRITE
#   sentinel auth-pass shopware-cache <Klartext>
#
# Die include-Zeile bleibt zwar stehen, aber das Geheimnis ist ab dem ersten
# Rewrite eben doch in sentinel.conf. Konsequenz:
#
#   sudo chown root:redis /etc/redis/sentinel.conf
#   sudo chmod 640 /etc/redis/sentinel.conf
#
# Der Nutzen des include liegt damit beim Verteilen und Rotieren (eine Datei
# pro Maschine, nicht im Git), nicht beim Verbergen vor lokalen Lesern.
#
# Diese .example-Datei ist NICHT lauffaehig — Platzhalter ersetzen!

sentinel auth-pass shopware-cache   <GENERATED-VIA-openssl-rand-base64-32>
sentinel auth-pass shopware-session <GLEICHES-PASSWORT-WIE-OBEN>
