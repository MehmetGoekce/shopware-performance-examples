# Shopware/Symfony-Konfiguration fuer Redis Sentinel
#
# Installation:
#   1. Diese Datei nach config/packages/redis.yaml kopieren
#   2. Umgebungsvariablen aus ../.env.example in .env.local uebernehmen
#   3. bin/console cache:clear
#
# Voraussetzung: ext-redis >= 5.2 ODER predis/predis ODER ext-relay.
# Symfony akzeptiert alle drei fuer Sentinel — Predis ist NICHT Pflicht.
# Beleg: vendor/symfony/cache/Traits/RedisTrait.php, Sentinel-Zweig.
#
# Quelle: https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html

# ============================================================================
# DSN-Form: WICHTIG
# ============================================================================
#
# Die Sentinel-DSN beginnt mit "redis:" OHNE die zwei Schraegstriche.
#
#   richtig:  redis:passwort@?host[...]&redis_sentinel=...
#   falsch:   redis://passwort@?host[...]&redis_sentinel=...
#
# Symfony schreibt die DSN vor dem Parsen zu "file:" um. Mit den Schraegstrichen
# und leerem Host liefert parse_url() dann false, und der Shop startet gar nicht
# erst: "InvalidArgumentException: Invalid Redis DSN."
# Die Symfony-Doku zeigt beide Formen — nur die schraegstrichlose funktioniert.
#
# Das Passwort muss URL-kodiert sein (aus "geheim!2026" wird "geheim%212026"),
# Symfony ruft darauf rawurldecode() auf.
#
# Master-Passwort gehoert in den Userinfo-Block (vor dem @). Der Query-Parameter
# &auth= ist die SENTINEL-Authentifizierung, nicht die des Masters.

framework:
    cache:
        # Cache-Instanz ueber Sentinel. redis_tag_aware legt Cache-Eintraege UND
        # Tag-Index im selben Redis ab — das ist der Punkt bei mehreren
        # App-Servern: die Invalidierungs-Information muss geteilt sein.
        #
        # Wuerde man stattdessen nur cache.object/cache.http auf
        # cache.adapter.redis umbiegen und cache.app auf dem Dateisystem lassen,
        # blieben die Tag-Versionen lokal auf jedem App-Server liegen. Ein
        # Server, der eine Invalidierung nicht selbst verarbeitet hat, liefert
        # dann dauerhaft veraltete Seiten aus dem gemeinsamen Redis.
        app: cache.adapter.redis_tag_aware
        system: cache.adapter.redis_tag_aware

        # timeout/read_timeout sind hier keine Feinheit: Symfony faellt sonst auf
        # timeout=30 zurueck. Faellt der Master aus, haengt ein Request dann bis
        # zu 30 s am toten Socket — Sentinel hat laengst umgeschaltet, der
        # PHP-Prozess wartet trotzdem. Mit 2 s ist der Ausfall fuer Besucher
        # praktisch nur ein einzelner langsamer Request.
        default_redis_provider: >-
            redis:%env(REDIS_AUTH_PASSWORD)%@?host[%env(REDIS_SENTINEL_HOST1)%]&host[%env(REDIS_SENTINEL_HOST2)%]&host[%env(REDIS_SENTINEL_HOST3)%]&redis_sentinel=%env(REDIS_SENTINEL_CACHE)%&timeout=2&read_timeout=2

    session:
        # Eigener Sentinel-Master-Name -> eigene Redis-Instanz mit anderer
        # Eviction-Policy und mit Persistenz (siehe redis-session.conf).
        #
        # handler_id gilt Symfony nur dann als DSN, wenn er "://" enthaelt ODER
        # Umgebungsvariablen benutzt (FrameworkExtension, registerSessionConfiguration).
        # Weil die schraegstrichlose Form kein "://" hat, ist %env(...)% hier
        # PFLICHT — mit ausgeschriebenen Werten haelt Symfony die DSN fuer eine
        # Service-ID und wirft ServiceNotFoundException.
        handler_id: >-
            redis:%env(REDIS_AUTH_PASSWORD)%@?host[%env(REDIS_SENTINEL_HOST1)%]&host[%env(REDIS_SENTINEL_HOST2)%]&host[%env(REDIS_SENTINEL_HOST3)%]&redis_sentinel=%env(REDIS_SENTINEL_SESSION)%&timeout=2&read_timeout=2
        cookie_secure: auto
        cookie_samesite: lax

# ============================================================================
# Variante mit expliziter Predis-Service-Definition
# ============================================================================
#
# Nur noetig, wenn Optionen gebraucht werden, die die DSN nicht abbildet
# (z. B. TLS-Kontext). Setzt "composer require predis/predis" voraus.
#
# services:
#     app.redis_sentinel:
#         class: Predis\Client
#         arguments:
#             -
#                 - 'tcp://%env(REDIS_SENTINEL_HOST1)%'
#                 - 'tcp://%env(REDIS_SENTINEL_HOST2)%'
#                 - 'tcp://%env(REDIS_SENTINEL_HOST3)%'
#             -
#                 replication: sentinel
#                 service: '%env(REDIS_SENTINEL_CACHE)%'
#                 parameters:
#                     password: '%env(REDIS_AUTH_PASSWORD)%'
#
# Mit TLS: die drei Hosts auf 'tls://' umstellen und den ssl-Block ergaenzen.
# phpredis kennt vergleichbare Stream-Context-Options bei Redis::connect().
#
#                 - 'tls://%env(REDIS_SENTINEL_HOST1)%'
#                 - 'tls://%env(REDIS_SENTINEL_HOST2)%'
#                 - 'tls://%env(REDIS_SENTINEL_HOST3)%'
#
#                 ssl:
#                     verify_peer: true
#                     cafile:     '/etc/redis/tls/ca.crt'
#                     local_cert: '/etc/redis/tls/client.crt'
#                     local_pk:   '/etc/redis/tls/client.key'
#
# framework:
#     cache:
#         app: cache.adapter.redis_tag_aware
#         default_redis_provider: 'app.redis_sentinel'
