# Shopware/Symfony Konfiguration fuer Redis Sentinel
#
# Installation:
#   1. Predis installieren: composer require predis/predis
#   2. Diese Datei nach config/packages/redis.yaml kopieren
#   3. Umgebungsvariablen aus .env.example in .env.local kopieren
#      und Werte einsetzen — siehe ../.env.example
#
# Quelle: https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html

# ============================================================================
# Option 1: Einfache Sentinel-DSN (empfohlen)
# ============================================================================

framework:
    cache:
        # Sentinel-DSN: Master-Auth gehoert in Userinfo (redis://password@?host[...]).
        # &auth= ist laut Symfony-Doku fuer SENTINEL-Auth, nicht Master.
        # Quelle: https://symfony.com/doc/current/components/cache/adapters/redis_adapter.html
        default_redis_provider: >-
            redis://%env(REDIS_AUTH_PASSWORD)%@?host[%env(REDIS_SENTINEL_HOST1)%]&host[%env(REDIS_SENTINEL_HOST2)%]&host[%env(REDIS_SENTINEL_HOST3)%]&redis_sentinel=%env(REDIS_SENTINEL_SERVICE)%

        pools:
            cache.object:
                adapter: cache.adapter.redis

            cache.http:
                adapter: cache.adapter.redis

