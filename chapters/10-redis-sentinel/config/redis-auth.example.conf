# /etc/redis/redis-auth.conf  (chmod 640, root:redis)
#
# Separates Secrets-File fuer Redis-Authentifizierung. Wird per `include`
# aus redis.conf eingebunden, damit das eigentliche Passwort nicht
# committet werden muss.
#
# Setup-Workflow (auf einem Master-Node, einmalig):
#   REDIS_PWD=$(openssl rand -base64 32)
#   sudo tee /etc/redis/redis-auth.conf > /dev/null <<EOF
#   requirepass "${REDIS_PWD}"
#   masterauth "${REDIS_PWD}"
#   EOF
#   sudo chown root:redis /etc/redis/redis-auth.conf
#   sudo chmod 640 /etc/redis/redis-auth.conf
#
# Anschliessend per scp/ssh-agent auf die Replica-Nodes uebertragen.
# Diese .example-Datei ist NICHT lauffaehig — Platzhalter ersetzen!

requirepass "<GENERATED-VIA-openssl-rand-base64-32>"
masterauth "<GLEICHES-PASSWORT-WIE-OBEN>"
