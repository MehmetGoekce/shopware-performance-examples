# Redis Master Konfiguration fuer Shopware 6
#
# Installation (Node 1):
#   sudo cp redis-master.conf /etc/redis/redis.conf
#   sudo systemctl restart redis-server
#
# WICHTIG: Passwort vor Verwendung aendern!
#   openssl rand -base64 32

# === Netzwerk ===
bind 0.0.0.0
port 6379
protected-mode no

# === Authentifizierung (KRITISCH fuer Production!) ===
# Passwort aus separater Secrets-Datei laden — siehe redis-auth.example.conf.
# Niemals Klartext-Passwoerter direkt hier eintragen oder committen.
include /etc/redis/redis-auth.conf

# === Persistenz ===
# Hybrid AOF + RDB: aof-use-rdb-preamble ist seit Redis 7.0 default "yes" —
# bei AOF-Rewrite wird ein RDB-Snapshot als Praeambel geschrieben + nur
# inkrementelle Aenderungen als AOF-Tail. Schnellere Restarts bei grossen
# Datasets (Sekunden statt Minuten).
aof-use-rdb-preamble yes

# RDB Snapshots fuer Backup
save 900 1      # Nach 900 Sek wenn 1 Key geaendert
save 300 10     # Nach 300 Sek wenn 10 Keys geaendert
save 60 10000   # Nach 60 Sek wenn 10000 Keys geaendert

# AOF fuer Durability (empfohlen)
# appendfsync everysec: max 1s Datenverlust bei Crash, gute Performance
# Alternativen: "always" (sicher, langsam) / "no" (OS-gepuffert, riskant)
appendonly yes
appendfsync everysec

# Lazy-Free: grosse Schluessel im Background freigeben, keine Latenz-Spikes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# RDB und AOF Dateipfade
dir /var/lib/redis
dbfilename dump.rdb
appendfilename "appendonly.aof"

# === Speicher ===
# Passen Sie an Ihren verfuegbaren RAM an
# Empfehlung: 25-50% des verfuegbaren RAMs
maxmemory 4gb

# Eviction-Policy: pro Use-Case waehlen
#   Session-Cache:       allkeys-lru   (juengste Sessions bleiben)
#   HTTP-Cache:          allkeys-lfu   (populaere Seiten bleiben, robust gegen One-Hit-Wonders)
#   ElasticCache (TTL):  volatile-lru  (nur TTL-Keys werden evicted)
#   Primary Storage:     noeviction    (OOM-Error statt silent Delete)
#
# Trap: volatile-* verhaelt sich wie noeviction wenn KEIN Key TTL hat.
# Quelle: https://redis.io/docs/latest/develop/reference/eviction/
maxmemory-policy allkeys-lru

# === Replikations-Sicherheit ===
# WICHTIG: min-replicas-to-write erzeugt einen Write-Block, sobald weniger
# als N Replicas verbunden sind. Faustregel: nur dann setzen, wenn N+1
# Replicas verfuegbar sind. Bei diesem 3-Node-Setup (1 Master + 2 Replicas)
# wuerde "1" bedeuten, dass ein Single-Replica-Verlust den Master silent
# in Read-Only-Mode kippt — Bestellungen scheitern ohne Fehler im Log.
# Default fuer dieses Setup: "0" (kein Write-Block).
#
# Erst mit 3 Replicas (Master + 3 Replicas) ist "1" sicher.
min-replicas-to-write 0
min-replicas-max-lag 10

# === Performance ===
tcp-keepalive 300
timeout 0

# === Logging ===
loglevel notice
logfile /var/log/redis/redis-server.log

# === Sicherheit ===
# Gefaehrliche Befehle umbenennen/deaktivieren
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_SECRET_CMD"
