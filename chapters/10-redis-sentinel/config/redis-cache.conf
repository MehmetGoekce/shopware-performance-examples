# Redis-Instanz fuer den Shopware-CACHE (Object- und HTTP-Cache)
#
# Installation (auf allen 3 Nodes):
#   sudo cp redis-cache.conf /etc/redis/redis-cache.conf
#   sudo systemctl start redis-server@cache
#
# Auf Node 2 und 3 zusaetzlich den Replica-Block unten aktivieren.
#
# WICHTIG: Diese Instanz ist NICHT die Session-Instanz. Sessions brauchen eine
# andere Eviction-Policy und Persistenz — siehe redis-session.conf. Die
# maxmemory-policy gilt pro INSTANZ, nicht pro Datenbank; ein gemeinsames Redis
# mit getrennten DB-Nummern kann beides nicht gleichzeitig richtig machen.

# === Netzwerk ===
# Sentinel und die App-Server muessen diese Instanz erreichen, deshalb nicht
# 127.0.0.1. Den Zugang per Firewall auf die Node- und App-IPs begrenzen.
bind 0.0.0.0
port 6379

# protected-mode greift nur, solange kein Passwort gesetzt ist. Wir setzen eins
# (siehe include unten), lassen den Schutz aber als zweite Sperre aktiv.
protected-mode yes

# === Authentifizierung ===
# Passwort aus separater Secrets-Datei laden — siehe redis-auth.example.conf.
# Niemals Klartext-Passwoerter direkt hier eintragen oder committen.
include /etc/redis/redis-auth.conf

# === Speicher ===
# An den verfuegbaren RAM anpassen, Empfehlung 25-50 %.
maxmemory 4gb

# PFLICHT fuer cache.adapter.redis_tag_aware: volatile-lru (oder noeviction).
#
# Symfonys RedisTagAwareAdapter wirft bei jeder anderen Policy eine
# LogicException; Shopware faengt sie ab und macht daraus eine Log-Zeile auf
# Level "warning", die das Production-Logging (fingers_crossed ab "error")
# verschluckt. Ergebnis mit allkeys-lru: Redis bleibt leer, cache:clear meldet
# Erfolg, und im prod-Log steht nichts.
#
# Der haeufige Rat "allkeys-lru fuer Cache-Workloads" gilt hier also NICHT.
# Volllaufen verhindert man stattdessen, indem man die Tag-Index-Keys ohne TTL
# regelmaessig aufraeumt — siehe Kapitel 7.3.
maxmemory-policy volatile-lru

# === Persistenz: bewusst AUS ===
# Der Cache ist wiederherstellbar. Kein AOF, keine RDB-Snapshots — das spart
# I/O und Speicher und macht Restarts schnell. Nach einem Neustart ist der
# Cache leer und fuellt sich neu.
appendonly no
save ""

dir /var/lib/redis-cache

# === Lazy-Free (Memory-Recovery ohne Blocking) ===
# Grosse Schluessel werden im Background freigegeben, nicht in der Main-Loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# === Replikations-Sicherheit ===
# min-replicas-to-write blockiert Writes, sobald weniger als N Replicas
# verbunden sind. Bei 1 Master + 2 Replicas wuerde "1" bedeuten, dass der
# Verlust eines einzelnen Replicas den Master in Read-Only kippt. Default hier
# deshalb "0" — erst ab 3 Replicas ist "1" sinnvoll.
min-replicas-to-write 0
min-replicas-max-lag 10

# === Performance ===
tcp-keepalive 300
timeout 0

# === Logging ===
loglevel notice
logfile /var/log/redis/redis-cache.log

# === Replica-Block (nur auf Node 2 und 3 aktivieren) ===
# replicaof 192.168.1.1 6379
# replica-read-only yes
# replica-serve-stale-data yes
