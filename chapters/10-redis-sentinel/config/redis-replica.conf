# Redis Replica Konfiguration fuer Shopware 6
#
# Installation (Node 2 und 3):
#   sudo cp redis-replica.conf /etc/redis/redis.conf
#   # WICHTIG: replicaof IP anpassen!
#   sudo systemctl restart redis-server
#
# WICHTIG: Passwort muss mit Master uebereinstimmen!

# === Netzwerk ===
bind 0.0.0.0
port 6379
protected-mode no

# === Authentifizierung ===
# Gleiche Secrets-Datei wie auf dem Master (per scp/ssh-agent verteilt):
include /etc/redis/redis-auth.conf

# === Als Replica des Masters registrieren ===
# WICHTIG: Passen Sie die IP an Ihren Master an!
replicaof 192.168.1.1 6379

# Replica beantwortet nur Lese-Anfragen
replica-read-only yes

# Replica liefert auch waehrend Sync Daten (evtl. veraltet)
replica-serve-stale-data yes

# === Persistenz ===
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec

dir /var/lib/redis
dbfilename dump.rdb
appendfilename "appendonly.aof"

# === Speicher ===
maxmemory 4gb
maxmemory-policy allkeys-lru

# === Performance ===
tcp-keepalive 300
timeout 0

# === Logging ===
loglevel notice
logfile /var/log/redis/redis-server.log

# === Sicherheit ===
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_SECRET_CMD"
