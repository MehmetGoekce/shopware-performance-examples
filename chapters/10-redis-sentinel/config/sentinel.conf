# Redis Sentinel Konfiguration
#
# Installation (auf allen 3 Nodes identisch):
#   sudo cp sentinel.conf /etc/redis/sentinel.conf
#   sudo systemctl start redis-sentinel
#   sudo systemctl enable redis-sentinel
#
# WICHTIG: Passwort und Master-IP vor Verwendung anpassen!
#
# Quelle: https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/

# === Grundeinstellungen ===
port 26379
daemonize yes
pidfile /var/run/redis/redis-sentinel.pid
logfile /var/log/redis/sentinel.log

# Sentinel State Directory
dir /var/lib/redis

# === Master-Monitoring ===
# Format: sentinel monitor <name> <ip> <port> <quorum>
#
# name: Beliebiger Name fuer den Master-Service
# ip: IP-Adresse des initialen Masters (aendert sich bei Failover)
# port: Redis-Port des Masters
# quorum: Anzahl Sentinels die Ausfall bestaetigen muessen
#
# Mit 3 Sentinels: Quorum = 2 (Mehrheit)
sentinel monitor shopware-master 192.168.1.1 6379 2

# === Authentifizierung ===
# Aus separater Secrets-Datei laden — siehe sentinel-auth.example.conf.
# Niemals Klartext-Passwoerter direkt hier eintragen oder committen.
include /etc/redis/sentinel-auth.conf

# === Timing-Konfiguration ===

# Nach wie vielen ms gilt Instance als "subjectively down" (SDOWN)?
# Default: 30000 (30 Sek)
# Empfehlung: 5000-10000 fuer schnellere Erkennung
# Trade-off: Zu niedrig = False Positives bei Netzwerk-Jitter
sentinel down-after-milliseconds shopware-master 5000

# Maximale Zeit fuer den gesamten Failover-Prozess
# Beinhaltet: Leader-Election, Replica-Promotion, Rekonfiguration
# Default: 180000 (3 Min)
sentinel failover-timeout shopware-master 60000

# Wie viele Replicas gleichzeitig zum neuen Master synchronisieren?
# 1 = sicherer (immer mindestens ein Replica verfuegbar)
# >1 = schnellerer Sync nach Failover
sentinel parallel-syncs shopware-master 1

# === Benachrichtigungen (optional) ===

# Script bei jeder Sentinel-Notification ausfuehren
# Nuetzlich fuer Slack/Email-Alerts
# sentinel notification-script shopware-master /opt/redis/notify.sh

# Script nach erfolgreichem Failover ausfuehren
# Kann genutzt werden um DNS zu aktualisieren, Load Balancer zu konfigurieren, etc.
# sentinel client-reconfig-script shopware-master /opt/redis/reconfig.sh

# === Sentinel-Announce (fuer NAT/Docker) ===

# Falls Sentinel hinter NAT laeuft, muss er seine externe IP/Port announcen:
# sentinel announce-ip 1.2.3.4
# sentinel announce-port 26379

# === Logging ===

# Ausbuehrlichere Logs fuer Debugging
# loglevel debug

# === Sicherheit ===

# Sentinel Passwort (optional, aber empfohlen)
# requirepass "sentinel_password"
