# Redis Sentinel — ueberwacht BEIDE Shopware-Instanzen
#
# Installation (auf allen 3 Nodes identisch, nur die Master-IPs anpassen):
#   sudo cp sentinel.conf /etc/redis/sentinel.conf
#   sudo systemctl start redis-sentinel
#   sudo systemctl enable redis-sentinel
#
# WICHTIG: Master-IPs vor Verwendung anpassen.
#
# Quelle: https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/

# === Grundeinstellungen ===
port 26379

# daemonize hier NICHT setzen. Die Distributions-Unit startet Sentinel im
# Vordergrund (Type=notify); mit "daemonize yes" haelt systemd den Dienst fuer
# abgestuerzt und startet ihn im Kreis neu.

# RuntimeDirectory der Unit heisst "sentinel", nicht "redis" — /var/run/redis
# ist fuer den Dienst schreibgeschuetzt (ReadOnlyDirectories=/), und die Unit
# erwartet die PID genau hier (PIDFile=/run/sentinel/redis-sentinel.pid).
pidfile /var/run/sentinel/redis-sentinel.pid
logfile /var/log/redis/sentinel.log

# Sentinel SCHREIBT DIESE DATEI um — bei jedem Failover und jedem neu
# entdeckten Replica. Beschreibbar sein muss deshalb das Verzeichnis DIESER
# Datei (/etc/redis), nicht "dir": dort legt Sentinel nichts ab, gemessen
# bleibt /var/lib/redis leer. Die Datei selbst darf kein read-only-Mount sein.
dir /var/lib/redis

# === Master 1: Cache-Instanz (Port 6379) ===
# Format: sentinel monitor <name> <ip> <port> <quorum>
# Der Name ist frei waehlbar, muss aber exakt so in der Shopware-DSN stehen
# (redis_sentinel=shopware-cache).
sentinel monitor shopware-cache 192.168.1.1 6379 2

# === Master 2: Session-Instanz (Port 6380) ===
sentinel monitor shopware-session 192.168.1.1 6380 2

# === Authentifizierung ===
# Muss NACH den monitor-Zeilen stehen: "sentinel auth-pass <name>" setzt
# voraus, dass der Master unter diesem Namen schon bekannt ist.
#
# ACHTUNG: Sentinel schreibt diese Datei bei Zustandsaenderungen neu. Ob die
# include-Zeile den Rewrite ueberlebt, gehoert zu den Dingen, die man einmal
# selbst pruefen sollte — siehe README, Abschnitt "Secrets und Rewrite".
include /etc/redis/sentinel-auth.conf

# === Timing (gilt pro Master) ===

# Nach wie vielen ms gilt eine Instanz als "subjectively down" (SDOWN)?
# Default: 30000. Mit 5000 erkennt Sentinel den Ausfall nach ~5 s.
# Trade-off: zu niedrig = False Positives bei Netzwerk-Jitter.
sentinel down-after-milliseconds shopware-cache 5000
sentinel down-after-milliseconds shopware-session 5000

# Maximale Zeit fuer einen Failover-Durchlauf. Default: 180000.
#
# Dieser Wert ist auch eine SPERRFRIST: ein Sentinel, der fuer einen Failover
# gestimmt hat, startet fuer denselben Master 2 * failover-timeout lang keinen
# AUTOMATISCHEN neuen. Wer einen manuellen Failover testet und direkt danach den
# Stecker zieht, sieht deshalb einen scheinbar haengenden zweiten Failover.
# Mit 60000 dauert diese Sperre zwei Minuten.
#
# Ein weiteres MANUELLES "SENTINEL failover" geht dagegen sofort durch: der
# Befehl ruft sentinelStartFailover() direkt auf und umgeht die Pruefung in
# sentinelStartFailoverIfNeeded(). Der manuelle Test taugt also nicht, um die
# Sperre zu beobachten — nur der echte Ausfall.
sentinel failover-timeout shopware-cache 60000
sentinel failover-timeout shopware-session 60000

# Wie viele Replicas gleichzeitig zum neuen Master synchronisieren?
# 1 = sicherer (es bleibt immer ein Replica ansprechbar).
sentinel parallel-syncs shopware-cache 1
sentinel parallel-syncs shopware-session 1

# === Umbenannte Befehle ===
# Sentinel braucht CONFIG und SLAVEOF auf den ueberwachten Instanzen. Werden
# sie per "rename-command" umbenannt, muss Sentinel das wissen:
#
#   sentinel rename-command shopware-cache CONFIG <neuer-name>
#
# So heisst die Direktive in DIESER Datei. Zur Laufzeit lautet der Befehl
# anders — ein blankes "SENTINEL rename-command" gibt es nicht:
#
#   SENTINEL SET shopware-cache rename-command CONFIG <neuer-name>
#
# Die mitgelieferten redis-cache.conf / redis-session.conf benennen nichts um
# (rename-command ist upstream deprecated, ACLs sind der Ersatz) — deshalb ist
# hier nichts zu setzen. Wer es doch tut, muss beide Seiten pflegen.

# === Benachrichtigungen (optional) ===
# sentinel notification-script shopware-cache /opt/redis/notify.sh
# sentinel client-reconfig-script shopware-cache /opt/redis/reconfig.sh

# === Sentinel-Announce (fuer NAT/Docker) ===
# sentinel announce-ip 1.2.3.4
# sentinel announce-port 26379
