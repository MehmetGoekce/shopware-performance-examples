# /etc/redis/redis-tls.conf  (chmod 640, root:redis)
#
# Skeleton fuer Redis-TLS-Konfiguration. Wird per
# `include /etc/redis/redis-tls.conf` aus der Haupt-redis.conf eingebunden.
#
# Voraussetzung: redis-server muss mit TLS-Support gebaut sein (BUILD_TLS=yes).
# Ubuntu 24.04 und Debian 12 liefern dies als Default seit Redis 7.0.
# Verifikation:  redis-server --tls-help | head -5
#
# Diese .example-Datei ist NICHT lauffaehig — Pfade sind Platzhalter,
# Zertifikate muessen mit scripts/generate-tls-certs.example.sh (Test) oder
# einer richtigen PKI (Production) erzeugt werden.
#
# Quelle: https://redis.io/docs/latest/operate/oss_and_stack/management/security/encryption/

# TLS-Port aktivieren, Plain-TCP deaktivieren:
tls-port 6379
port 0

# Server-Zertifikat + Private Key:
tls-cert-file /etc/redis/tls/server.crt
tls-key-file  /etc/redis/tls/server.key

# CA fuer Client-Zertifikat-Validierung:
tls-ca-cert-file /etc/redis/tls/ca.crt

# Mutual TLS: Clients MUESSEN gueltiges Cert vorzeigen.
# "no" nur wenn vorgelagertes API-Gateway die Auth macht.
tls-auth-clients yes

# TLS auch fuer Master-Replica-Replikation:
tls-replication yes

# Cluster-Bus ebenfalls TLS (falls Cluster statt Sentinel):
# tls-cluster yes

# TLS-Protokoll-Versionen (TLS 1.0/1.1 sind unsicher):
tls-protocols "TLSv1.2 TLSv1.3"

# Optional: Cipher-Suite restriktiv setzen (Default ist OpenSSL-Default)
# tls-ciphers DEFAULT:!MEDIUM
# tls-ciphersuites TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384

# Optional: DH-Parameter (>= 2048 Bit) fuer Forward Secrecy
# tls-dh-params-file /etc/redis/tls/redis.dh

# Optional: Session Caching (Performance bei vielen Re-Connects)
# tls-session-caching no
