# Redis-Instanz fuer SHOPWARE-SESSIONS
#
# Installation (auf allen 3 Nodes):
#   sudo cp redis-session.conf /etc/redis/redis-session.conf
#   sudo systemctl start redis-server@session
#
# Auf Node 2 und 3 zusaetzlich den Replica-Block unten aktivieren.
#
# Warum eine eigene Instanz und nicht eine zweite Datenbank der Cache-Instanz:
# maxmemory-policy und Persistenz gelten pro INSTANZ. Sessions brauchen
# allkeys-lru und Persistenz, der Cache braucht volatile-lru und keine
# Persistenz. In einer gemeinsamen Instanz laesst sich das nicht trennen — und
# ein FLUSHDB auf der Cache-Datenbank wuerde die Sessions mitnehmen.

# === Netzwerk ===
bind 0.0.0.0
port 6380
protected-mode yes

# === Authentifizierung ===
include /etc/redis/redis-auth.conf

# Wer den default-User per ACL abschaltet, braucht hier zusaetzlich einen
# Replikations-User — masterauth allein meldet sich als default an und
# scheitert dann mit WRONGPASS. Siehe users.acl.example.
# masteruser replicator

# === Speicher ===
maxmemory 1gb

# Sessions tragen alle eine TTL, aber sie sind KEIN Wegwerf-Cache: eine
# verdraengte Session loggt einen Kunden aus und leert seinen Warenkorb.
# allkeys-lru verdraengt im Zweifel die aeltesten Sessions statt mit einem
# OOM-Fehler zu antworten. Wer lieber hart scheitert als Kunden auszuloggen,
# nimmt noeviction und ueberwacht used_memory.
#
# Diese Instanz benutzt NICHT den RedisTagAwareAdapter — die volatile-lru-
# Pflicht der Cache-Instanz gilt hier also nicht.
maxmemory-policy allkeys-lru

# === Persistenz: eingeschaltet ===
# Ein Neustart ohne Persistenz loggt alle angemeldeten Kunden aus.
appendonly yes
appendfsync everysec

# aof-use-rdb-preamble steht seit Redis 5.0 auf "yes": beim AOF-Rewrite wird
# ein RDB-Snapshot als Praeambel geschrieben, danach nur noch die Aenderungen
# als AOF-Tail. Das macht Restarts bei grossen Datasets deutlich schneller.
# Hier nur der Vollstaendigkeit halber explizit gesetzt.
aof-use-rdb-preamble yes

save 900 1
save 300 10

# === Datenverzeichnis ===
# MUSS unterhalb von /var/lib/redis liegen — siehe redis-cache.conf. Bei dieser
# Instanz ist die Folge noch haerter: mit appendonly yes startet Redis auf einem
# schreibgeschuetzten Verzeichnis gar nicht erst und bricht ab mit
# "Can't open or create append-only dir appendonlydir: Read-only file system".
#
#   sudo mkdir -p /var/lib/redis/session && sudo chown redis:redis /var/lib/redis/session
dir /var/lib/redis/session

# Passend zu RuntimeDirectory=redis-%i und PIDFile= der Unit.
pidfile /var/run/redis-session/redis-server.pid
dbfilename dump-session.rdb
appendfilename "appendonly-session.aof"

# === Lazy-Free ===
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# === Replikations-Sicherheit ===
min-replicas-to-write 0
min-replicas-max-lag 10

# === Performance ===
tcp-keepalive 300
timeout 0

# === Logging ===
loglevel notice
logfile /var/log/redis/redis-session.log

# === Replica-Block (nur auf Node 2 und 3 aktivieren) ===
# replicaof 192.168.1.1 6380
# replica-read-only yes
# replica-serve-stale-data yes
