# Nginx Gzip-Kompression für Shopware 6
# Kapitel 22, Problem 14: Fehlende Gzip-Kompression
#
# Datei: /etc/nginx/conf.d/gzip.conf
# Oder in server-Block einbinden

# ============================================
# Gzip-Kompression
# ============================================

# Gzip aktivieren
gzip on;

# Vary: Accept-Encoding Header
gzip_vary on;

# Kompression auch für Proxies
gzip_proxied any;

# Kompression-Level (1-9, 6 ist guter Kompromiss)
gzip_comp_level 6;

# Minimum-Größe für Kompression (1KB)
gzip_min_length 1024;

# Buffer-Einstellungen
gzip_buffers 16 8k;

# HTTP-Version (1.0 für ältere Proxies)
gzip_http_version 1.1;

# MIME-Types für Kompression
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/opentype
    font/ttf
    font/woff
    font/woff2;

# Bereits komprimierte Dateien nicht erneut komprimieren
gzip_disable "MSIE [1-6]\.";

# ============================================
# Brotli-Kompression (wenn Modul installiert)
# ============================================

# brotli on;
# brotli_comp_level 6;
# brotli_types
#     text/plain
#     text/css
#     text/xml
#     text/javascript
#     application/javascript
#     application/json
#     application/xml
#     image/svg+xml;

# ============================================
# Pre-compressed Files (.gz, .br)
# ============================================

# Wenn statische Dateien vorher komprimiert wurden
# gzip_static on;
# brotli_static on;

# ============================================
# Anwendung
# ============================================
#
# 1. Konfiguration einbinden:
#    include /etc/nginx/conf.d/gzip.conf;
#
# 2. Nginx testen:
#    nginx -t
#
# 3. Nginx neu laden:
#    systemctl reload nginx
#
# 4. Testen:
#    curl -H "Accept-Encoding: gzip" -I https://shop.example.com
#    # Erwartete Antwort: Content-Encoding: gzip
