# WebP-Auslieferung unter Nginx für Shopware 6
# Kapitel 22, Problem 4: Unoptimierte Bilder
#
# Die map-Direktive gehört in den http-Kontext (z. B.
# /etc/nginx/conf.d/webp.conf), der location-Block in den server-Block
# des Shops.
#
# ============================================================
# Die Falle steckt in $uri
# ============================================================
#
# Naheliegend, aber falsch:
#
#     location ~* \.(jpe?g|png)$ {
#         try_files $uri$webp_suffix $uri =404;
#     }
#
# $uri enthält die Endung bereits. Geprüft würde also "bild.jpg.webp" —
# eine Datei, die es nicht gibt. Nachgestellt auf Nginx 1.24: der Block
# lieferte in allen Fällen das Original, die WebP-Datei wurde nie benutzt.
#
# Deshalb eine benannte Gruppe (?<base>...) im location-Muster: sie hält
# den Namen ohne Endung fest.

map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}

# --- im server-Block des Shops ---
#
# location ~* ^(?<base>.+)\.(jpe?g|png)$ {
#     # Nginx setzt Vary unbedingt, nicht nur im Umschreibfall. Das ist
#     # korrekt und für Proxys sogar die sicherere Variante.
#     add_header Vary Accept;
#     try_files $base$webp_suffix $uri =404;
# }

# ============================================
# Gegenprobe
# ============================================
#
# Getestet auf nginx:1.24-alpine, drei Fälle:
#
#   Accept: image/webp + vorhandene .webp  -> Content-Type: image/webp
#   Accept: image/webp + keine .webp       -> Content-Type: image/jpeg, HTTP 200
#   ohne Accept-Header                     -> Content-Type: image/jpeg
#
# In allen drei Fällen: Vary: Accept.
#
# Nginx kennt image/webp in seiner eigenen mime.types; ein AddType wie unter
# Apache ist hier nicht nötig.
