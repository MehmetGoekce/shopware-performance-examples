# Logrotate Konfiguration für Shopware 6
# Kapitel 22, Problem 17: Große Log-Dateien
#
# Datei: /etc/logrotate.d/shopware

# ============================================
# Shopware Logs
# ============================================

/var/www/shopware/var/log/*.log {
    # Täglich rotieren
    daily

    # 7 Tage aufbewahren
    rotate 7

    # Komprimieren (außer aktuellstes)
    compress
    delaycompress

    # Fehlende Dateien ignorieren
    missingok

    # Leere Dateien nicht rotieren
    notifempty

    # Berechtigungen beibehalten
    create 0640 www-data www-data

    # Alle Logs in einem Durchgang
    sharedscripts

    # Nach Rotation
    postrotate
        # PHP-FPM Signal zum Neuöffnen der Logs
        /usr/bin/systemctl reload php8.2-fpm > /dev/null 2>&1 || true
    endscript
}

# ============================================
# Symfony Profiler Logs (dev)
# ============================================

/var/www/shopware/var/log/dev*.log {
    daily
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data www-data
}

# ============================================
# Shopware Task Scheduler Logs
# ============================================

/var/www/shopware/var/log/scheduler*.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    create 0640 www-data www-data
}

# ============================================
# Installation
# ============================================
#
# 1. Datei erstellen:
#    sudo nano /etc/logrotate.d/shopware
#
# 2. Konfiguration testen:
#    sudo logrotate -d /etc/logrotate.d/shopware
#
# 3. Manuell ausführen:
#    sudo logrotate -f /etc/logrotate.d/shopware
#
# 4. Cron prüfen:
#    cat /etc/cron.daily/logrotate

