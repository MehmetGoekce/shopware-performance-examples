# Logrotate-Konfiguration für Shopware 6
# Kapitel 22, Problem 17: Große Log-Dateien
#
# Datei: /etc/logrotate.d/shopware
#
# ============================================================
# ZUERST LESEN — diese Datei ist in den meisten Fällen NICHT nötig
# ============================================================
#
# Shopware rotiert seine Logs bereits selbst. Der prod-Handler "nested" ist
# vom Typ rotating_file; deshalb heissen die Dateien prod-JJJJ-MM-TT.log.
# Was fehlt, ist nicht die Rotation, sondern das Aufräumen: MonologBundles
# max_files hat den Default 0, also unbegrenzte Aufbewahrung.
#
# Der richtige Hebel ist deshalb eine Zeile in
# config/packages/prod/monolog.yaml:
#
#     monolog:
#         handlers:
#             nested:
#                 max_files: 14
#
# Damit räumt Shopware selbst auf, und diese Datei erübrigt sich.
#
# NICHT dagegen hilft "monolog.handlers.main.level: error": main ist ein
# fingers_crossed-Handler, dort wertet MonologBundle action_level aus, nicht
# level. Und Shopware loggt in prod ohnehin schon nur ab error.
#
# ============================================================
# Wann logrotate trotzdem sinnvoll ist
# ============================================================
#
# Wenn im selben Verzeichnis Dateien liegen, die Monolog nicht verwaltet:
# eigene Logs, Worker-Ausgaben, Ausgaben von Cronjobs. Dann aber mit zwei
# Vorsichtsmassnahmen:
#
#   1. copytruncate statt Umbenennen.
#      Ohne copytruncate benennt logrotate eine Datei um, die PHP-FPM noch
#      geöffnet hält. Der Prozess schreibt danach in eine Datei, die unter
#      keinem Namen mehr auftaucht — die Einträge sind weg, bis PHP-FPM neu
#      startet. Mit copytruncate wird die Datei kopiert und geleert, der
#      offene Dateizeiger bleibt gültig.
#      Preis: ein sehr kurzes Fenster zwischen Kopie und Leeren, in dem
#      Einträge verloren gehen können. Für Logs ist das vertretbar.
#
#   2. Keine überlappenden Muster.
#      logrotate bricht mit "duplicate log entry" ab, wenn zwei Blöcke
#      dieselbe Datei treffen — und rotiert dann gar nichts. Ein Block mit
#      *.log und ein zweiter mit dev*.log kollidieren also.
#      Gegenprobe vor dem Scharfschalten:
#
#        sudo logrotate -d /etc/logrotate.d/shopware
#
#      Das ändert nichts, meldet aber jede Kollision.
#
# Pfad unten an die eigene Installation anpassen.

# ============================================
# Von Monolog NICHT verwaltete Logs
# ============================================
#
# Bewusst kein *.log: die tagesdatierten prod-JJJJ-MM-TT.log gehören Monolog.
# Hier stehen nur Muster für eigene Dateien.

/var/www/shopware/var/log/worker-*.log
/var/www/shopware/var/log/cron-*.log
{
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty

    # Siehe oben: das ist der Kern dieser Konfiguration.
    copytruncate

    # Kein "create": mit copytruncate wird die Originaldatei nie ersetzt,
    # die Direktive hätte hier keine Wirkung.

    sharedscripts
}

# ============================================
# Falls Monolog NICHT umgestellt werden kann
# ============================================
#
# Nur verwenden, wenn max_files aus irgendeinem Grund nicht gesetzt werden
# kann — und dann den Block oben auskommentieren, damit sich die Muster nicht
# überschneiden.
#
# /var/www/shopware/var/log/prod-*.log {
#     daily
#     rotate 14
#     compress
#     delaycompress
#     missingok
#     notifempty
#     copytruncate
# }

# ============================================
# Installation
# ============================================
#
# 1. Datei kopieren und Pfade anpassen:
#      sudo cp config/logrotate.conf /etc/logrotate.d/shopware
#      sudo nano /etc/logrotate.d/shopware
#
# 2. Eigentümer prüfen — logrotate ignoriert Dateien, die nicht root gehören:
#      sudo chown root:root /etc/logrotate.d/shopware
#      sudo chmod 644 /etc/logrotate.d/shopware
#
# 3. Trockenlauf, der nichts verändert:
#      sudo logrotate -d /etc/logrotate.d/shopware
#
# 4. Einmalig erzwingen, um das Ergebnis zu sehen:
#      sudo logrotate -f /etc/logrotate.d/shopware
