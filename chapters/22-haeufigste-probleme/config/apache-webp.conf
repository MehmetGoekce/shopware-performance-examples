# WebP-Auslieferung unter Apache für Shopware 6
# Kapitel 22, Problem 4: Unoptimierte Bilder
#
# Datei: public/.htaccess — und zwar VOR der Zeile "# BEGIN Shopware".
#
# ============================================================
# Warum die Position zählt
# ============================================================
#
# Shopwares Block enthält diese beiden Zeilen:
#
#     RewriteCond %{REQUEST_FILENAME} -f
#     RewriteRule ^ - [L]
#
# Existiert die angefragte Datei, liefert Apache sie aus und beendet die
# Auswertung. Eine Rewrite-Regel HINTER dem Block läuft deshalb nie — bei
# einer vorhandenen .jpg ist vorher Schluss. Nachgestellt im Test: dieselbe
# Regel lieferte hinter dem Block das JPEG (21914 Byte), davor die WebP-Datei.
#
# Zwischen die Marker gehört sie ebenfalls nicht: "The directives between
# these markers are dynamically generated. Any changes ... will be
# overwritten." steht im Dateikopf.
#
# ============================================================
# Warum drei Bedingungen und nicht zwei
# ============================================================
#
# Die verbreitete Kurzfassung prüft gar nicht, ob es die WebP-Datei gibt:
#
#     RewriteCond %{HTTP_ACCEPT} image/webp
#     RewriteRule (.+)\.(jpe?g|png)$ $1.webp [T=image/webp]
#
# Damit wird JEDE .jpg-Anfrage umgeschrieben. Fehlt die .webp, greift
# Shopwares Front-Controller und der Besucher bekommt eine 404-Seite statt
# eines Bildes.
#
# Auch falsch ist die ebenso verbreitete Reparatur
# "RewriteCond %{REQUEST_FILENAME}.webp -f": REQUEST_FILENAME enthält die
# Endung bereits, geprüft würde also "bild.jpg.webp". Richtig ist die
# Rückwärtsreferenz %1 auf die vorangehende Bedingung.

<IfModule mod_mime.c>
    # Ubuntu 22.04 hat keinen image/webp-Eintrag in /etc/mime.types. Ohne
    # diese Zeile liefert Apache die Datei ganz ohne Content-Type aus —
    # gemessen im Test, sowohl direkt als auch nach dem Umschreiben.
    AddType image/webp .webp
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # 1. Der Client kann WebP.
    RewriteCond %{HTTP_ACCEPT} image/webp
    # 2. Basisnamen der angefragten Datei in %1 festhalten.
    RewriteCond %{REQUEST_FILENAME} (.+)\.(jpe?g|png)$
    # 3. Nur umschreiben, wenn die WebP-Datei wirklich daneben liegt.
    RewriteCond %1.webp -f
    RewriteRule (.+)\.(jpe?g|png)$ $1.webp [T=image/webp,E=webp:1,L]
</IfModule>

<IfModule mod_headers.c>
    # Nur im Umschreibfall, gesteuert über die Umgebungsvariable aus [E=webp:1].
    # Ohne Vary könnte ein Proxy die WebP-Antwort an einen Client ausliefern,
    # der WebP nicht versteht.
    Header append Vary Accept env=webp
</IfModule>

# ============================================
# Gegenprobe
# ============================================
#
# Mit vorhandener WebP-Datei:
#   curl -s -o /dev/null -D - -H 'Accept: image/webp,image/*' \
#        https://shop.example.com/media/<pfad>/bild.jpg
#   Erwartet: Content-Type: image/webp, Vary: Accept
#
# Ohne WebP-Datei (derselbe Aufruf auf ein Bild ohne .webp-Pendant):
#   Erwartet: Content-Type: image/jpeg, HTTP 200 — keine 404.
#
# Ohne Accept-Header:
#   curl -s -o /dev/null -D - -H 'Accept: image/*' ...
#   Erwartet: das Original.
#
# ============================================
# Was diese Datei NICHT tut
# ============================================
#
# Sie erzeugt keine WebP-Dateien. Shopware legt sie nicht von selbst an.
# Die Umwandlung übernimmt der Storage-Adapter bzw. ein CDN-Bildservice;
# FroshPlatformThumbnailProcessor schreibt nur die Thumbnail-URLs um.
