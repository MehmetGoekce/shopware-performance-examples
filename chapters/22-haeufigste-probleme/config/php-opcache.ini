; OPcache Konfiguration für Shopware 6 in Produktion
; Kapitel 22, Problem 12: OPcache nicht aktiviert
;
; Datei: /etc/php/<version>/fpm/conf.d/10-opcache.ini
;         (Shopware 6.6 laeuft auf PHP 8.2 oder 8.3 — den Pfad an die
;          installierte Version anpassen, "php -v" zeigt sie an.)
;
; ACHTUNG: Das ist die FPM-Konfiguration. Die CLI hat unter Debian/Ubuntu
; eine eigene php.ini (/etc/php/<version>/cli/php.ini). Wer mit
; "php -i | grep opcache" prueft, sieht die CLI-Werte — nicht die, mit
; denen der Shop laeuft. Richtig ist "php-fpm<version> -i".
;
; UND: die Datei muss fuer den PHP-Benutzer LESBAR sein. Eine Datei in
; conf.d mit 0600 und root als Eigentuemer wird von einem als www-data
; laufenden PHP-FPM stillschweigend uebergangen — kein Fehler, keine
; Warnung, die Werte gelten einfach nicht. Nach dem Kopieren deshalb:
;   sudo chmod 644 /etc/php/<version>/fpm/conf.d/10-opcache.ini

; ============================================
; Basis-Einstellungen
; ============================================

; OPcache aktivieren
opcache.enable=1

; OPcache für die CLI bleibt aus.
; Jeder CLI-Aufruf startet einen eigenen Prozess; dessen OPcache ist beim
; Beenden wieder weg. Für einmalige Konsolenbefehle bringt das nichts und
; kostet nur Speicher. Für dauerhaft laufende Worker (messenger:consume mit
; --time-limit) kann es sich lohnen — dann aber bewusst und getrennt setzen.
opcache.enable_cli=0

; ============================================
; Memory-Einstellungen
; ============================================

; Speicher für kompilierte Scripts (MB)
; Shopware 6 benötigt mindestens 256MB
opcache.memory_consumption=256

; Speicher für interned strings (MB)
opcache.interned_strings_buffer=16

; Maximale Anzahl gecachter Dateien.
; Eine nackte Shopware-6.6.10.6-Installation mit zwei Plugins enthaelt bereits
; rund 14.200 PHP-Dateien (gemessen: find vendor src custom -name '*.php' | wc -l);
; mit weiteren Plugins wird es schnell mehr.
;
; PHP rundet diesen Wert auf die naechstgroessere Zahl einer festen Reihe auf:
; 223, 463, 983, 1979, 3907, 7963, 16229, 32531, 65407, 130987, ...
; Aus 20000 wird also ohnehin 32531. Deshalb gleich den wirksamen Wert
; hinschreiben — sonst steht in der Konfiguration eine Zahl, die es nicht gibt.
opcache.max_accelerated_files=32531

; ============================================
; Produktion: Keine Dateisystem-Checks
; ============================================

; WICHTIG: In Produktion auf 0 setzen — ABER nur zusammen mit einem Reset
; im Deployment. Mit 0 prueft PHP nie wieder, ob sich eine Datei geaendert
; hat. Ohne Reset laeuft nach einem Deploy weiter der ALTE Code, obwohl die
; neuen Dateien auf der Platte liegen. Das ist kein Randfall, sondern der
; haeufigste Grund fuer "das Update ist nicht angekommen".
;
; Ins Deployment-Skript gehoert deshalb einer dieser Schritte:
;   systemctl reload php8.3-fpm
;   cachetool opcache:reset --fcgi=/run/php/php8.3-fpm.sock
opcache.validate_timestamps=0

; Nur relevant wenn validate_timestamps=1
opcache.revalidate_freq=0

; ============================================
; JIT (PHP 8.0+)
; ============================================
;
; JIT hilft bei rechenlastigem PHP-Code. Shopware-Requests haengen
; ueberwiegend an Datenbank, Cache und I/O, nicht an der CPU — ob JIT dort
; etwas bringt, ist eine Messfrage und keine Voreinstellung. Der Buffer geht
; ausserdem zusaetzlich zu memory_consumption vom Speicher ab.
;
; Wer es messen will: erst ohne, dann mit, jeweils mehrere Laeufe.
; 1255 = Tracing JIT.
;
; opcache.jit=1255
; opcache.jit_buffer_size=100M

; ============================================
; Zusätzliche Optimierungen
; ============================================

; Huge Pages nutzen (wenn verfügbar)
; opcache.huge_code_pages=1
;
; opcache.fast_shutdown gibt es seit PHP 7.2 nicht mehr — die Direktive
; wuerde in 8.x nur unbekannt in der ini stehen.

; ============================================
; Debugging (nur bei Problemen aktivieren)
; ============================================

; opcache.error_log=/var/log/php/opcache.log
; opcache.log_verbosity_level=2

; ============================================
; Nach Deployment
; ============================================
;
; Mit validate_timestamps=0 (siehe oben) laeuft nach dem Deploy sonst
; weiter der alte Code. Zurueckgesetzt werden muss der OPcache der
; FPM-SAPI — die CLI hat einen eigenen, und der ist hier ohnehin aus
; (enable_cli=0). "php -r opcache_reset();" und "bin/console cache:clear"
; erreichen den FPM-Cache deshalb nicht.
;
; Richtig ist eines von beiden:
;   sudo systemctl reload php8.3-fpm
;   cachetool opcache:reset --fcgi=/run/php/php8.3-fpm.sock
