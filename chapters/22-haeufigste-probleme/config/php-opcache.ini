; OPcache Konfiguration für Shopware 6 in Produktion
; Kapitel 22, Problem 12: OPcache nicht aktiviert
;
; Datei: /etc/php/8.2/fpm/conf.d/10-opcache.ini

; ============================================
; Basis-Einstellungen
; ============================================

; OPcache aktivieren
opcache.enable=1

; OPcache auch für CLI aktivieren (für Cronjobs)
opcache.enable_cli=1

; ============================================
; Memory-Einstellungen
; ============================================

; Speicher für kompilierte Scripts (MB)
; Shopware 6 benötigt mindestens 256MB
opcache.memory_consumption=256

; Speicher für interned strings (MB)
opcache.interned_strings_buffer=16

; Maximale Anzahl gecachter Files
; Shopware 6 hat ca. 15.000 PHP-Dateien
opcache.max_accelerated_files=20000

; ============================================
; Produktion: Keine Dateisystem-Checks
; ============================================

; WICHTIG: In Produktion auf 0 setzen!
; 0 = PHP prüft nicht, ob Dateien geändert wurden
; Nach Deployment: opcache_reset() oder php-fpm reload
opcache.validate_timestamps=0

; Nur relevant wenn validate_timestamps=1
opcache.revalidate_freq=0

; ============================================
; JIT (PHP 8.0+)
; ============================================

; JIT aktivieren
; 1255 = Tracing JIT (beste Performance für Shopware)
opcache.jit=1255

; JIT Buffer Size
opcache.jit_buffer_size=100M

; ============================================
; Zusätzliche Optimierungen
; ============================================

; Schnellere Shutdown-Sequenz
opcache.fast_shutdown=1

; Huge Pages nutzen (wenn verfügbar)
; opcache.huge_code_pages=1

; ============================================
; Debugging (nur bei Problemen aktivieren)
; ============================================

; opcache.error_log=/var/log/php/opcache.log
; opcache.log_verbosity_level=2

; ============================================
; Nach Deployment
; ============================================
;
; Option 1: PHP-FPM neustarten
; sudo systemctl reload php8.2-fpm
;
; Option 2: OPcache reset via Script
; php -r "opcache_reset();"
;
; Option 3: Über Shopware Console (wenn eingerichtet)
; bin/console cache:clear
