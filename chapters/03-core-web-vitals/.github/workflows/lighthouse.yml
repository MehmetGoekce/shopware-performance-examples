# Lighthouse CI fuer den eigenen Shop
# Kapitel 3: Core Web Vitals messen und optimieren
#
# Ablage im Shop-Repository: .github/workflows/lighthouse.yml,
# lighthouserc.json ins Wurzelverzeichnis.
#
# Die Action bringt @lhci/cli 0.15.1 und damit Lighthouse 12.6.1 mit –
# nicht die Lighthouse-Version der aktuellen Chrome DevTools.
# Gemessen wird vom GitHub-Runner aus: Labordaten, keine Felddaten.
#
# @see https://github.com/MehmetGoekce/shopware-performance-examples
name: Lighthouse CI

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # taeglich 04:00 UTC (Cron auf GitHub laeuft in UTC)

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ihr-shop.ch/
            https://ihr-shop.ch/kategorie/
            https://ihr-shop.ch/produkt/beispiel/
          configPath: ./lighthouserc.json
          uploadArtifacts: true  # Bericht als Actions-Artefakt, sonst weg mit dem Runner
