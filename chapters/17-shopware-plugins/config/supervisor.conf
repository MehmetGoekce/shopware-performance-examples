; Supervisor Configuration for Shopware 6 Message Queue
;
; Installation:
;   sudo apt install supervisor
;   sudo cp supervisor.conf /etc/supervisor/conf.d/shopware-messenger.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; Commands:
;   supervisorctl status                    - Show all processes
;   supervisorctl start shopware-messenger:*  - Start all workers
;   supervisorctl stop shopware-messenger:*   - Stop all workers
;   supervisorctl restart shopware-messenger:* - Restart all workers
;
; Logs:
;   /var/log/shopware/messenger*.log

; ============================================
; Main Async Queue Workers
; ============================================
; Handles normal priority messages
; - Cart updates
; - Cache invalidations
; - Email sending

[program:shopware-messenger]
command=/usr/bin/php /var/www/html/bin/console messenger:consume async --time-limit=60 --memory-limit=256M --sleep=1
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/var/log/shopware/messenger.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/shopware/messenger-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=APP_ENV="prod",APP_DEBUG="0"

; ============================================
; Low Priority Queue Workers
; ============================================
; Handles heavy background tasks
; - Product indexing
; - Sitemap generation
; - Export tasks
; - Import processing

[program:shopware-messenger-low]
command=/usr/bin/php /var/www/html/bin/console messenger:consume low_priority --time-limit=120 --memory-limit=512M --sleep=5
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=60
stdout_logfile=/var/log/shopware/messenger-low.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/shopware/messenger-low-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=APP_ENV="prod",APP_DEBUG="0"

; ============================================
; Scheduled Tasks Runner
; ============================================
; Runs scheduled tasks (cron replacement)
; - Sitemap generation
; - Product export
; - Cleanup tasks

[program:shopware-scheduler]
command=/usr/bin/php /var/www/html/bin/console scheduled-task:run --time-limit=60
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stdout_logfile=/var/log/shopware/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/shopware/scheduler-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=APP_ENV="prod",APP_DEBUG="0"

; ============================================
; Group Configuration
; ============================================
; Allows managing all Shopware workers together

[group:shopware]
programs=shopware-messenger,shopware-messenger-low,shopware-scheduler
priority=999

; ============================================
; Alternative: Systemd Configuration
; ============================================
; For systemd-based servers, create:
; /etc/systemd/system/shopware-messenger@.service
;
; [Unit]
; Description=Shopware Messenger Worker %i
; After=network.target
;
; [Service]
; User=www-data
; Group=www-data
; ExecStart=/usr/bin/php /var/www/html/bin/console messenger:consume async --time-limit=60 --memory-limit=256M
; Restart=always
; RestartSec=5
; Environment=APP_ENV=prod
;
; [Install]
; WantedBy=multi-user.target
;
; Then enable with:
; systemctl enable shopware-messenger@{1..2}
; systemctl start shopware-messenger@{1..2}
