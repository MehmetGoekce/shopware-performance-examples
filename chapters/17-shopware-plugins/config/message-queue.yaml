# Message Queue für Produktion - Kapitel 17
#
# Nach config/packages/shopware.yaml übernehmen (oder als eigene
# Datei config/packages/zz-message-queue.yaml ablegen).
#
# Getestet mit Shopware 6.6.10.6 (Dockware).
#
# Die Worker selbst (messenger:consume async low_priority und
# scheduled-task:run) stehen in Anhang C:
#   chapters/anhang-c-konfigurationen/config/supervisor-shopware.conf
# Ohne scheduled-task:run laufen nach dem Abschalten des
# Admin-Workers keine Scheduled Tasks mehr - auch nicht die
# verzögerte Cache-Invalidierung.

shopware:
    admin_worker:
        # WICHTIG: In Production deaktivieren! Ab Werk true.
        enable_admin_worker: false

    # Transporte async, low_priority und failed liefert Shopware
    # bereits aus. Eigene Nachrichten nach low_priority: am
    # einfachsten per LowPriorityMessageInterface (ab 6.5.7.0).
    #
    # Fremde Nachrichten umleiten: routing_overwrite (ab 6.6.4.0).
    # NICHT framework.messenger.routing - dort landet eine Klasse
    # mit AsyncMessageInterface ab 6.6.10.0 zusätzlich in async und
    # wird zweimal verarbeitet.
    #
    # Beispiel, bewusst auskommentiert: Produkt-Indexing hinter async
    # einreihen. Das trifft jeden Produkt-Write - Shopware schickt die
    # Nachindizierung von Haupt- und Variantenprodukten und jeden
    # Block ab 50 IDs über die Queue. Solange async voll ist, kommen
    # berechnete Listing-Daten wie der günstigste Preis später an.
    # Nur für Import-Phasen einschalten.
    #
    # messenger:
    #     routing_overwrite:
    #         'Shopware\Core\Content\Product\DataAbstractionLayer\ProductIndexingMessage': low_priority
