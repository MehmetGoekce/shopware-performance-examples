# Shopware Cache-Invalidierung Konfiguration
# Kopieren nach: config/packages/shopware.yaml

# Hinweis: default_ttl wird über Umgebungsvariable gesetzt:
#   SHOPWARE_HTTP_DEFAULT_TTL=1800

shopware:
    cache:
        # Granulare Invalidierung (empfohlen)
        # Werte sind Arrays von Listener-Klassen (nicht boolean)
        # Leeres Array [] = Route wird nicht invalidiert
        invalidation:
            # Nur spezifische Produkte invalidieren
            product_detail_route:
                - '\Shopware\Core\Content\Product\SalesChannel\Detail\CachedProductDetailRoute'

            # Listings NICHT bei jeder Produktaenderung invalidieren
            # (Kuerzere TTLs stattdessen verwenden)
            product_listing_route: []

            # Weitere Routen
            product_review_route:
                - '\Shopware\Core\Content\Product\SalesChannel\Review\CachedProductReviewRoute'
            product_search_route: []  # Kuerzere TTL verwenden

    http_cache:
        # Stale-While-Revalidate: Alte Version zeigen waehrend neu geladen wird
        stale_while_revalidate: 3600  # 1 Stunde

        # Stale-If-Error: Bei Fehlern alte Version zeigen
        stale_if_error: 86400  # 24 Stunden

# Optimierung fuer grosse Kataloge:
# - product_listing_route: [] + TTL von 30 Min
# - Vermeidet Cache-Stampede bei Massenimporten
# - Trade-off: Aenderungen erscheinen mit bis zu 30 Min Verzoegerung
