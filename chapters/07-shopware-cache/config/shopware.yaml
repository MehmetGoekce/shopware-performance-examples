# Redis-Connection für Warenkörbe und verzögerte Invalidierung
# Kapitel 7: Shopwares Application Cache meistern
#
# Kopieren nach: config/packages/shopware.yaml (in den bestehenden "shopware:"-Block)
# Benötigt: Shopware 6.6.8.0 oder neuer (shopware.redis.connections)
# Getestet mit: Shopware 6.6.10.6, Redis 7.4
#
# .env / .env.local:
#   REDIS_CRITICAL_URL=redis://127.0.0.1:6381        # Instanz mit Persistenz (volatile-lru)
#
# Wichtig: Eine Connection unter "redis.connections" bewirkt allein nichts.
# Shopware benutzt sie erst, wenn ein Subsystem sie per "connection:" referenziert.
#
# Umstellung eines laufenden Shops (Warenkörbe liegen vorher in MySQL):
#   Datei einspielen, bin/console cache:clear, dann
#   bin/console cart:migrate sql              # Warenkörbe MySQL -> Redis
#
# @see https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html
# @see https://github.com/MehmetGoekce/shopware-performance-examples

shopware:
    redis:
        connections:
            critical:
                dsn: '%env(REDIS_CRITICAL_URL)%/0'

    cart:
        storage:
            type: 'redis'
            config:
                connection: 'critical'

    # Nummernkreise NICHT ohne Übernahme der Zählerstände umstellen:
    # Redis beginnt ohne vorhandenen Key wieder beim Startwert des Nummernkreises
    # (doppelte Bestell- und Rechnungsnummern). "number-range:migrate mysql redis"
    # bricht in 6.6.10.6 ab, weil Shopware nur den konfigurierten Storage lädt.
    # Für neue Shops:
    # number_range:
    #     increment_storage: 'redis'
    #     config:
    #         connection: 'critical'

    cache:
        invalidation:
            # Verzögerte Invalidierung (Default 0 = sofort im schreibenden Request).
            # Mit einem Wert > 0 sammelt Shopware die Tags und invalidiert sie
            # gebündelt über den Scheduled Task "shopware.invalidate_cache"
            # (alle 20 s, braucht einen laufenden Worker/Scheduler) oder
            # manuell per "bin/console cache:clear:delayed".
            # Sinnvoll bei grossen Importen: ohne Verzögerung löst jedes
            # gespeicherte Produkt sofort eine Invalidierung aus.
            # Trade-off: Änderungen erscheinen erst nach dem nächsten Lauf.
            # delay: 1

            # Die Schlüssel product_listing_route, product_detail_route usw.
            # erwarten Zustände wie ['logged-in'] (Default: leer), KEINE
            # Klassennamen. Sie steuern in 6.6 den Objekt-Cache der
            # Cached*Route-Klassen und entfallen mit 6.7.
