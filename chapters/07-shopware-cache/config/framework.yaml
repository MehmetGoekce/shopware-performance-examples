# Application Cache und Sessions in Redis
# Kapitel 7: Shopwares Application Cache meistern
#
# Kopieren nach: config/packages/cache.yaml (oder in die eigene framework.yaml)
# Getestet mit: Shopware 6.6.10.6, Redis 7.4, PHP 8.3 mit redis-Extension
#
# .env / .env.local:
#   REDIS_URL=redis://127.0.0.1:6379/0            # Instanz für Caches (volatile-lru)
#   REDIS_SESSION_URL=redis://127.0.0.1:6380/0    # Instanz für Sessions (allkeys-lru)
#
# Was diese Datei bewirkt:
# - "app" auf redis_tag_aware: cache.object und cache.http nutzen "cache.app"
#   und werden damit selbst zum RedisTagAwareAdapter. Die Tags liegen als Sets
#   direkt in Redis; der Pool "cache.tags" aus Shopwares Default wird dann
#   nicht mehr als Wrapper benutzt.
# - "system" auf Redis: Symfony-Metadaten (Validator, Serializer ...) liegen
#   für alle App-Server an einer Stelle. So empfiehlt es die Shopware-Doku.
# - Die Lebensdauer der Pools bleibt Shopwares Default (172800 s = 48 h).
#   Die TTL gecachter Seiten steuert der HTTP-Cache selbst (Kapitel 6).
#
# Voraussetzungen (sonst schreibt der Cache nichts - ohne Fehlermeldung):
# - maxmemory-policy der Cache-Instanz ist "volatile-lru" (oder "noeviction").
#   Mit "allkeys-lru" verweigert RedisTagAwareAdapter jedes Speichern. Symfony
#   loggt das als Warnung, die Shopwares prod-Logging (fingers_crossed ab Level
#   error) verschluckt - der Shop läuft dann einfach ohne Cache.
#   Siehe redis/redis-cache.conf
#
# Achtung bei Redis: "bin/console cache:clear" leert Object- und HTTP-Cache
# NICHT (die liegen nicht mehr unter var/cache/). Dafür:
#   bin/console cache:clear:all    # alle Shopware-Pools
#   bin/console cache:clear:http   # nur HTTP-Cache (ab 6.6.10.0)
#
# @see https://developer.shopware.com/docs/guides/hosting/performance/caches.html
# @see https://developer.shopware.com/docs/guides/hosting/performance/session.html
# @see https://github.com/MehmetGoekce/shopware-performance-examples

framework:
    cache:
        app: cache.adapter.redis_tag_aware
        system: cache.adapter.redis_tag_aware
        default_redis_provider: '%env(REDIS_URL)%'

    session:
        # Redis-DSN statt Service-ID: Symfony baut daraus den RedisSessionHandler
        # (Keys "sf_s<id>", TTL = session.gc_maxlifetime). Kein Session-Locking.
        handler_id: '%env(REDIS_SESSION_URL)%'
