# Redis Server-Optimierung fuer Shopware Cache
# Kopieren nach: /etc/redis/redis.conf
# Nach Aenderungen: sudo systemctl restart redis-server

# ==============================================================================
# SPEICHER
# ==============================================================================

# Speicher-Limit (anpassen an verfuegbaren Server-RAM)
# Empfehlung: 25-50% des verfuegbaren RAMs
maxmemory 2gb

# Eviction-Policy: Least Recently Used
# Wenn Speicher voll ist, werden aelteste Keys geloescht
maxmemory-policy allkeys-lru

# Sample-Groesse fuer LRU-Algorithmus (hoeher = genauer, langsamer)
maxmemory-samples 10

# ==============================================================================
# PERSISTENZ (Fuer reinen Cache deaktivieren)
# ==============================================================================

# RDB Snapshots deaktivieren (schneller, aber keine Persistenz)
save ""

# AOF Persistenz deaktivieren
appendonly no

# ==============================================================================
# NETZWERK
# ==============================================================================

# Nur lokale Verbindungen (Sicherheit)
bind 127.0.0.1
protected-mode yes

# Standard-Port
port 6379

# TCP-Keepalive (Sekunden)
tcp-keepalive 300

# Max gleichzeitige Clients
maxclients 10000

# ==============================================================================
# PERFORMANCE
# ==============================================================================

# Lazy Freeing (Hintergrund-Speicherfreigabe)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# IO Threads (nur Redis 6+)
# io-threads 4
# io-threads-do-reads yes

# ==============================================================================
# LOGGING
# ==============================================================================

# Log-Level: debug, verbose, notice, warning
loglevel notice

# Log-Datei (leer = stdout)
logfile /var/log/redis/redis-server.log

# ==============================================================================
# SICHERHEIT
# ==============================================================================

# Passwort (empfohlen fuer Produktion)
# requirepass IhrSicheresPasswort

# Gefaehrliche Befehle umbenennen/deaktivieren
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
# Fuer Entwicklung wieder aktivieren:
# rename-command FLUSHDB "FLUSHDB_DEV"
