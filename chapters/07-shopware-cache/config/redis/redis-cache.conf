# Redis-Instanz für Caches (Object-Cache, HTTP-Cache, System-Pool)
# Kapitel 7: Shopwares Application Cache meistern
#
# Datenkategorie laut Shopware-Doku: flüchtig ("ephemeral") - jederzeit neu erzeugbar.
# Kopieren nach: /etc/redis/redis-cache.conf  (eigene Instanz, eigener Port)
# Getestet mit: Redis 7.4 (redis:7-alpine), Shopware 6.6.10.6
#
# @see https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html
# @see https://github.com/MehmetGoekce/shopware-performance-examples

port 6379
bind 127.0.0.1 -::1
protected-mode yes

# Speicher-Limit an den Server anpassen. Ein voller Cache-Redis ist normal.
maxmemory 1gb

# PFLICHT für cache.adapter.redis_tag_aware: volatile-lru (oder noeviction).
# Mit allkeys-lru speichert Symfonys RedisTagAwareAdapter nichts mehr -
# ohne Fehlermeldung, der Shop läuft dann ohne Cache.
maxmemory-policy volatile-lru

# Keine Persistenz: Cache-Daten lassen sich neu erzeugen.
save ""
appendonly no

# Speicher im Hintergrund freigeben
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# Hinweis: Die Tag-Listen (Keys mit "tags" im Namen) haben keine TTL und
# werden von volatile-lru nie verdrängt. Regelmässig aufräumen, z. B. mit
# FroshTools (bin/console frosh:redis-tag:cleanup) - siehe
# scripts/redis-diagnostics.sh (Anteil Keys ohne TTL).
