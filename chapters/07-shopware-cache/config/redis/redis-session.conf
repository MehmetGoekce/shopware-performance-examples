# Redis-Instanz für Sessions
# Kapitel 7: Shopwares Application Cache meistern
#
# Datenkategorie laut Shopware-Doku: dauerhaft, aber «alternd» - Verlust
# meldet Kunden ab, ältere Sessions sind weniger wichtig.
# Kopieren nach: /etc/redis/redis-session.conf  (eigene Instanz, eigener Port)
# Getestet mit: Redis 7.4 (redis:7-alpine), Shopware 6.6.10.6
#
# @see https://developer.shopware.com/docs/guides/hosting/performance/session.html
# @see https://github.com/MehmetGoekce/shopware-performance-examples

port 6380
bind 127.0.0.1 -::1
protected-mode yes

maxmemory 512mb

# Bei vollem Speicher die am längsten unbenutzten Sessions verdrängen
maxmemory-policy allkeys-lru

# Persistenz, damit ein Neustart nicht alle Kunden abmeldet
save 3600 1 300 100 60 10000
appendonly yes
appendfsync everysec
