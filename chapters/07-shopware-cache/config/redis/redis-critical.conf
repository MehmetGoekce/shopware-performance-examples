# Redis-Instanz für Warenkörbe (und bei Neuinstallation Nummernkreise)
# Kapitel 7: Shopwares Application Cache meistern
#
# Datenkategorie laut Shopware-Doku: dauerhaft und kritisch - Verlust ist Datenverlust.
# Kopieren nach: /etc/redis/redis-critical.conf  (eigene Instanz, eigener Port)
# Getestet mit: Redis 7.4 (redis:7-alpine), Shopware 6.6.10.6
#
# @see https://developer.shopware.com/docs/guides/hosting/infrastructure/redis.html
# @see https://github.com/MehmetGoekce/shopware-performance-examples

port 6381
bind 127.0.0.1 -::1
protected-mode yes

maxmemory 256mb

# Nur Keys mit TTL verdrängen. Warenkörbe haben eine TTL (cart.expire_days),
# Nummernkreis-Zähler nicht - die bleiben so geschützt.
maxmemory-policy volatile-lru

save 3600 1 300 100 60 10000
appendonly yes
appendfsync everysec
