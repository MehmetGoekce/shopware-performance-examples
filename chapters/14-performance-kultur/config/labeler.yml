# Ablage im Shop-Repository: .github/labeler.yml — Kapitel 14
#
# Konfiguration fuer actions/labeler (Format ab v5: changed-files /
# any-glob-to-any-file). Die Pfade folgen einem Shopware-Projekt: eigener
# Code liegt in custom/plugins/<Name>/ oder custom/static-plugins/<Name>/,
# nicht in src/ wie im Shopware-Core. Apps (custom/apps/) deckt es nicht ab.
# Die Labels muessen im Repository angelegt sein.
#
# @see https://github.com/actions/labeler/tree/v7.0.0#readme

performance-critical:
  - changed-files:
      - any-glob-to-any-file:
          - 'custom/{plugins,static-plugins}/*/src/Resources/app/storefront/**/*.{js,ts,scss}'
          - 'custom/{plugins,static-plugins}/*/src/Resources/views/**/*.twig'

performance-review-needed:
  - changed-files:
      - any-glob-to-any-file:
          - 'custom/{plugins,static-plugins}/*/src/**/*.php'
          - 'composer.json'
          - 'composer.lock'
          - '**/package.json'
          - '**/webpack.config.js'
