# Error Budget Policy
#
# Definiert die Regeln für Performance Error Budgets
# basierend auf Google SRE Prinzipien.
#
# Anpassen an Ihre SLOs und Business-Anforderungen.

policy:
  name: "Shopware Performance Error Budget Policy"
  version: "1.0"
  effective_date: "2024-01-01"
  owner: "Performance Champion / Engineering Lead"
  review_frequency: "Quarterly"

# Service Level Objectives (SLOs)
slos:
  core_web_vitals:
    lcp:
      metric: "Largest Contentful Paint (p75)"
      target: 2500  # ms
      unit: "milliseconds"
      measurement: "RUM p75 über 28 Tage"

    cls:
      metric: "Cumulative Layout Shift (p75)"
      target: 0.1
      unit: "score"
      measurement: "RUM p75 über 28 Tage"

    inp:
      metric: "Interaction to Next Paint (p75)"
      target: 200  # ms
      unit: "milliseconds"
      measurement: "RUM p75 über 28 Tage"

  availability:
    metric: "Storefront Availability"
    target: 99.9  # Prozent
    unit: "percent"
    measurement: "Uptime über 30 Tage"
    # 99.9% = 43.2 Minuten Downtime in 30 Tagen erlaubt

# Error Budget Berechnung
error_budget:
  # Core Web Vitals; Verfügbarkeit über ihre eigenen 30 Tage (siehe oben)
  calculation_period: "28 Tage (rolling, wie der Chrome UX Report)"

  # Wie wird das Budget berechnet?
  formula: |
    Für jeden SLO:
    - Total Samples = Seitenaufrufe im Zeitraum (je Seitenaufruf die letzte Meldung)
    - Violations = Seitenaufrufe über der Schwelle
    - Error Rate = Violations / Total Samples
    - Budget Used = Error Rate / (1 - SLO Target)

    Core Web Vitals: "p75 <= Schwelle" heisst SLO Target 75 %,
    also dürfen 25 % der Seitenaufrufe über der Schwelle liegen.
    - Bei 10 % über 2500 ms LCP: Budget 40 % verbraucht
    - Bei 12.5 % über 2500 ms LCP: Budget 50 % verbraucht
    - Bei 25 % über 2500 ms LCP: Budget 100 % verbraucht, p75 gerade noch "gut"
    - Darüber: SLO verletzt
    Rechnung: src/PerformanceBudgetService.php, Aufruf: scripts/error-budget.php
    (tests/Unit/PerformanceBudgetTest.php rechnet diese Zeilen nach)

    Verfügbarkeit, dieselbe Formel mit SLO Target 99.9 %:
    - Erlaubte Fehler: 0.1 % = 1 von 1000 Requests
    - Bei 0.05 % Fehlerrate: Budget 50 % verbraucht
    - Bei 0.1 % Fehlerrate: Budget 100 % verbraucht
    Die 0.1 % gelten nur hier. Auf die Core Web Vitals übertragen, wäre das
    Budget 250-mal zu klein: Ein Shop mit gerade noch gutem p75 (25 % über
    der Schwelle) stünde bei 25000 % verbraucht. Die Verfügbarkeit rechnet
    der Companion nicht aus, sie kommt aus Ihrem Uptime-Monitoring.

  aggregation: |
    Overall Budget = Minimum aller einzelnen Budgets
    (Worst performing SLO bestimmt Gesamtstatus)

# Policy-Stufen
policy_levels:

  green:
    condition: "Budget Remaining > 50%"
    actions:
      development:
        - "Normale Feature-Entwicklung"
        - "Experimente erlaubt"
        - "Refactoring erlaubt"
      releases:
        - "Normale Release-Kadenz"
        - "Standard Review-Prozess"
      monitoring:
        - "Standard-Alerts"
        - "Weekly Dashboard Review"

  yellow:
    condition: "Budget Remaining 20-50 %"
    actions:
      development:
        - "Vorsichtige Feature-Entwicklung"
        - "Performance-Impact-Assessment für neue Features"
        - "Keine großen Refactorings ohne Performance-Review"
      releases:
        - "Zusätzlicher Performance-Review vor Release"
        - "Rollback-Plan dokumentiert"
        - "Längere Bake-Time vor dem vollen Rollout"
      monitoring:
        - "Erhöhte Alert-Sensitivität"
        - "Täglicher Dashboard Review"
        - "Champion wird informiert"
    communication:
      - "Team wird informiert"
      - "Slack-Update in #performance"

  orange:
    condition: "Budget Remaining 0 bis unter 20 % (p75 noch gut)"
    actions:
      development:
        - "Performance-Fokus hat Priorität"
        - "50% der Sprint-Kapazität für Performance"
        - "Neue Features nur mit positivem Performance-Impact"
      releases:
        - "Nur kritische Fixes und Performance-Verbesserungen"
        - "Extended Review durch Champion und Lead"
        - "Canary Deployments mandatory"
      monitoring:
        - "Echtzeit-Monitoring während Releases"
        - "Stündlicher Dashboard Review"
    communication:
      - "Engineering Lead wird informiert"
      - "Stakeholder-Update"
      - "Daily Standup: Performance-Status"

  red:
    condition: "Budget überzogen (unter 0 %, p75 nicht mehr gut)"
    actions:
      development:
        - "Feature Freeze"
        - "100% Fokus auf Performance-Recovery"
        - "War Room Setup"
      releases:
        - "Nur P0/Security Fixes"
        - "Jeder Release benötigt Lead-Approval"
        - "Mandatory Rollback-Bereitschaft"
      monitoring:
        - "Kontinuierliche Überwachung"
        - "Incident Commander assigned"
    communication:
      - "Management wird informiert"
      - "Incident-Prozess aktiviert"
      - "Postmortem nach Recovery"

# Ausnahmen
exceptions:
  security:
    description: "Security-Fixes sind immer erlaubt"
    approval: "Security Lead"
    documentation: "Security-Ticket referenzieren"

  p0_incidents:
    description: "P0 Production Incidents"
    approval: "Engineering Lead"
    documentation: "Incident-Ticket referenzieren"

  business_critical:
    description: "Business-kritische Releases"
    approval: "VP Engineering + Product"
    documentation: "Business-Justification dokumentieren"
    note: "Sollte selten sein - Budget wird trotzdem belastet"

# Reporting
reporting:
  dashboard:
    location: "php scripts/error-budget.php <shopware-verzeichnis> + bin/console rum:report (Kapitel 12), oder das Dashboard Ihres Managed-RUM-Anbieters"
    refresh: "Täglich (cron)"
    access: "Gesamtes Engineering Team"

  weekly_report:
    format: "Slack-Post in #performance"
    content:
      - "Aktueller Budget-Status"
      - "Trend (besser/schlechter)"
      - "Nächste Aktionen"
    owner: "Performance Champion"

  monthly_report:
    format: "Confluence / Notion Page"
    content:
      - "Budget-Verlauf"
      - "SLO-Performance"
      - "Incidents und Impact"
      - "Aktionen und Ergebnisse"
    audience: "Engineering + Product + Stakeholder"
    owner: "Engineering Lead"

# Review und Anpassung
review:
  frequency: "Quarterly"
  participants:
    - "Engineering Lead"
    - "Performance Champions"
    - "Product Owner"

  topics:
    - "Sind SLOs noch angemessen?"
    - "Ist die Berechnung korrekt?"
    - "Funktionieren die Policies?"
    - "Feedback vom Team"

  adjustment_process:
    - "Änderungsvorschlag dokumentieren"
    - "Impact-Analyse"
    - "Stakeholder-Abstimmung"
    - "Kommunikation an Team"
    - "Dokumentation aktualisieren"
