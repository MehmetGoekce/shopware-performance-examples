    learnings:
      - "Contingency wurde gebraucht (60%)"
      - "Für Peak-Saison mehr Buffer"
      - "Consultant für spezifische Probleme wertvoll"

# ============================================================
# ROI-Analyse
# ============================================================
roi_analysis:
  investment:
    total: 47500
    description: "Gesamtausgaben Performance"

  returns:
    conversion_improvement:
      metric: "Conversion Rate"
      before: 2.5%
      after: 3.1%
      improvement: "+24%"
      estimated_revenue_impact: 180000  # CHF

    bounce_rate_reduction:
      metric: "Mobile Bounce Rate"
      before: 45%
      after: 32%
      improvement: "-29%"
      estimated_revenue_impact: 45000  # CHF

    operational_savings:
      items:
        - "Weniger Support-Tickets (Performance-bezogen): CHF 8.000"
        - "Effizientere Server-Nutzung: CHF 5.000"
        - "Schnellere Development: CHF 12.000"
      total: 25000

  summary:
    total_return: 250000  # CHF
    roi: "426%"  # (250000 - 47500) / 47500
    payback_period: "3 Monate"

