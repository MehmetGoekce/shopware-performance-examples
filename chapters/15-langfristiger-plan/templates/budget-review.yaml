  what_worked:
    - "Open Source RUM statt teures SaaS"
    - "Champions-Programm für Skalierung"
    - "Quarterly Reviews für Korrekturen"
    - "Black Friday Preparation 2 Monate vorher"

  what_didnt_work:
    - "Zu späte CDN-Skalierung"
    - "Unterschätzte Redis-Komplexität"
    - "Konferenz-Buchung zu kurzfristig"

  surprises:
    - "Traffic-Wachstum +20% über Prognose"
    - "Edge Functions weniger relevant als gedacht"
    - "Developer-Schulungen haben hohen ROI"

  changes_for_next_year:
