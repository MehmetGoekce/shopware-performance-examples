# Section 18.5 — German compound-word splitting (Decompounder)
#
# Why: lexical search misses "Kinderschuhe" when the customer types
# "Schuhe". The dictionary_decompounder splits compounds against a word
# list ("Kinderschuhe" -> "Kinder" + "Schuhe" because both stems are in
# the dictionary). Pragmatic default for ~80% of shops: only ONE file
# (the word list), simpler deployment than hyphenation_decompounder.
#
# Drop this analysis block into config/packages/elasticsearch.yaml under
# elasticsearch.index_settings.analysis (merge with the existing one).
#
# word_list_path is relative to the ES `config` dir, NO leading slash.
# Place the file on the ES host (see scripts/extract-dictionary.sh):
#   /etc/elasticsearch/analysis/de_dictionary.txt   (ES)
#   /etc/opensearch/analysis/de_dictionary.txt      (OpenSearch)
#
# DIE WORTLISTE MUSS KLEINGESCHRIEBEN SEIN. Der dictionary_decompounder
# vergleicht ohne Ruecksicht auf Gross-/Kleinschreibung nicht — er baut ein
# CharArraySet mit ignoreCase=false. Der lowercase-Filter laeuft in der Kette
# unten VOR ihm, also trifft eine Liste mit grossen Substantiven
# ("Schuhe" aus de_DE.dic) nie. Gemessen gegen ES 8.15.3:
#   grosse Liste: "Kinderschuhe" -> [kinderschuh]
#   kleine Liste: "Kinderschuhe" -> [kinderschuh, kind, schuh, schuh]
# extract-dictionary.sh erledigt das und bricht ab, wenn es nicht gelingt.
#
# ZUR REIHENFOLGE unten: Der Decompounder steht bewusst VOR dem Stemmer —
# die Empfehlung stimmt, die Begruendung in der ersten Fassung nicht.
#
# Dort stand, Stemmer-zuerst verliere "Jacke" aus "Winterjacke". Mit der
# Wortliste, die extract-dictionary.sh aus dem LibreOffice-Woerterbuch baut,
# stimmt das nicht: dort steht "jacke" drin, und eine Suche nach "Jacke"
# trifft in BEIDEN Reihenfolgen, weil der Stemmer die Anfrage ebenfalls auf
# "jack" bringt.
#
# Was wirklich bricht, ist die andere Richtung — gemessen gegen ES 8.15.3 mit
# derselben Kette auf Index- und Abfrageseite:
#
#   Decompounder zuerst: "Winterjacke" -> [winterjack, wint, jack]
#     Anfrage "Jacke"  -> [jack]   Treffer
#     Anfrage "Winter" -> [wint]   Treffer
#   Stemmer zuerst:      "Winterjacke" -> [winterjack, winter, jack]
#     Anfrage "Jacke"  -> [jack]   Treffer
#     Anfrage "Winter" -> [wint]   KEIN Treffer
#
# Im Index steht dann "winter", die Anfrage kommt als "wint" an: Der Stemmer
# laeuft auf der Anfrage vor dem Decompounder, und ein Wort mit vier Zeichen
# zerlegt der Decompounder wegen min_word_size nicht mehr. Index- und
# Abfrageseite driften auseinander — und zwar lautlos.
#
# Noch ein Effekt der echten Liste, den eine Spielzeugliste nicht zeigt:
# Bei 163 000 Staemmen und min_subword_size 3 faellt reichlich Unsinn an.
# "Kinderschuhe" ergibt [kinderschuh, kind, kind, ind, ind, der, schuh] —
# "ind" und "der" stehen als eigene Staemme in der Liste. Das kostet
# Indexgroesse und erzeugt Zufallstreffer; wer das nicht will, hebt
# min_subword_size auf 4 und misst nach.
#
# Und noch ein betrieblicher Punkt: index.analysis.* ist ein STATISCHES
# Setting. Ein neuer Analyzer laesst sich an einem offenen Index nicht
# setzen — entweder `POST /<index>/_settings?reopen=true` oder Index
# schliessen, setzen, oeffnen. In der Shopware-Praxis heisst das ohnehin:
# neuer Analyzer, dann `bin/console es:index` (legt einen frischen Index an).

elasticsearch:
    index_settings:
        analysis:
            analyzer:
                german_decompound_analyzer:
                    type: 'custom'
                    tokenizer: 'standard'
                    filter:
                        - 'lowercase'
                        - 'german_decompounder'
                        - 'german_normalization'
                        - 'german_stemmer'

            filter:
                # Default: dictionary-only split (one file, simple deploy)
                german_decompounder:
                    type: 'dictionary_decompounder'
                    word_list_path: 'analysis/de_dictionary.txt'
                    min_word_size: 5
                    min_subword_size: 3

                # Advanced alternative — better recall on rare/long
                # compounds, but TWO files and a HARD FOP v1.2 pin:
                # Elastic supports only FOP v1.2-compatible hyphenation
                # patterns; v2.0+ fails at index start. Get de.xml from
                # OFFO v1.2 (sourceforge.net/projects/offo).
                #
                # german_decompounder:
                #     type: 'hyphenation_decompounder'
                #     word_list_path: 'analysis/de_dictionary.txt'
                #     hyphenation_patterns_path: 'analysis/de.xml'
                #     min_word_size: 5
                #     min_subword_size: 3
