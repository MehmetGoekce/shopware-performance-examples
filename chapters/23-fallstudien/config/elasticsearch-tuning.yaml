# Fallstudie 3: Elasticsearch-Tuning für B2B
# Kapitel 23: Reale Fallstudien aus 26 Jahren
#
# Optimierte ES-Konfiguration für B2B-Shop mit 450.000 Produkten.
# Ergebnis: Suche von 12 Sekunden auf 180ms

# Elasticsearch-Konfiguration (separates Bundle, Root-Key: 'elasticsearch')
elasticsearch:
    enabled: true
    indexing_enabled: true
    index_prefix: 'sw'

    # Hosts (Cluster für Production)
    hosts: 'elasticsearch:9200'

    # Indexing batch size für große Kataloge
    indexing_batch_size: 500

    # Index-Einstellungen
    index_settings:
            # Mehr Shards für große Kataloge
            number_of_shards: 3
            number_of_replicas: 1

            # Refresh-Interval (höher = weniger I/O)
            refresh_interval: '5s'

            # Analyzer für deutsche Produktsuche
            analysis:
                analyzer:
                    german_product:
                        type: custom
                        tokenizer: standard
                        filter:
                            - lowercase
                            - german_normalization
                            - german_stemmer

                filter:
                    german_stemmer:
                        type: stemmer
                        language: light_german

    # Produkt-Index: Custom Fields Mapping
    # Für erweiterte Mappings: ElasticsearchCustomFieldsMappingEvent verwenden
    product:
        custom_fields_mapping:
            technical_specs:
                type: text

# Elasticsearch Server-Settings (elasticsearch.yml)
# Diese Werte im ES-Container/Server setzen:
#
# indices.memory.index_buffer_size: 30%
# indices.queries.cache.size: 20%
# thread_pool.search.size: 13
# thread_pool.search.queue_size: 1000

# Query-Optimierung (in Custom ProductSearchBuilder)
# - bool-Query statt simple_query_string
# - function_score für Relevanz-Boost
# - Highlighting nur wenn benötigt

# Caching-Strategie
# - Redis-Cache vor ES für häufige Suchen
# - Query-Result-Cache in ES aktivieren
# - Autocomplete mit separatem Index
