version: '3.8'

services:
  app:
    image: dockware/dev:6.5.8.0
    container_name: shopware-performance
    ports:
      - "8000:80"
      - "8443:443"
      - "3306:3306"
      - "9998:9998"  # Admin Watcher
      - "9999:9999"  # Storefront Watcher
    environment:
      - XDEBUG_ENABLED=0
      - PHP_VERSION=8.2
      - COMPOSER_VERSION=2
    volumes:
      - ./src:/var/www/html/custom/plugins/PerformanceExamples/src
      - ./config/packages:/var/www/html/config/packages/custom
      - shopware_data:/var/www/html
    networks:
      - shopware

  redis:
    image: redis:7-alpine
    container_name: shopware-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shopware
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mailhog:
    image: mailhog/mailhog
    container_name: shopware-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - shopware

volumes:
  shopware_data:
  redis_data:

networks:
  shopware:
    driver: bridge
